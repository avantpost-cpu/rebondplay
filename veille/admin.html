<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Rebond Veille</title><style>
:root{font-family:Poppins,Arial,sans-serif;color:#06445a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#b18dbd url('../pagefull/fondfull.png') center/cover fixed}header{background:#f4f0e9;padding:20px clamp(20px,5vw,70px);display:flex;align-items:center;justify-content:space-between;gap:15px}header h1{font-size:clamp(22px,3vw,38px);margin:0}a{color:inherit}main{max-width:1180px;margin:50px auto;padding:0 20px}.paper{background:#f4f0e9 url('../fond.jpg') center/cover;border-radius:24px;padding:clamp(20px,4vw,45px);box-shadow:0 15px 20px #24303d40}h2{margin-top:0}label{display:block;font-weight:700;margin:15px 0 6px}input,select,textarea{font:inherit;width:100%;border:1px solid #9bbbc1;border-radius:9px;padding:12px;background:white;color:#06445a}button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#e87943;color:white}button.secondary{background:#dbe6e8;color:#06445a}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stat{padding:20px;background:#fff9;border-radius:14px}.stat strong{display:block;font-size:30px}.entry{background:#fff9;border-radius:12px;padding:15px;margin:12px 0}.entry small{display:block;margin:6px 0}.muted{opacity:.75}.error{color:#b72e25;font-weight:700}.ok{color:#206c4b;font-weight:700}[hidden]{display:none!important}dialog{border:0;border-radius:20px;padding:30px;max-width:650px;width:calc(100% - 30px);max-height:85vh;overflow:auto;color:#06445a}dialog::backdrop{background:#001d2caa}@media(max-width:700px){.grid{grid-template-columns:1fr}header{display:block}}
</style></head><body><header><h1>Administration · Rebond Veille</h1><a href="./">Retour à la veille</a></header><main><section class="paper"><div id="login"><h2>Accès administrateur</h2><p>Connexion réservée à l'administration Rebond, indépendante du mot de passe partagé.</p><form id="send"><label for="password">Mot de passe administrateur</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button type="submit">Accéder à l’administration</button></div></form><p id="loginNotice" role="status"></p></div><div id="dashboard" hidden><div class="actions" style="justify-content:space-between"><h2>Tableau de bord</h2><button class="secondary" id="logout">Se déconnecter</button></div><div class="grid"><div class="stat">Ressources<strong id="total">—</strong></div><div class="stat">Rubriques<strong id="rubrics">—</strong></div><div class="stat">À traiter<strong id="todo">—</strong></div></div><div class="actions"><button id="refresh">Actualiser</button><button class="secondary" id="showDeleted">Voir les ressources supprimées</button></div><h2>Gestion des billets</h2><input id="search" type="search" placeholder="Rechercher un billet…"><div id="entries"></div><p id="adminNotice" role="status"></p></div></section></main><dialog id="editDialog"><form id="editForm"><h2>Modifier le billet</h2><input type="hidden" name="id"><label>Titre<input name="titre" required></label><label>Rubrique<select name="rubrique_id" id="editRubric"></select></label><label>Type de contenu<select name="type_contenu" id="editType"><option value="">Choisir</option><option>Article</option><option>Publication</option><option>Livre</option><option>Vidéo</option><option>Podcast</option><option>Outil pédagogique</option><option>Événement</option><option>Formation</option><option>Autre</option></select></label><label>Résumé<textarea name="resume" rows="4"></textarea></label><label>Source<input name="source"></label><label>URL<input name="url" type="url"></label><label>Statut<select name="statut"><option value="nouvelle">Nouvelle</option><option value="a_traiter">À traiter</option><option value="en_cours">En cours</option><option value="traitee">Traitée</option><option value="archivee">Archivée</option></select></label><label>Priorité<select name="priorite"><option value="normale">Normale</option><option value="haute">Haute</option><option value="basse">Basse</option></select></label><div class="actions"><button type="button" class="secondary" id="cancel">Annuler</button><button type="submit">Enregistrer</button></div><p id="editNotice" role="status"></p></form></dialog><script>
const rubricColors=["#1B5F6E","#E57C61","#D5A13A","#7C9A74","#8A75A4","#D78B9C","#538DA9","#B86B50","#9B9A54","#6778A4","#A47C68"];
const rubricNames=['Veille juridique','Actualités','Actualités européennes','Livres et publications','Films et podcasts','Outils pédagogiques','Événements et formations','Réseaux sociaux','Acteurs et initiatives','Bonnes pratiques','Appels à projets (AAP)'];
const base='https://tdsrqmpfdvntybdlvejy.supabase.co',key='sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO',$=id=>document.getElementById(id);let rows=[],rubriques=[],deleted=false,token=sessionStorage.getItem('rebond_veille_admin_token')||'';
async function api(action,extra={}){const res=await fetch(base+'/functions/v1/veille-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({action,token,...extra})});const body=await res.json();if(!res.ok)throw Error(body.error||'Erreur administrateur');return body}
async function openDashboard(){$('login').hidden=true;$('dashboard').hidden=false;await load()}
async function load(){try{const r=await api('list',{deleted});rows=r.data||[];rubriques=r.rubriques||[];$('total').textContent=r.total??rows.length;$('rubrics').textContent=rubriques.length;$('todo').textContent=r.todo??rows.filter(x=>x.statut==='nouvelle').length;render();$('adminNotice').textContent=''}catch(e){$('adminNotice').textContent=e.message+' — Le service administrateur doit être activé côté Supabase.'}}
function render(){const list=$('entries');list.replaceChildren();const q=$('search').value.toLowerCase();for(const r of rows.filter(x=>(x.titre||'').toLowerCase().includes(q))){const item=document.createElement('article');item.className='entry';const rubricName=rubriques.find(x=>x.id===r.rubrique_id)?.nom||'';item.style.borderLeft='7px solid '+(rubricColors[rubricNames.indexOf(rubricName)]||'#E57C61');const title=document.createElement('strong');title.textContent=r.titre;const meta=document.createElement('small');meta.textContent=[rubriques.find(x=>x.id===r.rubrique_id)?.nom,r.statut,r.cree_par_label].filter(Boolean).join(' · ');const buttons=document.createElement('div');buttons.className='actions';const edit=document.createElement('button');edit.textContent='Modifier';edit.disabled=!!r.deleted_at;edit.onclick=()=>editRow(r);const del=document.createElement('button');del.className='secondary';del.textContent=r.deleted_at?'Restaurer':'Supprimer';del.onclick=async()=>{if(!confirm((r.deleted_at?'Restaurer':'Supprimer')+' ce billet ?'))return;try{await api(r.deleted_at?'restore':'delete',{id:r.id});await load()}catch(e){$('adminNotice').textContent=e.message}};buttons.append(edit,del);item.append(title,meta,buttons);list.append(item)}if(!list.children.length)list.textContent='Aucun billet.'}
function editRow(r){const f=$('editForm');for(const [k,v]of Object.entries(r)){const field=f.elements.namedItem(k);if(field&&'value'in field)field.value=v??''}const select=$('editRubric');select.replaceChildren();rubriques.forEach(x=>select.add(new Option(x.nom,x.id)));select.value=r.rubrique_id;$('editNotice').textContent='';$('editDialog').showModal()}
$('send').onsubmit=async e=>{e.preventDefault();$('loginNotice').textContent='Vérification…';try{const r=await api('login',{password:$('password').value});token=r.token;sessionStorage.setItem('rebond_veille_admin_token',token);$('password').value='';$('loginNotice').textContent='';await openDashboard()}catch(err){$('loginNotice').textContent=err.message}};
$('logout').onclick=()=>{token='';sessionStorage.removeItem('rebond_veille_admin_token');$('dashboard').hidden=true;$('login').hidden=false};
$('refresh').onclick=load;$('search').oninput=render;$('showDeleted').onclick=()=>{deleted=!deleted;$('showDeleted').textContent=deleted?'Voir les ressources actives':'Voir les ressources supprimées';load()};$('cancel').onclick=()=>$('editDialog').close();$('editForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());const id=f.id;delete f.id;try{await api('update',{id,changes:f});$('editDialog').close();await load()}catch(err){$('editNotice').textContent=err.message}};if(token)openDashboard();</script></body></html>
