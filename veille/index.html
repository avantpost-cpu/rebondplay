<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rebond Veille</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#063e54;--blue:#065269;--orange:#f47c4b;--paper:#f7f4ef;--yellow:#efb416}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#1b5f6e url('../pagefull/fondfull.png') center top/cover fixed;font-family:Nunito,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 5%;background:#f7f4ef url('../fond.jpg') center/cover;box-shadow:0 6px 18px #0003}.brand{width:min(300px,43vw)}.brand img{width:100%}.top{position:relative;min-height:125px}.headtitle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:34%;max-height:100px;object-fit:contain}.brand{position:relative;z-index:1}.admin-entry{position:relative;z-index:2;margin-left:auto;color:#065269;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.02em;border-bottom:1px solid currentColor;padding:5px 0}.admin-entry:hover{color:#e36d40}.admin-entry:focus-visible{outline:3px solid #e36d40;outline-offset:5px}@media(max-width:700px){.top{min-height:110px}.headtitle{max-width:42%;max-height:75px}.brand{width:38vw}}.wrap{max-width:1350px;margin:auto;padding:45px 26px 90px}.intro{display:flex;align-items:center;justify-content:space-between;gap:30px;margin-bottom:30px}.intro h1{color:#fff;font-size:clamp(38px,6vw,80px);line-height:1;margin:0;font-weight:900;text-shadow:0 5px 0 #063e54}.intro p{color:#fff;font-family:'Patrick Hand',cursive;font-size:clamp(20px,2.4vw,31px);margin:10px 0}.stamp{background:var(--yellow);color:var(--ink);padding:15px 24px;transform:rotate(4deg);box-shadow:6px 8px 0 #063e54;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin:20px 0 38px}.card{border:0;text-align:left;aspect-ratio:1.55;min-height:0;padding:0;position:relative;border-radius:0;overflow:visible;background:transparent;box-shadow:none;transition:transform .2s}.card:hover{transform:translateY(-5px)}.card img{display:block;position:static;width:100%;height:100%;object-fit:contain;filter:drop-shadow(7px 10px 6px rgba(0,27,36,.38));transition:filter .2s ease}.card:hover img{filter:drop-shadow(9px 13px 8px rgba(0,27,36,.46))}.paper{background:var(--paper) url('../fond.jpg') center center/cover no-repeat;border-radius:23px;padding:30px;box-shadow:0 9px 16px #0004}.paper h2{margin:0 0 15px;font-size:29px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.toolbar input,.toolbar select{border:2px solid #b5d0d3;border-radius:11px;padding:13px 15px;background:#fff;color:var(--ink)}.toolbar input{flex:1;min-width:220px}.add{border:0;border-radius:12px;padding:13px 22px;background:var(--orange);font-weight:900;color:#fff}.list{display:grid;gap:10px}.item{background:#fff;border-radius:12px;padding:18px 20px;border-left:8px solid var(--orange);display:flex;justify-content:space-between;gap:20px;align-items:center}.item strong{display:block}.item small{color:#536c74}.empty{padding:20px;border:2px dashed #b5d0d3;border-radius:14px}.foot{color:#fff;text-align:center;margin-top:32px;font-size:13px}.hidden{display:none}dialog{border:0;border-radius:20px;padding:30px;width:min(520px,92vw);box-shadow:0 12px 50px #0008}dialog::backdrop{background:#002d3dbb}dialog label{display:block;margin:14px 0 5px;font-weight:800}dialog input,dialog select{width:100%;padding:12px;border:1px solid #b5d0d3;border-radius:9px}dialog menu{display:flex;justify-content:flex-end;gap:10px;padding:0;margin:24px 0 0}dialog button{padding:11px 17px;border-radius:9px;border:0}dialog .add{color:white}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.intro{align-items:flex-start}.stamp{display:none}}@media(max-width:540px){.cards{grid-template-columns:1fr}.card{min-height:0}.top{padding:15px}.paper{padding:19px}.intro h1{font-size:42px}}
 .rubric-tag{display:inline-block;margin:6px 0;padding:4px 10px;border-radius:5px;color:#fff;font-size:12px;font-weight:900}.rubric-nav button{border-top:5px solid var(--rubric-color)!important;padding-top:8px!important}.rubric-nav button.active{text-decoration-color:var(--rubric-color)!important} .item{display:flex!important;align-items:flex-start;gap:20px}.item-content{flex:1;min-width:0}.resource-cover{width:112px;max-height:155px;object-fit:contain;flex-shrink:0;border-radius:4px;box-shadow:2px 4px 9px #0002;background:#f6f4ee}@media(max-width:540px){.resource-cover{width:78px;max-height:115px}.item{gap:12px}}</style></head><body>
<header class="top"><a class="brand" href="../pagefull/"><img src="../Veille/logo_rebond_veille.png" alt="RebondPlay"></a><img class="headtitle" src="../Veille/titretetiere.png" alt="Titre Rebond Veille"><a class="admin-entry" href="./admin.html">Administration</a></header>
<main class="wrap">
<nav class="rubric-nav" id="rubricNav" aria-label="Les onze rubriques de veille"></nav>
<section class="cards" aria-label="Navigation"><button class="card" data-go="bibliotheque"><img src="../Veille/bouton_bibliotheque.png" alt=""></button><button class="card" data-go="suivi"><img src="../Veille/bouton_suivi.png" alt=""></button><button class="card" data-go="ajouter"><img src="../Veille/bouton_ajouter.png" alt=""></button><button class="card" data-go="evenements"><img src="../Veille/bouton_avenir.png" alt=""></button></section>
<section class="paper" id="bibliotheque"><div id="gate"><h2>Accès à Rebond Veille</h2><p>Saisissez le mot de passe de consultation pour accéder à la bibliothèque.</p><form id="gateForm" class="toolbar"><input id="accessPassword" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button class="add" type="submit">Accéder à la veille</button></form></div><div id="library" hidden><div class="toolbar" style="justify-content:space-between;align-items:center"><h2 id="sectionTitle">La bibliothèque de veille</h2><button id="logout" type="button">Fermer l'accès</button></div><div class="toolbar"><input id="search" type="search" placeholder="Rechercher une ressource…" aria-label="Rechercher"><select id="rubrique" aria-label="Filtrer par rubrique"><option value="">Toutes les rubriques</option></select></div><div class="list" id="list"></div></div><p id="notice" role="status" aria-live="polite"></p></section>
<dialog id="createDialog" aria-labelledby="createTitle"><form id="createForm"><h2 id="createTitle">Publier une ressource</h2><label for="newTitle">Titre *</label><input id="newTitle" name="titre" required maxlength="250"><label for="newRubric">Rubrique *</label><select id="newRubric" name="rubrique" required></select><label for="newType">Type de contenu</label><select id="newType" name="type_contenu"><option value="">Choisir</option><option>Article</option><option>Publication</option><option>Livre</option><option>Vidéo</option><option>Podcast</option><option>Outil pédagogique</option><option>Événement</option><option>Formation</option><option>Autre</option></select><label for="newSummary">Résumé</label><textarea id="newSummary" name="resume" rows="5" maxlength="5000"></textarea><label for="newUrl">Lien vers la ressource</label><input id="newUrl" name="url" type="url" placeholder="https://"><label for="newImage">Image de couverture (URL facultative)</label><input id="newImage" name="image_url" type="url" placeholder="https://.../couverture.jpg"><label for="newSource">Source</label><input id="newSource" name="source"><label for="newAuthor">Auteur</label><input id="newAuthor" name="auteur"><label for="newContributor">Votre nom (facultatif)</label><input id="newContributor" name="contributeur"><label for="newDate">Date de publication</label><input id="newDate" name="date_source" type="date"><label for="newEvent">Date d'événement</label><input id="newEvent" name="date_evenement" type="date"><label for="newDeadline">Date limite</label><input id="newDeadline" name="date_cloture" type="date"><p id="createNotice" role="status" aria-live="polite"></p><menu><button id="cancelCreate" type="button">Annuler</button><button id="submitCreate" class="add" type="submit">Publier le billet</button></menu></form></dialog><p class="foot">Rebond® 2026</p></main>
<style>.rubric-nav{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:clamp(3px,.55vw,10px);align-items:start;width:100%;padding:0 0 12px;margin:0 0 15px;overflow:visible}.rubric-nav button{min-width:0;width:100%;padding:5px 1px;border:0;border-radius:0;background:none;box-shadow:none;color:#fff;text-align:center;font-size:clamp(8px,.84vw,12px);line-height:1.24;font-weight:700;letter-spacing:-.015em;overflow-wrap:normal;hyphens:auto}.rubric-nav button:hover,.rubric-nav button.active{color:#fff;text-decoration:underline;text-decoration-color:#f47c4b;text-decoration-thickness:2px;text-underline-offset:5px;background:none}.rubric-nav .count{display:block;margin:5px auto 0;background:none;color:#fff;border:0;border-radius:0;padding:0;font-size:clamp(9px,.85vw,12px);font-weight:900;opacity:.75}.rubric-nav button.active .count{background:none;color:#fff;opacity:1}.rubric-nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}@media(max-width:700px){.rubric-nav{gap:2px}.rubric-nav button{font-size:8px;letter-spacing:-.035em}.rubric-nav .count{font-size:9px}}#gate{max-width:650px;margin:auto;text-align:center}#gateForm{justify-content:center}#notice{color:#b32d2d;font-weight:800}#logout{background:#e2e8e7;border:0;padding:12px;border-radius:10px;color:#063e54;font-weight:800}.item{display:block}.item p{margin:7px 0}.item a{color:#065269;overflow-wrap:anywhere}#library[hidden],#gate[hidden]{display:none}#createDialog{max-height:88vh;overflow:auto}#createDialog form{display:block}#createDialog textarea{width:100%;padding:12px;border:1px solid #b5d0d3;border-radius:9px;font:inherit}#createNotice{color:#a22;font-weight:800}#createDialog h2{margin:0 0 15px}</style>
<script>
const endpoint='https://tdsrqmpfdvntybdlvejy.supabase.co/functions/v1/quick-api';
const $=id=>document.getElementById(id);
let token=sessionStorage.getItem('rebond_veille_token')||'',resources=[],view='bibliotheque',selectedRubric='';
const rubricColors=["#1B5F6E","#E57C61","#D5A13A","#7C9A74","#8A75A4","#D78B9C","#538DA9","#B86B50","#9B9A54","#6778A4","#A47C68"];
const names=['Veille juridique','Actualités','Actualités européennes','Livres et publications','Films et podcasts','Outils pédagogiques','Événements et formations','Réseaux sociaux','Acteurs et initiatives','Bonnes pratiques','Appels à projets (AAP)'];
function populateRubriques(){
  const select=$('rubrique');
  const current=select.value;
  select.replaceChildren();
  const all=document.createElement('option');all.value='';all.textContent='Toutes les rubriques';select.append(all);
  names.forEach((name,index)=>{const option=document.createElement('option');option.value=String(index+1);option.textContent=name;select.append(option)});
  select.value=current;
}
populateRubriques();
const newRubric=$('newRubric');newRubric.add(new Option('Choisir une rubrique',''));names.forEach(n=>newRubric.add(new Option(n,n)));
function rubricFor(r){
  const raw=String(r.rubrique_nom||r.rubrique||'').trim();
  if(names.includes(raw))return raw;
  const n=Number(r.rubrique_ordre);
  if(n>=1&&n<=names.length)return names[n-1];
  return '';
}
function updateRubricNav(){
  const nav=$('rubricNav');nav.replaceChildren();
  for(const name of names){
    const button=document.createElement('button');button.type='button';
    button.className=selectedRubric===name?'active':'';button.style.setProperty('--rubric-color',rubricColors[names.indexOf(name)]);
    button.setAttribute('aria-pressed',String(selectedRubric===name));
    const label=document.createElement('span');label.textContent=name;
    const count=document.createElement('span');count.className='count';
    const mapped=resources.filter(r=>rubricFor(r)===name).length;
    count.textContent=token?String(mapped):'–';
    button.append(label,count);
    button.onclick=()=>{if(!token){$('bibliotheque').scrollIntoView({behavior:'smooth'});$('accessPassword').focus();return}selectedRubric=selectedRubric===name?'':name;view='bibliotheque';$('rubrique').value=selectedRubric?String(names.indexOf(selectedRubric)+1):'';render();$('bibliotheque').scrollIntoView({behavior:'smooth'})};
    nav.append(button);
  }
}
updateRubricNav();
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(action,extra={}){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...extra})});const data=await r.json();if(!r.ok)throw Error(data.error||'Erreur de connexion');return data}
function lock(){if($('createDialog').open)$('createDialog').close();token='';selectedRubric='';updateRubricNav();sessionStorage.removeItem('rebond_veille_token');$('gate').hidden=false;$('library').hidden=true;$('accessPassword').value=''}
async function load(){try{const r=await call('list');resources=r.data||[];$('gate').hidden=true;$('library').hidden=false;$('notice').textContent='';updateRubricNav();render()}catch(e){lock();$('notice').textContent=e.message}}
$('gateForm').addEventListener('submit',async e=>{e.preventDefault();$('notice').textContent='Vérification…';try{const r=await call('login',{password:$('accessPassword').value});token=r.token;sessionStorage.setItem('rebond_veille_token',token);await load()}catch(err){$('notice').textContent=err.message}});
$('logout').onclick=lock;
$('search').oninput=render;$('rubrique').onchange=()=>{selectedRubric=names[Number($('rubrique').value)-1]||'';updateRubricNav();render()};
function render(){const q=$('search').value.toLocaleLowerCase('fr').trim(),cat=$('rubrique').value;let items=resources.filter(r=>(!cat||rubricFor(r)===names[Number(cat)-1])&&(!q||[r.titre,r.resume,r.source,r.notes,r.type_contenu].join(' ').toLocaleLowerCase('fr').includes(q)));if(view==='suivi')items=items.filter(r=>['nouvelle','a_traiter','en_cours'].includes(r.statut));if(view==='evenements')items=items.filter(r=>r.date_evenement||r.date_cloture).sort((a,b)=>(a.date_evenement||a.date_cloture).localeCompare(b.date_evenement||b.date_cloture));$('sectionTitle').textContent=view==='suivi'?'Suivi des ressources':view==='evenements'?'Événements et échéances':'La bibliothèque de veille';const list=$('list');list.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Aucune ressource à afficher pour le moment.';list.append(empty)}for(const r of items){const item=document.createElement('article');item.className='item';const rubricIndex=names.indexOf(rubricFor(r));item.style.borderLeftColor=rubricColors[rubricIndex]||'#E57C61';const content=document.createElement("div");content.className="item-content";const isbn=(String(r.url||"").match(/97[89][0-9]{10}/)||[])[0];const imageUrl=r.image_url||r.preview_image_url||(isbn?"https://covers.openlibrary.org/b/isbn/"+isbn+"-M.jpg?default=false":"");if(imageUrl&&/^https:\/\//i.test(imageUrl)){const image=document.createElement("img");image.className="resource-cover";image.src=imageUrl;image.alt="Illustration de la ressource";image.loading="lazy";image.referrerPolicy="no-referrer";image.onerror=()=>image.remove();item.append(image)}item.append(content);const h=document.createElement('strong');h.textContent=r.titre||'Sans titre';content.append(h);if(rubricIndex>=0){const tag=document.createElement('span');tag.className='rubric-tag';tag.textContent=names[rubricIndex];tag.style.backgroundColor=rubricColors[rubricIndex];content.append(tag)}const meta=document.createElement('small');meta.textContent=[r.type_contenu,r.source,r.statut,r.priorite,r.date_evenement||r.date_cloture||r.date_source].filter(Boolean).join(' · ');content.append(meta);if(r.resume){const p=document.createElement('p');p.textContent=r.resume;content.append(p)}if(r.url&&/^https?:\/\//i.test(r.url)){const a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Consulter la source';content.append(a)}list.append(item)}}
$('cancelCreate').onclick=()=>$('createDialog').close();
$('createForm').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!token){$('createNotice').textContent='Connectez-vous pour publier.';return}
 const button=$('submitCreate');button.disabled=true;button.textContent='Publication…';$('createNotice').textContent='';
 try{
  const form=new FormData($('createForm'));const resource=Object.fromEntries(form.entries());
  await call('create',{resource});
  $('createDialog').close();$('createForm').reset();selectedRubric='';$('rubrique').value='';view='bibliotheque';$('search').value='';
  await load();$('notice').textContent='Votre billet a été publié.';$('bibliotheque').scrollIntoView({behavior:'smooth'});
 }catch(err){$('createNotice').textContent=err.message}
 finally{button.disabled=false;button.textContent='Publier le billet'}
});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.go==='ajouter'){if(!token){$('bibliotheque').scrollIntoView({behavior:'smooth'});$('accessPassword').focus();return}$('createNotice').textContent='';$('createDialog').showModal();$('newTitle').focus();return}view=b.dataset.go;if(token)render();$('bibliotheque').scrollIntoView({behavior:'smooth'})}));
if(token)load();
</script></body></html>
