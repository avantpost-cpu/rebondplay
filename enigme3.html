<script>
/* ======================================================
   MODE DEBUG
====================================================== */

const DEBUG_ZONES = false;

if(
  DEBUG_ZONES ||
  new URLSearchParams(
    window.location.search
  ).get("debug") === "1"
){

  document.body.classList.add(
    "debug"
  );

}

/* ======================================================
   MOTS AUTORISÉS
====================================================== */

const motsPossibles = [
  "FESSES",
  "SEXE",
  "BOUCHE",
  "SEINS",
  "POITRINE",
  "ENTREJAMBE"
];

/* ======================================================
   NORMALISATION DES MOTS
====================================================== */

const motsCanoniques = {
  FESSES:"FESSES",
  SEXE:"SEXE",
  BOUCHE:"BOUCHE",
  SEINS:"SEINS",
  POITRINE:"SEINS",
  ENTREJAMBE:"ENTREJAMBE"
};

/* ======================================================
   ZONES DE DÉPÔT
====================================================== */

const zonesDepot = [

  /* GARÇON */

  {
    mot:"BOUCHE",
    x:30,
    y:235,
    w:155,
    h:75
  },

  {
    mot:"SEINS",
    x:30,
    y:288,
    w:155,
    h:95
  },

  {
    mot:"SEXE",
    x:30,
    y:365,
    w:150,
    h:90
  },

  {
    mot:"ENTREJAMBE",
    x:28,
    y:405,
    w:160,
    h:115
  },

  /* FILLE */

  {
    mot:"BOUCHE",
    x:180,
    y:235,
    w:175,
    h:75
  },

  {
    mot:"SEINS",
    x:180,
    y:290,
    w:170,
    h:95
  },

  {
    mot:"SEXE",
    x:180,
    y:355,
    w:165,
    h:90
  },

  {
    mot:"ENTREJAMBE",
    x:180,
    y:385,
    w:175,
    h:115
  },

  /* DOS */

  {
    mot:"FESSES",
    x:334,
    y:330,
    w:205,
    h:155
  }

];

/* ======================================================
   VARIABLES DU JEU
====================================================== */

const motsTrouves =
  new Set();

const motsParCase = {};

const badgesPlaces =
  new Set();

const nextBtn =
  document.getElementById(
    "nextBtn"
  );

const zoneImage =
  document.getElementById(
    "zoneImage"
  );

const badgesPanel =
  document.getElementById(
    "badgesPanel"
  );

const debugZones =
  document.getElementById(
    "debugZones"
  );

const inputs =
  document.querySelectorAll(
    ".reponse-corps"
  );

const braviFinal =
  document.getElementById(
    "braviFinal"
  );

const animation3 =
  document.querySelector(
    ".animation-3b"
  );

const voix3 =
  document.getElementById(
    "voix3"
  );

const musiqueAmbiance =
  document.getElementById(
    "musiqueAmbiance"
  );

const musicToggle =
  document.getElementById(
    "musicToggle"
  );

let badgeActif = null;
let offsetX = 0;
let offsetY = 0;
let jeuTermine = false;

/* ======================================================
   VOIX 3 — DÉMARRAGE IMMÉDIAT À L’OUVERTURE DE LA PAGE
   AVEC REPLI AU PREMIER GESTE SI LE NAVIGATEUR BLOQUE
====================================================== */

let voix3DejaLancee = false;

function lancerVoix3(){

  if(
    voix3DejaLancee ||
    !voix3
  ){
    return;
  }

  voix3DejaLancee = true;

  try{
    voix3.pause();
    voix3.currentTime = 0;
    voix3.volume = 1;
    voix3.muted = false;
  }
  catch(error){}

  const lecture =
    voix3.play();

  if(
    lecture &&
    typeof lecture.catch ===
    "function"
  ){

    lecture.catch(
      function(){

        /*
          Si le navigateur refuse l’autoplay sonore,
          on autorise une nouvelle tentative au
          premier geste du joueur.
        */

        voix3DejaLancee = false;

      }
    );

  }

}

function tenterDemarrageAudioEtVideo3(){

  if(animation3){

    try{
      animation3.currentTime = 0;
    }
    catch(error){}

    const lectureVideo =
      animation3.play();

    if(
      lectureVideo &&
      typeof lectureVideo.catch ===
      "function"
    ){

      lectureVideo.catch(
        function(){}
      );

    }

  }

  lancerVoix3();

}

function autoriserVoix3(){

  lancerVoix3();

  document.removeEventListener(
    "pointerdown",
    autoriserVoix3
  );

  document.removeEventListener(
    "keydown",
    autoriserVoix3
  );

  document.removeEventListener(
    "touchstart",
    autoriserVoix3
  );

}

/* Tentative dès que le DOM est prêt */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    tenterDemarrageAudioEtVideo3,
    {
      once:true
    }
  );

}
else{

  tenterDemarrageAudioEtVideo3();

}

/* Nouvelle tentative au chargement complet */

window.addEventListener(
  "load",
  function(){

    lancerVoix3();

  },
  {
    once:true
  }
);

/* Repli au premier geste si l’autoplay est bloqué */

document.addEventListener(
  "pointerdown",
  autoriserVoix3
);

document.addEventListener(
  "touchstart",
  autoriserVoix3,
  {
    passive:true
  }
);

document.addEventListener(
  "keydown",
  autoriserVoix3
);

/* ======================================================
   MUSIQUE D’AMBIANCE
====================================================== */

const VOLUME_MUSIQUE = 0.16;
let musiqueDemarree = false;

function musiqueEstCoupee(){
  return localStorage.getItem("rebondMusicMuted") === "1";
}

function mettreAJourBoutonMusique(){
  if(!musicToggle) return;

  if(musiqueEstCoupee()){
    musicToggle.textContent = "🔇";
    musicToggle.setAttribute("aria-label","Activer la musique d’ambiance");
    musicToggle.title = "Activer la musique d’ambiance";
  } else {
    musicToggle.textContent = "🔊";
    musicToggle.setAttribute("aria-label","Couper la musique d’ambiance");
    musicToggle.title = "Couper la musique d’ambiance";
  }
}

function demarrerMusiqueAmbiance(){
  if(!musiqueAmbiance || musiqueEstCoupee()) return;

  musiqueAmbiance.loop = true;
  musiqueAmbiance.volume = VOLUME_MUSIQUE;
  musiqueAmbiance.muted = false;

  const lecture = musiqueAmbiance.play();

  if(lecture && typeof lecture.then === "function"){
    lecture.then(function(){
      musiqueDemarree = true;
    }).catch(function(){
      musiqueDemarree = false;
    });
  }
}

function couperMusiqueAmbiance(){
  if(!musiqueAmbiance) return;
  musiqueAmbiance.pause();
  musiqueDemarree = false;
}

function basculerMusique(){
  if(musiqueEstCoupee()){
    localStorage.setItem("rebondMusicMuted","0");
    mettreAJourBoutonMusique();
    demarrerMusiqueAmbiance();
  } else {
    localStorage.setItem("rebondMusicMuted","1");
    couperMusiqueAmbiance();
    mettreAJourBoutonMusique();
  }
}

function autoriserMusiqueAuPremierGeste(){
  if(!musiqueDemarree && !musiqueEstCoupee()){
    demarrerMusiqueAmbiance();
  }
}

if(musicToggle){
  musicToggle.addEventListener("click",function(event){
    event.preventDefault();
    event.stopPropagation();
    basculerMusique();
  });
}

mettreAJourBoutonMusique();

document.addEventListener("pointerdown",autoriserMusiqueAuPremierGeste);
document.addEventListener("keydown",autoriserMusiqueAuPremierGeste);

window.addEventListener("load",function(){
  window.setTimeout(demarrerMusiqueAmbiance,150);
});

/* ======================================================
   ENREGISTREMENT DE LA PROGRESSION
====================================================== */

localStorage.setItem(
  "rebondCurrentPage",
  "enigme3.html"
);

/* ======================================================
   INITIALISATION
====================================================== */

afficherMotsTrouves();
creerZonesDebug();

/* ======================================================
   SAISIE DES MOTS
====================================================== */

inputs.forEach(
  function(input){

    input.addEventListener(
      "input",
      function(){

        input.value =
          input.value
            .toUpperCase();

        input.classList.remove(
          "erreur"
        );

        const valeur =
          nettoyerTexte(
            input.value
          );

        if(
          motsPossibles.includes(
            valeur
          )
        ){

          const canonique =
            motsCanoniques[
              valeur
            ];

          if(
            !motsTrouves.has(
              canonique
            )
          ){

            verrouillerMot(
              input,
              canonique
            );

          }

        }

      }
    );

  }
);

/* ======================================================
   NETTOYAGE DU TEXTE
====================================================== */

function nettoyerTexte(texte){

  return String(
    texte || ""
  )
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^A-Z]/g,
      ""
    );

}

/* ======================================================
   VERROUILLAGE D’UN MOT
====================================================== */

function verrouillerMot(
  input,
  mot
){

  input.classList.add(
    "ok"
  );

  input.readOnly =
    true;

  input.value =
    mot;

  input.blur();

  motsTrouves.add(
    mot
  );

  motsParCase[
    input.id
  ] = mot;

  verifierMots();

}

/* ======================================================
   CONTRÔLE DES CINQ MOTS
====================================================== */

function verifierMots(){

  if(
    motsTrouves.size === 5
  ){

    creerChiffresSelonReponses();

    badgesPanel.classList.add(
      "visible"
    );

  }

}

/* ======================================================
   CRÉATION DES BADGES
====================================================== */

function creerChiffresSelonReponses(){

  badgesPanel.innerHTML =
    "";

  inputs.forEach(
    function(input,index){

      const mot =
        motsParCase[
          input.id
        ];

      if(!mot){
        return;
      }

      const badge =
        document.createElement(
          "div"
        );

      badge.className =
        "badge";

      badge.id =
        "badge" +
        (index + 1);

      badge.dataset.word =
        mot;

      badge.textContent =
        String(
          index + 1
        );

      badge.addEventListener(
        "pointerdown",
        commencerDrag
      );

      badgesPanel.appendChild(
        badge
      );

    }
  );

}

/* ======================================================
   ZONES DE DEBUG
====================================================== */

function creerZonesDebug(){

  debugZones.innerHTML =
    "";

  zonesDepot.forEach(
    function(zone){

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "debug-zone";

      div.style.left =
        zone.x + "px";

      div.style.top =
        zone.y + "px";

      div.style.width =
        zone.w + "px";

      div.style.height =
        zone.h + "px";

      debugZones.appendChild(
        div
      );

    }
  );

}

/* ======================================================
   DÉBUT DU GLISSER-DÉPOSER
====================================================== */

function commencerDrag(event){

  if(
    event.currentTarget
      .classList
      .contains("ok")
  ){
    return;
  }

  event.preventDefault();

  badgeActif =
    event.currentTarget;

  const rect =
    badgeActif
      .getBoundingClientRect();

  offsetX =
    event.clientX -
    rect.left;

  offsetY =
    event.clientY -
    rect.top;

  document.body.appendChild(
    badgeActif
  );

  badgeActif.classList.add(
    "dragging"
  );

  badgeActif.style.position =
    "fixed";

  badgeActif.style.left =
    rect.left + "px";

  badgeActif.style.top =
    rect.top + "px";

  badgeActif.style.zIndex =
    "9999";

}

/* ======================================================
   DÉPLACEMENT DU BADGE
====================================================== */

document.addEventListener(
  "pointermove",
  function(event){

    if(!badgeActif){
      return;
    }

    badgeActif.style.left =
      (
        event.clientX -
        offsetX
      ) + "px";

    badgeActif.style.top =
      (
        event.clientY -
        offsetY
      ) + "px";

  }
);

/* ======================================================
   FIN DU GLISSER-DÉPOSER
====================================================== */

document.addEventListener(
  "pointerup",
  function(){

    if(!badgeActif){
      return;
    }

    const badgeRect =
      badgeActif
        .getBoundingClientRect();

    const centrePageX =
      badgeRect.left +
      badgeRect.width / 2;

    const centrePageY =
      badgeRect.top +
      badgeRect.height / 2;

    const imageRect =
      zoneImage
        .getBoundingClientRect();

    const centreImageX =
      centrePageX -
      imageRect.left;

    const centreImageY =
      centrePageY -
      imageRect.top;

    const zoneTrouvee =
      trouverZone(
        centreImageX,
        centreImageY
      );

    if(
      zoneTrouvee &&
      zoneTrouvee.mot ===
      badgeActif.dataset.word
    ){

      placerBadgeDansZone(
        badgeActif,
        zoneTrouvee
      );

    }
    else{

      retourDepart(
        badgeActif
      );

    }

    badgeActif =
      null;

  }
);

/* ======================================================
   RECHERCHE DE LA ZONE
====================================================== */

function trouverZone(x,y){

  return zonesDepot.find(
    function(zone){

      return (
        x >= zone.x &&
        x <= zone.x + zone.w &&
        y >= zone.y &&
        y <= zone.y + zone.h
      );

    }
  );

}

/* ======================================================
   PLACEMENT DU BADGE
====================================================== */

function placerBadgeDansZone(
  badge,
  zone
){

  zoneImage.appendChild(
    badge
  );

  badge.classList.remove(
    "dragging"
  );

  badge.classList.add(
    "ok"
  );

  badge.style.position =
    "absolute";

  badge.style.left =
    (
      zone.x +
      zone.w / 2 -
      24
    ) + "px";

  badge.style.top =
    (
      zone.y +
      zone.h / 2 -
      24
    ) + "px";

  badge.style.transform =
    "";

  badge.style.zIndex =
    "180";

  badge.style.pointerEvents =
    "none";

  badgesPlaces.add(
    badge.id
  );

  verifierFin();

}

/* ======================================================
   RETOUR À LA POSITION DE DÉPART
====================================================== */

function retourDepart(badge){

  badgesPanel.appendChild(
    badge
  );

  badge.classList.remove(
    "dragging"
  );

  badge.style.position =
    "";

  badge.style.left =
    "";

  badge.style.top =
    "";

  badge.style.transform =
    "";

  badge.style.zIndex =
    "";

}

/* ======================================================
   FIN DE L’ÉNIGME
====================================================== */

function verifierFin(){

  if(
    jeuTermine ||
    badgesPlaces.size !== 5
  ){
    return;
  }

  jeuTermine =
    true;

  ajouterMotTrouve(
    "Énigme 3",
    "ENSEMBLE"
  );

  document
    .querySelector(
      ".bloc-enigme3"
    )
    .classList.add(
      "gagnee"
    );

  braviFinal.classList.add(
    "visible"
  );

  window.setTimeout(
    function(){

      nextBtn.classList.add(
        "visible"
      );

    },
    1000
  );

}

/* ======================================================
   LECTURE SÉCURISÉE DE L’INVENTAIRE
====================================================== */

function lireMotsTrouves(){

  try{

    const donnees =
      JSON.parse(
        localStorage.getItem(
          "motsEscapeRebond"
        )
      );

    return Array.isArray(
      donnees
    )
      ? donnees
      : [];

  }
  catch(error){

    return [];

  }

}

/* ======================================================
   AJOUT DU MOT DANS L’INVENTAIRE
====================================================== */

function ajouterMotTrouve(
  enigme,
  mot
){

  const mots =
    lireMotsTrouves();

  if(
    !mots.some(
      function(item){

        return (
          item.enigme ===
          enigme
        );

      }
    )
  ){

    mots.push({
      enigme:enigme,
      mot:mot
    });

    localStorage.setItem(
      "motsEscapeRebond",
      JSON.stringify(
        mots
      )
    );

  }

  afficherMotsTrouves();

}

/* ======================================================
   AFFICHAGE DE L’INVENTAIRE
====================================================== */

function afficherMotsTrouves(){

  const liste =
    document.getElementById(
      "listeMots"
    );

  if(!liste){
    return;
  }

  const mots =
    lireMotsTrouves();

  liste.innerHTML =
    "";

  if(
    mots.length === 0
  ){

    liste.innerHTML =
      "<li>Aucun mot</li>";

    return;

  }

  mots.forEach(
    function(item){

      const li =
        document.createElement(
          "li"
        );

      li.textContent =
        item.enigme +
        " : " +
        item.mot;

      liste.appendChild(
        li
      );

    }
  );

}

/* ======================================================
   CONFIRMATION AU CHARGEMENT
====================================================== */

window.addEventListener(
  "load",
  function(){

    localStorage.setItem(
      "rebondCurrentPage",
      "enigme3.html"
    );

  }
);
</script>
