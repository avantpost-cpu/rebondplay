<!doctype html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RebondPlay</title>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html,
body{
    width:100%;
    min-height:100%;
}


body{

    min-height:100vh;
    min-height:100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#9ecbd2;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}


/* =========================================================
   ÉCRANS
========================================================= */

.screen{

    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#9ecbd2;

}


.screen[hidden]{
    display:none !important;
}


/* =========================================================
   ÉCRAN CODE D'ACCÈS
========================================================= */

.accessArt{

    position:relative;

    width:min(
        920px,
        92vw
    );

    aspect-ratio:1400 / 1100;

}


.accessArt img{

    position:absolute;
    inset:0;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    user-select:none;
    -webkit-user-drag:none;

    pointer-events:none;

}


/* =========================================================
   CHAMP CODE
========================================================= */

.codeInput{

    position:absolute;

    /*
       Zone blanche de popup1.png
    */

    left:10.4%;
    top:49.6%;

    width:79.2%;
    height:9.4%;

    border:0;
    outline:none;

    background:transparent;

    color:#155f72;

    text-align:center;

    font-size:clamp(
        16px,
        2vw,
        27px
    );

    font-weight:700;

    letter-spacing:.08em;

    padding:0 20px;

    border-radius:18px;

}


.codeInput:focus{

    background:
        rgba(
            255,
            255,
            255,
            .12
        );

}


/* =========================================================
   BOUTON PARTEZ
========================================================= */

.accessButton{

    position:absolute;

    /*
       Bouton orange déjà dessiné
       dans popup1.png
    */

    left:23.5%;
    top:62%;

    width:55%;
    height:11%;

    border:0;

    border-radius:999px;

    background:transparent;

    cursor:pointer;

    color:transparent;

    font-size:0;

    -webkit-tap-highlight-color:transparent;

}


.accessButton:hover{

    background:
        rgba(
            255,
            255,
            255,
            .05
        );

}


.accessButton:active{

    background:
        rgba(
            0,
            0,
            0,
            .035
        );

}


/* =========================================================
   ERREUR
========================================================= */

.accessError{

    position:absolute;

    left:18%;
    right:18%;

    top:59%;

    display:none;

    padding:7px 10px;

    border-radius:8px;

    background:
        rgba(
            192,
            57,
            43,
            .94
        );

    color:#ffffff;

    text-align:center;

    font-size:13px;

    font-weight:700;

}


.accessError.show{
    display:block;
}


/* =========================================================
   PORTAIL DES OUTILS
========================================================= */

.portalArt{

    position:relative;

    width:min(
        1000px,
        96vw
    );

    aspect-ratio:1000 / 717;

}


.portalImage{

    position:absolute;
    inset:0;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    user-select:none;
    -webkit-user-drag:none;

    pointer-events:none;

}


/* =========================================================
   NOM DE LA STRUCTURE CONNECTÉE
========================================================= */

.connectedStructure{

    position:absolute;

    top:2.2%;
    right:4%;

    z-index:5;

    color:#155f72;

    font-size:13px;

    font-weight:700;

    text-align:right;

    background:
        rgba(
            255,
            255,
            255,
            .75
        );

    padding:
        7px
        11px;

    border-radius:999px;

}


/* =========================================================
   ZONES CLIQUABLES DES DEUX JEUX
========================================================= */

.toolLink{

    position:absolute;

    display:block;

    z-index:3;

    background:transparent;

    border:0;

    cursor:pointer;

    text-decoration:none;

    -webkit-tap-highlight-color:transparent;

}


/*
   CASE ESCAPE GAME
*/

.escapeLink{

    left:6.4%;
    top:45.7%;

    width:39.5%;
    height:46.5%;

}


/*
   CASE VRAI / FAUX
*/

.vfLink{

    left:54.2%;
    top:45.7%;

    width:39.5%;
    height:46.5%;

}


.toolLink:hover{

    background:
        rgba(
            255,
            255,
            255,
            .04
        );

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    .accessArt{

        width:96vw;

    }


    .codeInput{

        font-size:
            clamp(
                13px,
                3vw,
                20px
            );

    }


    .connectedStructure{

        font-size:10px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     ÉCRAN 1
     CODE GLOBAL REBONDPLAY
========================================================= -->

<section
    class="screen"
    id="accessScreen"
>

    <form
        class="accessArt"
        id="accessForm"
    >

        <img
            src="popup1.png"
            alt="Bienvenue sur RebondPlay. Entrez votre code d'accès."
            draggable="false"
        >


        <input
            class="codeInput"
            id="accessCode"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            aria-label="Code d'accès"
            required
        >


        <div
            class="accessError"
            id="accessError"
        ></div>


        <button
            class="accessButton"
            id="accessButton"
            type="submit"
            aria-label="Accéder aux outils"
        >
            Accéder
        </button>


    </form>

</section>



<!-- =========================================================
     ÉCRAN 2
     CHOIX DES OUTILS
========================================================= -->

<section
    class="screen"
    id="portalScreen"
    hidden
>


    <div class="portalArt">


        <img
            class="portalImage"
            src="imageintro.jpg"
            alt="RebondPlay — choisissez votre outil."
            draggable="false"
        >


        <div
            class="connectedStructure"
            id="connectedStructure"
        ></div>


        <!-- ESCAPE GAME -->

        <a
            class="toolLink escapeLink"
            href="escape/"
            aria-label="Accéder à l'Escape Game"
        ></a>


        <!-- VRAI / FAUX -->

        <a
            class="toolLink vfLink"
            href="vraifaux/"
            aria-label="Accéder au Vrai / Faux"
        ></a>


    </div>


</section>



<script>

/* ============================================================
   CONFIGURATION SUPABASE
============================================================ */

const SUPABASE_URL =
    "https://tdsrqmpfdvntybdlvejy.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* ============================================================
   STOCKAGE REBONDPLAY
============================================================ */

const STORAGE_OK =
    "rebondplay_access_ok";


const STORAGE_CODE =
    "rebondplay_code";


const STORAGE_ABONNEMENT =
    "rebondplay_abonnement_id";


const STORAGE_STRUCTURE =
    "rebondplay_nom_structure";


const STORAGE_DATE_FIN =
    "rebondplay_date_fin";



/* ============================================================
   ÉLÉMENTS
============================================================ */

const accessScreen =
    document.getElementById(
        "accessScreen"
    );


const portalScreen =
    document.getElementById(
        "portalScreen"
    );


const accessForm =
    document.getElementById(
        "accessForm"
    );


const accessCode =
    document.getElementById(
        "accessCode"
    );


const accessButton =
    document.getElementById(
        "accessButton"
    );


const accessError =
    document.getElementById(
        "accessError"
    );


const connectedStructure =
    document.getElementById(
        "connectedStructure"
    );



/* ============================================================
   AFFICHER LE PORTAIL
============================================================ */

function afficherPortail(
    nomStructure
){

    accessScreen.hidden =
        true;


    portalScreen.hidden =
        false;


    if(nomStructure){

        connectedStructure.textContent =
            nomStructure;

    }else{

        connectedStructure.textContent =
            "";

    }

}



/* ============================================================
   EFFACER UNE SESSION INVALIDE
============================================================ */

function effacerSession(){

    sessionStorage.removeItem(
        STORAGE_OK
    );


    sessionStorage.removeItem(
        STORAGE_CODE
    );


    sessionStorage.removeItem(
        STORAGE_ABONNEMENT
    );


    sessionStorage.removeItem(
        STORAGE_STRUCTURE
    );


    sessionStorage.removeItem(
        STORAGE_DATE_FIN
    );

}



/* ============================================================
   ENREGISTRER UNE SESSION VALIDE
============================================================ */

function enregistrerSession(
    code,
    abonnement
){

    sessionStorage.setItem(
        STORAGE_OK,
        "1"
    );


    sessionStorage.setItem(
        STORAGE_CODE,
        code
    );


    sessionStorage.setItem(
        STORAGE_ABONNEMENT,
        abonnement.abonnement_id || ""
    );


    sessionStorage.setItem(
        STORAGE_STRUCTURE,
        abonnement.nom_structure || ""
    );


    sessionStorage.setItem(
        STORAGE_DATE_FIN,
        abonnement.date_fin || ""
    );

}



/* ============================================================
   VÉRIFIER UN CODE
============================================================ */

async function verifierCode(
    code
){

    const {
        data,
        error
    } =
    await supabaseClient.rpc(
        "rp_verifier_code",
        {
            p_code:code
        }
    );


    if(error){

        throw error;

    }


    const abonnement =
        data?.[0];


    if(
        !abonnement ||
        abonnement.valide !== true
    ){

        return null;

    }


    return abonnement;

}



/* ============================================================
   CONNEXION
============================================================ */

accessForm.addEventListener(
    "submit",
    async event => {


        event.preventDefault();


        accessError.classList.remove(
            "show"
        );


        accessError.textContent =
            "";


        const code =
            accessCode
                .value
                .trim()
                .toUpperCase();


        if(!code){

            return;

        }


        accessButton.disabled =
            true;


        try{


            const abonnement =
                await verifierCode(
                    code
                );


            if(!abonnement){

                effacerSession();


                accessError.textContent =
                    "Code d’accès invalide ou abonnement expiré.";


                accessError.classList.add(
                    "show"
                );


                return;

            }


            enregistrerSession(
                code,
                abonnement
            );


            afficherPortail(
                abonnement.nom_structure
            );


        }catch(error){


            console.error(
                "Erreur RebondPlay :",
                error
            );


            accessError.textContent =
                "Impossible de vérifier le code. Merci de réessayer.";


            accessError.classList.add(
                "show"
            );


        }finally{


            accessButton.disabled =
                false;

        }


    }
);



/* ============================================================
   SESSION DÉJÀ OUVERTE
============================================================ */

(async () => {


    const accesOK =
        sessionStorage.getItem(
            STORAGE_OK
        );


    const code =
        sessionStorage.getItem(
            STORAGE_CODE
        );


    if(
        accesOK !== "1" ||
        !code
    ){

        effacerSession();

        accessScreen.hidden =
            false;

        portalScreen.hidden =
            true;

        return;

    }


    /*
       Même si une session existe,
       on revérifie le code auprès de Supabase.
    */

    try{


        const abonnement =
            await verifierCode(
                code
            );


        if(!abonnement){

            effacerSession();

            accessScreen.hidden =
                false;

            portalScreen.hidden =
                true;

            return;

        }


        enregistrerSession(
            code,
            abonnement
        );


        afficherPortail(
            abonnement.nom_structure
        );


    }catch(error){


        console.error(
            "Vérification de session impossible :",
            error
        );


        /*
           En cas de problème réseau,
           on revient proprement à l'écran du code
           au lieu de créer une boucle de redirection.
        */

        effacerSession();

        accessScreen.hidden =
            false;

        portalScreen.hidden =
            true;

    }


})();

</script>


</body>

</html>
