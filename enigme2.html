<script>
const bonnesPhrases = [
  "1",
  "3",
  "7"
];

const selectionnees =
  new Set();

const phrases =
  document.querySelectorAll(
    ".phrase"
  );

const message =
  document.getElementById(
    "message"
  );

const motCle =
  document.getElementById(
    "motCle"
  );

const validateBtn =
  document.getElementById(
    "validateBtn"
  );

const nextBtn =
  document.getElementById(
    "nextBtn"
  );

const angeFin =
  document.getElementById(
    "angeFin"
  );

const braviFinal =
  document.getElementById(
    "braviFinal"
  );

const animation2 =
  document.querySelector(
    ".animation-2"
  );

const voix2 =
  document.getElementById(
    "voix2"
  );

const sonWin2 =
  document.getElementById(
    "sonWin2"
  );

const sonWrong =
  document.getElementById(
    "sonWrong"
  );

const musiqueAmbiance =
  document.getElementById(
    "musiqueAmbiance"
  );

const musicToggle =
  document.getElementById(
    "musicToggle"
  );

const musicToggleImage =
  document.getElementById(
    "musicToggleImage"
  );

let jeuTermine = false;

/* ======================================================
   VOIX 2 — DÉMARRAGE IMMÉDIAT À L’OUVERTURE DE LA PAGE
   AVEC REPLI AU PREMIER GESTE SI LE NAVIGATEUR BLOQUE
====================================================== */

let voix2DejaLancee = false;

function lancerVoix2(){

  if(
    voix2DejaLancee ||
    !voix2
  ){
    return;
  }

  voix2DejaLancee = true;

  try{
    voix2.pause();
    voix2.currentTime = 0;
    voix2.volume = 1;
    voix2.muted = false;
  }
  catch(error){}

  const lecture =
    voix2.play();

  if(
    lecture &&
    typeof lecture.catch ===
    "function"
  ){

    lecture.catch(
      function(){

        /*
          Certains navigateurs bloquent encore l’autoplay sonore.
          Dans ce cas, on autorise une nouvelle tentative au
          premier clic / toucher / appui clavier.
        */

        voix2DejaLancee = false;

      }
    );

  }

}

function tenterDemarrageAudioEtVideo(){

  /*
    La vidéo est déjà déclarée autoplay + muted dans le HTML.
    On s'assure simplement qu'elle repart bien depuis le début,
    puis on tente immédiatement la voix off.
  */

  if(animation2){

    try{
      animation2.currentTime = 0;
    }
    catch(error){}

    const lectureVideo =
      animation2.play();

    if(
      lectureVideo &&
      typeof lectureVideo.catch ===
      "function"
    ){

      lectureVideo.catch(
        function(){}
      );

    }

  }

  lancerVoix2();

}

function autoriserVoix2(){

  lancerVoix2();

  document.removeEventListener(
    "pointerdown",
    autoriserVoix2
  );

  document.removeEventListener(
    "keydown",
    autoriserVoix2
  );

  document.removeEventListener(
    "touchstart",
    autoriserVoix2
  );

}

/*
  1) Tentative très tôt, dès que le DOM est prêt.
*/

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    tenterDemarrageAudioEtVideo,
    {
      once:true
    }
  );

}
else{

  tenterDemarrageAudioEtVideo();

}

/*
  2) Nouvelle tentative au chargement complet.
*/

window.addEventListener(
  "load",
  function(){

    lancerVoix2();

  },
  {
    once:true
  }
);

/*
  3) Si l’autoplay sonore est refusé,
     démarrage au tout premier geste utilisateur.
*/

document.addEventListener(
  "pointerdown",
  autoriserVoix2
);

document.addEventListener(
  "touchstart",
  autoriserVoix2,
  {
    passive:true
  }
);

document.addEventListener(
  "keydown",
  autoriserVoix2
);

/* ======================================================
   MUSIQUE D’AMBIANCE
====================================================== */

const VOLUME_MUSIQUE = 0.22;
let musiqueDemarree = false;

function musiqueEstCoupee(){
  return localStorage.getItem("rebondMusicMuted") === "1";
}

function mettreAJourBoutonMusique(){

  if(
    !musicToggle ||
    !musicToggleImage
  ){
    return;
  }

  if(musiqueEstCoupee()){

    musicToggleImage.src =
      "musicno.png";

    musicToggle.setAttribute(
      "aria-label",
      "Activer la musique d’ambiance"
    );

    musicToggle.title =
      "Activer la musique d’ambiance";

  }
  else{

    musicToggleImage.src =
      "musicok.png";

    musicToggle.setAttribute(
      "aria-label",
      "Couper la musique d’ambiance"
    );

    musicToggle.title =
      "Couper la musique d’ambiance";

  }

}

function demarrerMusiqueAmbiance(){

  if(
    !musiqueAmbiance ||
    musiqueEstCoupee()
  ){
    return;
  }

  musiqueAmbiance.loop = true;
  musiqueAmbiance.volume = VOLUME_MUSIQUE;
  musiqueAmbiance.muted = false;

  const lecture = musiqueAmbiance.play();

  if(
    lecture &&
    typeof lecture.then === "function"
  ){
    lecture
      .then(function(){
        musiqueDemarree = true;
      })
      .catch(function(){
        musiqueDemarree = false;
      });
  }

}

function couperMusiqueAmbiance(){

  if(!musiqueAmbiance){
    return;
  }

  musiqueAmbiance.pause();
  musiqueDemarree = false;

}

function basculerMusique(){

  if(musiqueEstCoupee()){

    localStorage.setItem(
      "rebondMusicMuted",
      "0"
    );

    mettreAJourBoutonMusique();
    demarrerMusiqueAmbiance();

  }
  else{

    localStorage.setItem(
      "rebondMusicMuted",
      "1"
    );

    couperMusiqueAmbiance();
    mettreAJourBoutonMusique();

  }

}

function autoriserMusiqueAuPremierGeste(){

  if(
    !musiqueDemarree &&
    !musiqueEstCoupee()
  ){
    demarrerMusiqueAmbiance();
  }

}

if(musicToggle){

  musicToggle.addEventListener(
    "click",
    function(event){

      event.preventDefault();
      event.stopPropagation();

      basculerMusique();

    }
  );

}

mettreAJourBoutonMusique();

document.addEventListener(
  "pointerdown",
  autoriserMusiqueAuPremierGeste
);

document.addEventListener(
  "keydown",
  autoriserMusiqueAuPremierGeste
);

window.addEventListener(
  "load",
  function(){

    window.setTimeout(
      demarrerMusiqueAmbiance,
      150
    );

  }
);

/* ======================================================
   SONS BONNE / MAUVAISE RÉPONSE
   Déclenchés directement pendant le geste utilisateur.
====================================================== */

function jouerSonFeedback(audio){

  if(!audio){
    return;
  }

  try{

    audio.pause();
    audio.currentTime = 0;
    audio.volume = 1;
    audio.muted = false;

    const lecture =
      audio.play();

    if(
      lecture &&
      typeof lecture.catch ===
      "function"
    ){

      lecture.catch(
        function(error){

          console.error(
            "Le son de réponse n’a pas pu être joué.",
            error
          );

        }
      );

    }

  }
  catch(error){

    console.error(
      "Erreur de lecture du son de réponse.",
      error
    );

  }

}

function jouerBonneReponse(){

  jouerSonFeedback(
    sonWin2
  );

}

function jouerMauvaiseReponse(){

  jouerSonFeedback(
    sonWrong
  );

}

/* ======================================================
   ENREGISTREMENT DE LA PROGRESSION
====================================================== */

localStorage.setItem(
  "rebondCurrentPage",
  "enigme2.html"
);

afficherMotsTrouves();

/* ======================================================
   CLIC SUR LES PHRASES
====================================================== */

phrases.forEach(
  function(phrase){

    /*
      Le son part dès l'appui : il est alors directement
      lié au geste utilisateur, ce qui évite les blocages
      audio de Chrome / Safari.
    */

    phrase.addEventListener(
      "pointerdown",
      function(){

        if(phrase.disabled){
          return;
        }

        const id =
          phrase.dataset.id;

        if(
          bonnesPhrases.includes(
            id
          )
        ){

          jouerBonneReponse();

        }
        else{

          jouerMauvaiseReponse();

        }

      }
    );

    phrase.addEventListener(
      "click",
      function(){

        const id =
          phrase.dataset.id;

        if(phrase.disabled){
          return;
        }

        if(
          !bonnesPhrases.includes(
            id
          )
        ){

          phrase.classList.add(
            "grisee"
          );

          phrase.disabled =
            true;

          if(message){

            message.textContent =
              "Cette phrase n’est pas une situation à retenir.";

          }

          return;

        }

        phrase.classList.add(
          "active"
        );

        phrase.disabled =
          true;

        selectionnees.add(
          id
        );

        if(
          selectionnees.size ===
          bonnesPhrases.length
        ){

          griserMauvaises();

          if(message){

            message.textContent =
              "Bravo ! Les bonnes situations sont entourées. Trouve maintenant le mot-clé.";

          }

        }

      }
    );

  }
);

/* ======================================================
   GRISE LES MAUVAISES PHRASES
====================================================== */

function griserMauvaises(){

  phrases.forEach(
    function(phrase){

      if(
        !bonnesPhrases.includes(
          phrase.dataset.id
        )
      ){

        phrase.classList.add(
          "grisee"
        );

        phrase.disabled =
          true;

      }

    }
  );

}

/* ======================================================
   CONTRÔLE DU MOT-CLÉ
====================================================== */

motCle.addEventListener(
  "input",
  function(){

    motCle.value =
      motCle.value
        .toUpperCase();

    motCle.classList.remove(
      "erreur"
    );

    if(
      nettoyerTexte(
        motCle.value
      ) === "CONSENTEMENT"
    ){

      validerMot();

    }

  }
);

/* ======================================================
   BOUTON ÉVENTUEL DE VALIDATION
====================================================== */

if(validateBtn){

  validateBtn.addEventListener(
    "click",
    function(){

      if(
        nettoyerTexte(
          motCle.value
        ) === "CONSENTEMENT"
      ){

        validerMot();

      }
      else{

        jouerMauvaiseReponse();

        motCle.classList.add(
          "erreur"
        );

        if(message){

          message.textContent =
            "Le mot-clé n’est pas encore correct.";

        }

      }

    }
  );

}

/* ======================================================
   VALIDATION DE L’ÉNIGME
====================================================== */

function validerMot(){

  if(jeuTermine){
    return;
  }

  jeuTermine =
    true;

  jouerBonneReponse();

  motCle.classList.remove(
    "erreur"
  );

  motCle.classList.add(
    "ok"
  );

  motCle.readOnly =
    true;

  ajouterMotTrouve(
    "Énigme 2",
    "LE SPORT"
  );

  document
    .querySelector(
      ".zone-enigme2"
    )
    .classList.add(
      "gagnee"
    );

  braviFinal.classList.add(
    "visible"
  );

  if(validateBtn){

    validateBtn.style.display =
      "none";

  }

  setTimeout(
    function(){

      nextBtn.classList.add(
        "visible"
      );

    },
    1000
  );

}

/* ======================================================
   NETTOYAGE DU TEXTE
====================================================== */

function nettoyerTexte(texte){

  return texte
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^A-Z]/g,
      ""
    );

}

/* ======================================================
   LECTURE SÉCURISÉE DE L’INVENTAIRE
====================================================== */

function lireMotsTrouves(){

  try{

    const donnees =
      JSON.parse(
        localStorage.getItem(
          "motsEscapeRebond"
        )
      );

    return Array.isArray(donnees)
      ? donnees
      : [];

  }
  catch(error){

    return [];

  }

}

/* ======================================================
   AJOUT DU MOT DANS L’INVENTAIRE
====================================================== */

function ajouterMotTrouve(
  enigme,
  mot
){

  const mots =
    lireMotsTrouves();

  if(
    !mots.some(
      function(item){

        return (
          item.enigme ===
          enigme
        );

      }
    )
  ){

    mots.push({
      enigme:enigme,
      mot:mot
    });

    localStorage.setItem(
      "motsEscapeRebond",
      JSON.stringify(
        mots
      )
    );

  }

  afficherMotsTrouves();

}

/* ======================================================
   AFFICHAGE DE L’INVENTAIRE
====================================================== */

function afficherMotsTrouves(){

  const liste =
    document.getElementById(
      "listeMots"
    );

  if(!liste){
    return;
  }

  const mots =
    lireMotsTrouves();

  liste.innerHTML = "";

  if(
    mots.length === 0
  ){

    liste.innerHTML =
      "<li>Aucun mot</li>";

    return;

  }

  mots.forEach(
    function(item){

      const li =
        document.createElement(
          "li"
        );

      li.textContent =
        item.enigme +
        " : " +
        item.mot;

      liste.appendChild(
        li
      );

    }
  );

}

/* ======================================================
   CONFIRMATION DE LA PROGRESSION AU CHARGEMENT
====================================================== */

window.addEventListener(
  "load",
  function(){

    localStorage.setItem(
      "rebondCurrentPage",
      "enigme2.html"
    );

  }
);
</script>
