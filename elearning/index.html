<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RebondPlay — Formation privée</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#bd8fbe;color:#063e54;font:600 16px Poppins,Arial,sans-serif}.panel{background:#fffefa;border-radius:18px;padding:32px;max-width:500px;margin:20px;box-shadow:0 10px 30px #0002;text-align:center}a{color:#064e61}</style></head><body><main class="panel"><p id="status" role="status">Vérification de votre accès à la formation…</p><p id="retry" hidden><a href="./acces/">Revenir à la connexion</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
(async()=>{
 const status=document.getElementById("status"),retry=document.getElementById("retry");
 try{
  if(!window.supabase)throw Error("Service de connexion indisponible");
  const key="sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO";
  const client=window.supabase.createClient("https://tdsrqmpfdvntybdlvejy.supabase.co",key);
  const {data:{session},error}=await client.auth.getSession();
  if(error||!session?.access_token){location.replace("./acces/");return}
  const response=await fetch("https://tdsrqmpfdvntybdlvejy.supabase.co/functions/v1/elearning-private-course",{
   method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"apikey":key,"Content-Type":"application/json"},body:"{}",cache:"no-store"
  });
  const result=await response.json();
  if(!response.ok||!result.ok||typeof result.html!=="string")throw Error("Accès refusé ou formation indisponible ("+response.status+")");
  document.open();document.write(result.html);document.close();
 }catch(error){status.textContent=error.message||"Formation indisponible";retry.hidden=false}
})();
</script></body></html>
