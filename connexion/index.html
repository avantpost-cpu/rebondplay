<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RebondPlay — Connexion</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap');
:root{font-family:'Nunito',Arial,sans-serif;color:#065269}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 18px;background:#065269 url('/ressources/fond.jpg') center/cover fixed no-repeat}
main{width:min(100%,680px);padding:clamp(26px,5vw,52px);border-radius:28px;background:#f8f6ef url('/fond.jpg') center/cover no-repeat;box-shadow:0 16px 34px #183f4a50;text-align:center}
.brand{display:block;width:min(76%,330px);height:auto;margin:0 auto 20px}
h1{margin:0 0 12px;font-size:clamp(22px,3.2vw,31px);font-weight:900;color:#065269}
.intro{margin:0 auto 26px;max-width:480px;font-size:clamp(14px,1.7vw,18px);line-height:1.5;font-weight:700}
form{max-width:490px;margin:auto;text-align:left}
label{display:block;margin:16px 0 7px;font-size:15px;font-weight:900}
input{width:100%;height:54px;padding:12px 15px;border:2px solid #c2c8c6;border-radius:12px;background:#fff;color:#065269;font:700 17px 'Nunito',Arial,sans-serif}
input:focus{outline:3px solid #ff8a5577;border-color:#ff743b}
button{display:block;width:min(100%,370px);margin:26px auto 0;padding:16px;border:0;border-radius:999px;background:#f47743;color:#fff;font:900 20px 'Nunito',Arial,sans-serif;cursor:pointer;box-shadow:0 5px 0 #c75d31}
button:hover{background:#e96c37}button:disabled{opacity:.65;cursor:wait}
#status{min-height:1.5em;margin:20px auto 0;max-width:490px;font-weight:800;line-height:1.5}#status:not(:empty){padding:14px 18px;border-radius:12px;background:#e6f2ee;border:2px solid #1b5f6e}#verify[hidden]{display:none}
small{display:block;max-width:480px;margin:25px auto 0;font-size:12px;font-weight:700;line-height:1.5;color:#065269}
footer{margin:20px 0 0;font-size:12px;font-weight:900;color:#065269}
@media(max-width:540px){body{padding:16px}main{padding:28px 22px}.brand{width:85%}input{height:50px}button{font-size:17px}}
</style></head>
<body><main><img class="brand" src="/logorebondsignature.png" alt="Rebond"><h1>Bienvenue sur RebondPlay</h1><p class="intro">Connectez-vous à votre espace personnel pour retrouver vos outils de sensibilisation.</p><form id="login"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required><button id="submit" type="submit">Recevoir mon code de connexion</button></form><form id="verify" aria-label="Saisir le code reçu par e-mail"><label for="otp">Code reçu par e-mail</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" required><button id="verify-submit" type="submit">Me connecter</button></form><p id="status" role="status" aria-live="polite"></p><small>Accès réservé aux utilisateurs autorisés par Rebond. Vos identifiants sont personnels.</small><footer>Rebond® 2026</footer></main>
<script>
(async()=>{
const status=document.getElementById('status'),form=document.getElementById('login'),button=document.getElementById('submit'),verify=document.getElementById('verify'),verifyButton=document.getElementById('verify-submit');let pendingEmail='';
const client=window.supabase.createClient('https://tdsrqmpfdvntybdlvejy.supabase.co','sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO',{auth:{storageKey:'rebondplay-full-pilot-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
verify.hidden=false;
const routes={full:'/pagefull/',essentielplus:'/RPessentielleplus/',essentiel:'/Essentiel/'};
async function verifierAppareil(){
 let deviceToken=localStorage.getItem('rp-device-token-v1');
 if(!deviceToken||!/^[a-f0-9]{64}$/.test(deviceToken)){
  deviceToken=Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b=>b.toString(16).padStart(2,'0')).join('');
  localStorage.setItem('rp-device-token-v1',deviceToken);
 }
 const {data,error}=await client.functions.invoke('rp-appareil-verifier',{body:{device_token:deviceToken,nom_appareil:navigator.platform||'Navigateur'}});
 if(error||!data?.autorise)throw new Error(data?.raison==='limite_trois_appareils'?'Ce compte utilise déjà trois appareils. Contactez Rebond pour en retirer un.':data?.raison==='appareil_revoque'?'Cet appareil a été révoqué. Contactez l’administration Rebond pour le réautoriser.':'Vérification de cet appareil impossible. Réessayez.');
}
async function route(){
 const {data:user,error:userError}=await client.auth.getUser();
 if(userError||!user?.user){status.textContent='Code accepté, mais la session n’a pas été conservée. Rechargez la page et réessayez.';return false;}
 const {data,error}=await client.rpc('rp_mon_abonnement');
 if(error)throw error;
 const subscription=data?.[0];
 if(!subscription){status.textContent='Aucun abonnement actif et valide associé à ce compte.';return false}
 
 if(!routes[subscription.offre]){status.textContent='Offre non reconnue. Contactez Rebond.';return false}
 await verifierAppareil();
 location.replace(routes[subscription.offre]);return true;
}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;pendingEmail=document.getElementById('email').value.trim().toLowerCase();status.textContent='Envoi du code…';try{const {error}=await client.auth.signInWithOtp({email:pendingEmail,options:{shouldCreateUser:false,emailRedirectTo:'https://rebondplay.com/connexion/'}});if(error)throw error;verify.hidden=false;status.textContent='Demande enregistrée. Vérifiez votre boîte de réception et les indésirables de '+pendingEmail+'. Saisissez le code ci-dessous pour vous connecter.';verify.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){status.textContent=/after \d+ seconds?/i.test(e.message||'')?'Une demande a déjà été enregistrée. Patientez quelques secondes avant de redemander un code, ou saisissez celui déjà reçu ci-dessous.':'Envoi impossible : '+(e.message||'Réessayez dans quelques instants.')}finally{button.disabled=false}});
verify.addEventListener('submit',async e=>{e.preventDefault();verifyButton.disabled=true;pendingEmail=document.getElementById('email').value.trim().toLowerCase();status.textContent='Connexion en cours…';try{const token=document.getElementById('otp').value.trim();const {error}=await client.auth.verifyOtp({email:pendingEmail,token,type:'email'});if(error)throw error;await route()}catch(e){status.textContent=e.message||'Connexion impossible. Réessayez.'}finally{verifyButton.disabled=false}});
try{const params=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));const callback=['code','token_hash','access_token','refresh_token'].some(k=>params.has(k)||hash.has(k));if(callback){const {data}=await client.auth.getSession();if(data?.session)await route();else status.textContent='Lien reçu : saisissez votre adresse e-mail et votre code ci-dessus.'}else{const {data}=await client.auth.getSession();if(data?.session)await route()}}catch(e){status.textContent='Connexion par lien indisponible. Vous pouvez saisir le code reçu ci-dessus.'}finally{verify.hidden=false;}
})();
</script></body></html>
