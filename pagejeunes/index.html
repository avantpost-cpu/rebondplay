<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd8fbe"><title>Jeunes — RebondPlay Full</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#073e55;--purple:#bd8fbe;--shadow:0 16px 28px rgba(31,33,40,.28)}*{box-sizing:border-box}html{min-width:300px}body{margin:0;min-height:100vh;color:var(--ink);background:var(--purple) url("fondfull.png") center top/cover fixed no-repeat;font-family:"Nunito",Arial,sans-serif}img{display:block;max-width:100%}a{color:inherit}.topbar{min-height:clamp(92px,8.2vw,158px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:30px;padding:16px 3.4% 10px;background:rgba(189,143,190,.74)}.brand{width:clamp(205px,15.6vw,310px);justify-self:start}.brand img{width:100%}.page-title{display:flex;align-items:center;justify-content:center}.page-title img{width:clamp(250px,25vw,500px);height:auto}.account{display:flex;align-items:center;justify-content:flex-end;gap:clamp(9px,1vw,20px);min-width:0;color:#082f4a}.avatar{width:clamp(43px,3.25vw,65px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;background:#082f4a;color:var(--purple)}.avatar svg{width:62%;height:62%;fill:currentColor}.account-copy{min-width:0}.account-name{font-size:clamp(13px,1vw,20px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-meta{margin-top:3px;font-size:clamp(9px,.75vw,15px);font-weight:700;white-space:nowrap}.logout{min-height:46px;padding:0 clamp(10px,1.3vw,25px);border:0;border-left:1px solid rgba(8,47,74,.28);background:transparent;color:inherit;font-weight:900;cursor:pointer;white-space:nowrap}.logout:hover{color:#fff}main{width:min(90vw,1540px);margin:0 auto;padding:clamp(38px,6vw,110px) 0 100px}.cards{display:grid;grid-template-columns:1fr 1.45fr 1fr;align-items:center;gap:clamp(24px,4vw,82px)}.card{display:block;border-radius:clamp(18px,1.5vw,30px);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-7px);box-shadow:0 22px 38px rgba(31,33,40,.35)}.card img{width:100%;height:auto}.card.escape{transform:scale(1.02)}.card.escape:hover{transform:scale(1.02) translateY(-7px)}.back{position:fixed;z-index:10;left:clamp(14px,2vw,38px);bottom:clamp(14px,2vw,38px);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;text-decoration:none;font-size:14px;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.18)}@media(max-width:800px){.topbar{grid-template-columns:1fr auto;gap:14px;padding:16px 20px}.page-title{grid-column:1/-1;grid-row:2;order:3}.page-title img{width:250px}.account{grid-column:2;grid-row:1}.brand{width:190px}.account-meta{white-space:normal}.logout{font-size:12px;padding-inline:10px}main{width:min(88vw,560px);padding-top:35px}.cards{grid-template-columns:1fr;gap:28px}.card.escape{transform:none}.card.escape:hover{transform:translateY(-7px)}}@media(max-width:500px){.topbar{display:flex;align-items:flex-start;flex-wrap:wrap}.brand{width:180px}.account{width:100%;justify-content:flex-start;order:3}.page-title{width:100%;order:2}.page-title img{width:220px}.account-name{font-size:14px}.account-meta{font-size:10px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head>
<body><header class="topbar"><a class="brand" href="../pagefull/index.html" aria-label="RebondPlay Full — accueil"><img src="../pagefull/logo_RPF.png" alt="RebondPlay Full"></a><div class="page-title"><img src="boutonjeunes.png" alt="Jeunes"></div><div class="account" aria-label="Compte connecté"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span><div class="account-copy"><div class="account-name" id="accountName">Bonjour</div><div class="account-meta" id="accountMeta"></div></div><button class="logout" id="logoutButton" type="button">Se déconnecter</button></div></header><main><section class="cards" aria-label="Outils pour les jeunes"><a class="card vf" href="../vraifauxjeunes/vraifauxjeunes.html"><img src="boutonjeunes.png" alt="Vrai ou Faux — outil pour les jeunes"></a><a class="card escape" href="../escapegame/index.html"><img src="boutonescape.png" alt="Escape Game Sécurise le club"></a><a class="card bc" href="../bonneconduite/bonneconduite.html"><img src="boutonBC.png" alt="La Bonne Conduite"></a></section></main><a class="back" href="../pagefull/index.html">← Retour à l’accueil</a><script>(()=>{const keys=["rebondplay_access_ok","rebondplay_abonnement_id","rebondplay_nom_structure","rebondplay_code","rebondplay_date_fin","rebondplay_prenom_contact","rebondplay_nom_contact"],get=k=>sessionStorage.getItem(k)||"";if(get("rebondplay_access_ok")!=="1"){location.replace("../index.html");return}const name=[get("rebondplay_prenom_contact"),get("rebondplay_nom_contact")].filter(Boolean).join(" ")||get("rebondplay_nom_structure");document.getElementById("accountName").textContent=("Bonjour "+name).trim();const endValue=get("rebondplay_date_fin"),meta=document.getElementById("accountMeta");if(endValue){const end=new Date(endValue+"T23:59:59"),days=Math.max(0,Math.ceil((end-Date.now())/86400000));meta.innerHTML="Votre abonnement est encore valable<br>"+days+" jour"+(days>1?"s":"")}else meta.textContent=get("rebondplay_nom_structure");document.getElementById("logoutButton").addEventListener("click",()=>{keys.forEach(k=>sessionStorage.removeItem(k));location.replace("../index.html")})})();</script></body></html>
