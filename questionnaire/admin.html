<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion questionnaire Rebond</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#073e55;color:#fff;font:16px Arial}.box{width:min(1100px,92vw);margin:5vh auto}input,button{padding:12px;border-radius:9px;border:0;margin:5px}button{font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;color:#073e55;border-radius:16px;padding:20px}.card b{display:block;font-size:28px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}table{width:100%;margin-top:28px;background:#fff;color:#073e55;border-collapse:collapse}td,th{padding:10px;border:1px solid #ddd;text-align:left}</style></head><body><main class="box"><h1>Gestion du questionnaire</h1><section id="login"><input id="email" type="email" placeholder="E-mail administrateur"><input id="password" type="password" placeholder="Mot de passe"><button id="connect">Se connecter</button><p id="error"></p></section><section id="dash" hidden><div class="grid"><div class="card">Participants<b id="participants">—</b></div><div class="card">Questionnaires terminés<b id="completed">—</b></div><div class="card">Score moyen<b id="average">—</b></div><div class="card">Taux de complétion<b id="rate">—</b></div></div><h2>Réussite par question</h2><table><thead><tr><th>Question</th><th>Réponses correctes</th><th>Taux</th></tr></thead><tbody id="questions"></tbody></table></section></main><script>const $=id=>document.getElementById(id);const U="https://tdsrqmpfdvntybdlvejy.supabase.co",K="sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO",db=supabase.createClient(U,K);$("connect").onclick=async()=>{const r=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error){$("error").textContent=r.error.message;return}load()};async function load(){const p=await db.from("questionnaire_participants").select("*"),a=await db.from("questionnaire_answers").select("*");if(p.error||a.error){$("error").textContent="Créez d’abord les tables avec schema.sql.";return}const rows=p.data||[],ans=a.data||[];$("participants").textContent=rows.length;$("completed").textContent=rows.length;$("average").textContent=rows.length?(rows.reduce((s,x)=>s+x.score,0)/rows.length).toFixed(1)+"/"+(rows[0]?.total_questions||10):"0";$("rate").textContent="100%";$("questions").innerHTML=Array.from({length:10},(_,i)=>{const q=ans.filter(x=>x.question_index===i+1),ok=q.filter(x=>x.correct).length;return `<tr><td>${i+1}</td><td>${ok} / ${q.length}</td><td>${q.length?Math.round(ok/q.length*100):0}%</td></tr>`}).join("")}$("connect").addEventListener("click",()=>{});</script></body></html>
