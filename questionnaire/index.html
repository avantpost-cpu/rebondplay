<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionnaire Rebond</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#cb8095 url("../RPessentielleplus/motifsplus.jpg") center/cover fixed;font-family:Arial,sans-serif;color:#073e55}.shell{width:min(720px,92vw);margin:6vh auto;padding:clamp(24px,5vw,52px);border-radius:28px;background:#fff url("../fond.jpg") center/cover fixed;box-shadow:0 15px 40px #073e5540}h1{margin:0 0 12px;font-size:clamp(28px,5vw,46px)}h2{font-size:clamp(20px,3vw,28px);line-height:1.25}.intro{line-height:1.55}.field{display:grid;gap:7px;margin:16px 0}.field input{padding:13px;border:2px solid #cb8095;border-radius:12px;font:inherit}.btn{border:0;border-radius:999px;padding:14px 24px;background:#073e55;color:#fff;font-weight:800;cursor:pointer}.muted{font-size:13px;color:#48616a}.hidden{display:none}.progress{font-weight:800;color:#cb8095}.choice{display:block;margin:12px 0;padding:15px;border:2px solid #d7b0bb;border-radius:14px;cursor:pointer}.choice input{margin-right:10px;accent-color:#073e55}.choice.selected{border-color:#073e55;background:#eef5f6}.feedback{margin:18px 0;padding:16px;border-radius:15px;background:#eef5f6;line-height:1.45}.good{color:#14733f}.bad{color:#a83c3c}.error{color:#a83c3c;margin:10px 0}.result{text-align:center}.score{font-size:46px;font-weight:900;color:#cb8095}.intro-image{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:18px;margin:-8px 0 26px}
</style></head><body><main class="shell">
<section id="intro"><img class="intro-image" src="imagequestionnaire.png" alt="Questionnaire de sensibilisation"><form id="identity"><div class="field"><label for="first">Prénom</label><input id="first" required></div><div class="field"><label for="last">Nom</label><input id="last" required></div><div class="field"><label for="email">Adresse e-mail</label><input id="email" type="email" required></div><label class="muted"><input id="consent" type="checkbox" required> J’accepte que mes réponses soient enregistrées pour l’évaluation de cette sensibilisation.</label><p id="startError" class="error"></p><button class="btn" type="submit">Commencer</button></form></section>
<section id="quiz" class="hidden"><div class="progress" id="progress"></div><h2 id="question"></h2><div id="choices"></div><button class="btn" id="validate">Valider</button><div id="feedback"></div></section>
<section id="result" class="hidden result"><h1>Merci pour votre participation</h1><div class="score" id="score"></div><p id="resultText"></p><button class="btn" onclick="location.reload()">Recommencer</button></section>
</main>
<script>
const SUPABASE_URL="https://tdsrqmpfdvntybdlvejy.supabase.co",SUPABASE_KEY="sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO",db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const questions=[
{q:"Après une compétition ratée, un coach force un athlète à s’excuser publiquement et lui interdit de s’entraîner avec les autres. Cette réaction est-elle bénéfique pour la performance ?",o:["Oui, elle renforce son mental","Non, elle peut briser sa motivation et son estime de soi"],a:[1],e:"Une humiliation publique et une mise à l’écart peuvent fragiliser la motivation, l’estime de soi et la confiance."},
{q:"Quels sont les facteurs aggravants individuels dans le sport ?",o:["Être issu d’une minorité","Être une fille","Être un enfant peu sportif","Avoir des parents qui n’ont jamais fait de sport à haut niveau","Pratiquer plusieurs sports","Être en situation de handicap"],a:[0,1,2,5],e:"Certaines caractéristiques peuvent augmenter l’exposition aux violences ou rendre la parole plus difficile."},
{q:"Pourquoi nommer clairement les différentes formes de violence est-il essentiel ?",o:["Pour classer les situations selon leur gravité","Pour empêcher leur banalisation et faciliter la prise de conscience","Parce que la loi exige une terminologie précise","Pour les gérer uniquement sur le plan juridique"],a:[1],e:"Nommer les violences permet de les reconnaître, de les rendre visibles et de mieux agir."},
{q:"Quel exemple illustre le mieux une violence psychologique ?",o:["Un coéquipier pousse un autre pendant un match","Un éducateur ridiculise régulièrement un enfant devant l’équipe","Le club n’a pas de vestiaire séparé pour les jeunes","Un entraîneur impose un rythme très intense"],a:[1],e:"Ridiculiser ou humilier régulièrement un enfant constitue une violence psychologique."},
{q:"Quels signes doivent vous alerter sur une situation de danger ?",o:["Un changement brutal de comportement","Des blessures répétées ou inexpliquées","Une progression spectaculaire des performances","Des propos évoquant un mal-être ou une peur","Un manque ponctuel de motivation"],a:[0,1,3],e:"Les changements de comportement, blessures inexpliquées et signes de peur ou de mal-être doivent être pris au sérieux."},
{q:"Quelles attitudes adopter lorsqu’un enfant libère sa parole ?",o:["Lui promettre de garder son secret","Mettre en doute sa parole","Le féliciter d’avoir parlé","Lui rappeler qu’il n’est pas responsable des abus"],a:[2,3],e:"Il faut accueillir la parole, remercier l’enfant et lui rappeler qu’il n’est jamais responsable des violences subies."},
{q:"À partir du 19 novembre 2025, quel document doit être affiché dans les lieux sportifs ?",o:["Une information sur les dispositifs permettant de recueillir les témoignages, orienter et accompagner les victimes ou témoins","La liste du personnel médical","La liste nominative de chaque personne travaillant sur le lieu","Uniquement le numéro 119"],a:[0],e:"L’affichage doit informer sur les dispositifs de recueil, d’orientation et d’accompagnement."},
{q:"Parmi ces exemples, lesquels sont des violences par négligence ?",o:["Obliger un athlète à reprendre malgré une blessure","Encourager un athlète à sacrifier ses études","Utiliser un enfant comme bouc émissaire","Encourager des actes humiliants ou dégradants"],a:[0,1],e:"La négligence consiste notamment à ignorer la santé, la sécurité ou les besoins fondamentaux du jeune."},
{q:"Quels comportements sont des violences psychologiques envers un mineur ?",o:["Encourager un jeune à se dépasser","Isoler volontairement un enfant","Menacer un enfant pour le motiver","Donner un feedback technique après une erreur"],a:[1,2],e:"L’isolement et les menaces sont des moyens de pression qui peuvent constituer des violences psychologiques."},
{q:"Quelle attitude adopter si vous suspectez qu’un mineur est victime de violences ?",o:["En parler au responsable, relayeur ou référent intégrité","Attendre de vérifier soi-même les faits","Accueillir la parole sans forcer l’enfant","Signaler aux autorités compétentes","Ne rien dire par peur de se tromper"],a:[0,2,3],e:"Il faut écouter sans enquêter soi-même, transmettre l’alerte et solliciter les dispositifs compétents."}
];
let participant=null,index=0,score=0,startedAt=null,locked=false;
const $=id=>document.getElementById(id),same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
$("identity").onsubmit=e=>{e.preventDefault();participant={first:$("first").value.trim(),last:$("last").value.trim(),email:$("email").value.trim()};startedAt=Date.now();$("intro").classList.add("hidden");$("quiz").classList.remove("hidden");render()};
function render(){locked=false;$("validate").onclick=validate;$("feedback").innerHTML="";$("validate").disabled=false;const x=questions[index];$("progress").textContent=`Question ${index+1} sur ${questions.length}`;$("question").textContent=x.q;$("choices").innerHTML=x.o.map((v,i)=>`<label class="choice"><input type="checkbox" value="${i}"> <strong>${String.fromCharCode(65+i)}.</strong> ${v}</label>`).join("")}
$("choices").onclick=e=>{const l=e.target.closest(".choice");if(l)l.classList.toggle("selected")};
async function validate(){if(locked)return;locked=true;const answer=[...document.querySelectorAll("#choices input:checked")].map(x=>+x.value);const x=questions[index],ok=same(answer,x.a);if(ok)score++;$("feedback").innerHTML=`<div class="feedback"><strong class="${ok?"good":"bad"}">${ok?"Bonne réponse":"À revoir"}</strong><br>${x.e}</div>`;$("validate").textContent=index===questions.length-1?"Voir mon résultat":"Question suivante";$("validate").onclick=next;};
async function next(){const x=questions[index];await db.from("questionnaire_answers").insert({participant_id:participant.email,question_index:index+1,selected_answers:[...document.querySelectorAll("#choices input:checked")].map(x=>+x.value),correct:same([...document.querySelectorAll("#choices input:checked")].map(x=>+x.value),x.a)});if(index<questions.length-1){index++;$("validate").textContent="Valider";$("validate").onclick=()=>{};render()}else{await db.from("questionnaire_participants").insert({first_name:participant.first,last_name:participant.last,email:participant.email,score,total_questions:questions.length,duration_seconds:Math.round((Date.now()-startedAt)/1000)});$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${score} / ${questions.length}`;$("resultText").textContent=score===questions.length?"Bravo, toutes les notions sont maîtrisées.":"Merci. Ce résultat peut vous aider à poursuivre la réflexion."}}
</script></body></html>
