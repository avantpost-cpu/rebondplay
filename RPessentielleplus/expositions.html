<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#073e55;--pink:#cb8095;--orange:#f47c4b;--shadow:0 8px 12px rgba(0,0,0,.32)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background-color:#e4ae0b;background-image:url("../pageexpo/motifsjaune.jpg"),url("../pageexpo/fondfulljaune.png");background-position:center top,center top;background-size:auto,cover;background-repeat:repeat,no-repeat;background-attachment:fixed;font-family:Nunito,Arial,sans-serif}
.topbar{min-height:clamp(88px,6.15vw,183px);display:flex;align-items:center;justify-content:space-between;gap:34px;padding:14px 4.7%;background:rgba(228,174,11,.78);box-shadow:0 5px 14px rgba(0,0,0,.16);position:relative;z-index:2}
.page-title{width:clamp(250px,25vw,500px);flex:none}.page-title img{width:100%;height:auto}.account{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,1.2vw,30px);min-width:0;color:#126176;text-align:left}.account small{display:block;font-weight:700;margin-top:4px}.logout{margin-left:16px;padding:10px 16px;border:0;border-left:1px solid rgba(7,62,85,.3);background:transparent;color:var(--ink);font-weight:900;cursor:pointer}
main{width:min(90vw,1540px);margin:auto;padding:clamp(38px,6vw,110px) 0 100px}.card{display:block;width:min(520px,100%);margin:auto;border:0;border-radius:30px;overflow:hidden;background:transparent;box-shadow:var(--shadow);cursor:pointer}.card img{display:block;width:100%}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:clamp(16px,4vw,60px);background:rgba(5,28,39,.72);backdrop-filter:blur(5px)}.modal.open{display:flex}.panel{position:relative;width:min(100%,1100px);max-height:92vh}.close{position:absolute;z-index:3;top:18px;right:18px;width:42px;height:42px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:28px;cursor:pointer}.art{position:relative;line-height:0}.art img{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;padding:0;border:0;background:transparent;appearance:none;cursor:pointer}.hotspot:focus:not(:focus-visible){outline:none}.order{left:66.2%;top:71.2%;width:18%;height:27%}.view-expo{left:85%;top:71.2%;width:14%;height:27%}.sport-slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(8px,2vw,22px);width:100%;padding:clamp(12px,2vw,24px);background:#fff}.sport-slider[hidden],.art[hidden]{display:none!important}.sport-slider-image{display:block;width:100%;height:min(78vh,800px);object-fit:contain}.sport-slider-count{margin:8px 0 0;text-align:center;color:#073e55;font:900 16px Nunito,Arial,sans-serif}.sport-slider-arrow{width:clamp(40px,5vw,64px);height:clamp(40px,5vw,64px);border:0;border-radius:50%;background:#073e55;color:#fff;font-size:clamp(26px,3vw,42px);cursor:pointer}@media(max-width:700px){.sport-slider{gap:6px;padding:8px}.sport-slider-image{height:65vh}.sport-slider-arrow{width:38px;height:38px}}.back{position:fixed;left:24px;bottom:24px;padding:10px 16px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.18)}
@media(max-width:700px){.topbar{flex-wrap:wrap;gap:16px;padding:16px 18px}.account{font-size:12px}.close{top:10px;right:10px;width:36px;height:36px;font-size:24px}}
</style>
<style>.rp-footer{width:min(90vw,1540px);margin:clamp(35px,5vw,80px) auto 0;padding:22px 0 28px;border-top:0;display:flex;justify-content:space-between;align-items:center;gap:16px;color:#073e55;font-size:clamp(11px,.8vw,15px)}.rp-footer strong{font-weight:900}.rp-footer a{text-decoration:none;font-weight:800}.rp-footer a:hover{text-decoration:underline}@media(max-width:600px){.rp-footer{flex-direction:column;text-align:center}}</style><style>.rp-footer{margin-top:18px;color:#fff;border-top-color:transparent}.rp-footer a{color:#fff}</style></head>
<body>
<header class="topbar"><div class="page-title"><img src="../pageexpo/titreexpo.png" alt="Expositions"></div><div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span><div class="account-copy"><div class="account-name">Bonjour</div><div class="account-meta">RebondPlay Essentiel+</div></div><button class="logout" id="logout">Se déconnecter</button></div></header>
<main><button class="card" id="open"><img src="../pageexpo/bouton1.png" alt="Exposition Pour un sport sûr"></button></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Exposition Pour un sport sûr"><div class="panel"><button class="close" id="close" aria-label="Fermer">×</button><div class="art" id="sportPoster"><img src="../pageexpo/popupsportsur.jpg" alt="Exposition Pour un sport sûr"><a class="hotspot order" href="mailto:contact@assorebond.com?subject=Commande%20de%20l%E2%80%99exposition%20Pour%20un%20sport%20s%C3%BBr" aria-label="Passer commande"></a><button class="hotspot view-expo" id="openSportSlider" type="button" aria-label="Voir l’exposition"></button></div><div class="sport-slider" id="sportSlider" hidden aria-label="Diaporama de l’exposition Pour un sport sûr"><button class="sport-slider-arrow" id="sportSlidePrevious" type="button" aria-label="Image précédente">‹</button><div class="sport-slider-frame"><img class="sport-slider-image" id="sportSlideImage" src="../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique.jpg" alt="Exposition Pour un sport sûr — planche 1 sur 20"><p class="sport-slider-count" id="sportSlideCount" aria-live="polite">1 / 20</p></div><button class="sport-slider-arrow" id="sportSlideNext" type="button" aria-label="Image suivante">›</button></div></div></div>
<a class="back" href="index.html">← Accueil</a>
<script>
if(sessionStorage.getItem("rp_essentiel_plus_ok")!=="1"){location.replace("../index.html")}
const modal=document.getElementById("modal"),sportPoster=document.getElementById("sportPoster"),sportSlider=document.getElementById("sportSlider"),sportSlideImage=document.getElementById("sportSlideImage"),sportSlideCount=document.getElementById("sportSlideCount"),sportSlideUrls=["../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique2.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique3.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique4.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique5.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique6.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique7.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique8.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique9.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique10.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique11.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique12.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique13.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique14.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique15.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique16.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique17.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique18.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique19.jpg","../pageexpo/exposportsur/Board_Expo_pe%CC%81dagogique20.jpg"];let sportSlideIndex=0;function showSportSlide(index){sportSlideIndex=(index+sportSlideUrls.length)%sportSlideUrls.length;sportSlideImage.src=sportSlideUrls[sportSlideIndex];sportSlideImage.alt=`Exposition Pour un sport sûr — planche ${sportSlideIndex+1} sur ${sportSlideUrls.length}`;sportSlideCount.textContent=`${sportSlideIndex+1} / ${sportSlideUrls.length}`}function resetSportSlider(){sportSlider.hidden=true;sportPoster.hidden=false;showSportSlide(0)}document.getElementById("open").onclick=()=>{resetSportSlider();modal.classList.add("open")};document.getElementById("openSportSlider").onclick=()=>{sportPoster.hidden=true;sportSlider.hidden=false;showSportSlide(0);document.getElementById('sportSlideNext').focus()};document.getElementById("sportSlidePrevious").onclick=()=>showSportSlide(sportSlideIndex-1);document.getElementById("sportSlideNext").onclick=()=>showSportSlide(sportSlideIndex+1);modal.onkeydown=e=>{if(!sportSlider.hidden&&e.key==="ArrowRight")showSportSlide(sportSlideIndex+1);if(!sportSlider.hidden&&e.key==="ArrowLeft")showSportSlide(sportSlideIndex-1)};document.getElementById("close").onclick=()=>{resetSportSlider();modal.classList.remove("open")};modal.onclick=e=>{if(e.target===modal){resetSportSlider();modal.classList.remove("open")}};document.addEventListener("keydown",e=>{if(e.key==="Escape"){resetSportSlider();modal.classList.remove("open")}});document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("rp_essentiel_plus_ok");location.replace("index.html")};
</script>
