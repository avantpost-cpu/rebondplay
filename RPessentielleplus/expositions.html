<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exposition — RebondPlay Essentiel+</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#073e55;--pink:#cb8095;--orange:#f47c4b;--shadow:0 8px 12px rgba(0,0,0,.32)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--pink) url("motifsplus.jpg") center/cover fixed;font-family:Nunito,Arial,sans-serif}
header{min-height:clamp(92px,8.2vw,158px);display:flex;align-items:center;justify-content:space-between;padding:16px 3.4% 10px;background:rgba(203,128,149,.82) url("fondplu.jpg") center/cover}
header img{width:clamp(250px,25vw,500px)}.account{font-weight:900;text-align:right}.account small{display:block;font-weight:700;margin-top:4px}.logout{margin-left:16px;padding:10px 16px;border:0;border-left:1px solid rgba(7,62,85,.3);background:transparent;color:var(--ink);font-weight:900;cursor:pointer}
main{width:min(90vw,1540px);margin:auto;padding:clamp(38px,6vw,110px) 0 100px}.card{display:block;width:min(520px,100%);margin:auto;border:0;border-radius:30px;overflow:hidden;background:transparent;box-shadow:var(--shadow);cursor:pointer}.card img{display:block;width:100%}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:clamp(16px,4vw,60px);background:rgba(5,28,39,.72);backdrop-filter:blur(5px)}.modal.open{display:flex}.panel{position:relative;width:min(100%,1100px);max-height:92vh}.close{position:absolute;z-index:3;top:18px;right:18px;width:42px;height:42px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:28px;cursor:pointer}.art{position:relative;line-height:0}.art img{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;background:transparent;cursor:pointer}.order{left:66.2%;top:71.2%;width:18%;height:27%}.download{left:85%;top:71.2%;width:14%;height:27%}.back{position:fixed;left:24px;bottom:24px;padding:10px 16px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.18)}
@media(max-width:700px){header{flex-wrap:wrap;gap:12px}.account{font-size:12px}.close{top:10px;right:10px;width:36px;height:36px;font-size:24px}}
</style>
</head>
<body>
<header><img src="Logo_RebondPlay_essentielplus.png" alt="RebondPlay Essentiel+"><div class="account">RebondPlay Essentiel+<small>Exposition Pour un sport sûr</small><button class="logout" id="logout">Déconnexion</button></div></header>
<main><button class="card" id="open"><img src="../pageexpo/bouton1.png" alt="Exposition Pour un sport sûr"></button></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Exposition Pour un sport sûr"><div class="panel"><button class="close" id="close" aria-label="Fermer">×</button><div class="art"><img src="../pageexpo/popupsportsur.jpg" alt="Exposition Pour un sport sûr"><a class="hotspot order" href="mailto:contact@assorebond.com?subject=Commande%20de%20l%E2%80%99exposition%20Pour%20un%20sport%20s%C3%BBr" aria-label="Passer commande"></a><a class="hotspot download" href="../pageexpo/exposportsur_full.zip" download aria-label="Télécharger le matériel digital"></a></div></div></div>
<a class="back" href="index.html">← Accueil</a>
<script>
if(sessionStorage.getItem("rp_essentiel_plus_ok")!=="1"){location.replace("../index.html")}
const modal=document.getElementById("modal");document.getElementById("open").onclick=()=>modal.classList.add("open");document.getElementById("close").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("open")});document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("rp_essentiel_plus_ok");location.replace("index.html")};
</script>
</body>
</html>
