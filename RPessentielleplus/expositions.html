<script>
(async()=>{try{
 const client=window.supabase.createClient("https://tdsrqmpfdvntybdlvejy.supabase.co","sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO",{auth:{storageKey:"rebondplay-full-pilot-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const {data:user,error:identityError}=await client.auth.getUser();
 if(identityError||!user?.user)throw Error("Connexion requise");
 const {data,error}=await client.rpc("rp_mon_abonnement");
 if(error||data?.[0]?.offre!=="essentielplus")throw Error("Abonnement Essentiel+ requis");
 document.getElementById("logout").onclick=async()=>{await client.auth.signOut();location.replace("/index.html")};
 }catch(e){console.error("Accès Essentiel+ Expositions",e);location.replace("/connexion-test/")}
})();
function initExpo(type,title,folder,total){
 const el=id=>document.getElementById(type+id),modal=el("Modal"),poster=el("Poster"),slider=el("Slider"),img=el("Image"),count=el("Count"),video=poster.querySelector("video");let index=0;
 function show(i){index=(i+total)%total;img.src="../pageexpo/"+folder+"/"+folder+(index?" "+(index+1):"")+".jpg";img.src=img.src.replace(/%20/g,"");img.alt=title+" — planche "+(index+1)+" sur "+total;count.textContent=(index+1)+" / "+total}
 function close(){if(video)video.pause();modal.classList.remove("open");slider.hidden=true;poster.hidden=false;document.body.style.overflow=""}
 document.getElementById(type==="pedagogique"?"openPedagogique":"openEpreuves").onclick=()=>{show(0);modal.classList.add("open");document.body.style.overflow="hidden"};
 el("Close").onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
 el("View").onclick=()=>{if(video)video.pause();poster.hidden=true;slider.hidden=false;show(0)};
 el("Prev").onclick=()=>show(index-1);el("Next").onclick=()=>show(index+1);
 modal.addEventListener("keydown",e=>{if(e.key==="Escape")close();if(!slider.hidden&&e.key==="ArrowRight")show(index+1);if(!slider.hidden&&e.key==="ArrowLeft")show(index-1)});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))close()});
}
initExpo("pedagogique","Exposition pédagogique","expopedagogique",11);
initExpo("epreuves","Exposition (é)preuves","expoepreuves",36);

</script>
