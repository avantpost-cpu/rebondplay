/* ======================================================
   ZONES DE DÉPÔT
====================================================== */

  z-index:20;

}

  top:226px;

}

#zone2{

  top:292px;

  height:54px;
}

#zone3{
  left:101px;
  top:377px;

  width:268px;
  height:53px;
}

#zone4{
  left:92px;
  top:440px;

  height:52px;
}

#zone5{
  left:84px;
  top:498px;

  width:267px;
  height:48px;

#zone6{

  top:558px;

/* ======================================================
   ÉTIQUETTES À DÉPLACER
====================================================== */

.lettres-panel{
  position:absolute;

  left:535px;
  top:378px;

  z-index:50;

  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  width:320px;
  height:auto;

  gap:6px;

.lettres-panel.visible{

}

.lettre{
  min-width:210px;
  min-height:46px;

  display:flex;

  justify-content:center;

  color:#ffffff;

  font-size:14px;

  line-height:1.2;

  user-select:none;
  touch-action:none;

}

.lettre.dragging{
  z-index:9999;

  cursor:grabbing;

  transform:scale(1.08);
}

.lettre.ok{
  background:#18a558;
  color:#ffffff;
}

/* ======================================================
   DEUXIÈME JEU
====================================================== */

.jeu2{
  position:absolute;

  left:460px;
  top:370px;

  z-index:45;

  display:none;

  width:500px;
  height:auto;
}

.jeu2.visible{
  display:block;
}

.reponse-jeu2{
  position:absolute;

  left:620px;
  top:498px;

  z-index:70;

  width:155px;
  height:38px;

  border:none;
  outline:none;

  background:transparent;
  color:#111111;

  font-size:28px;
  font-weight:bold;

  text-align:center;
  text-transform:uppercase;

  letter-spacing:4px;
}

.reponse-jeu2.visible{
  display:block;
}

.reponse-jeu2.ok{
  border-radius:8px;

  background:#18a558;
  color:#ffffff;
}

.reponse-jeu2[readonly]{
  pointer-events:none;

  -webkit-text-fill-color:#ffffff;
}

.reponse-jeu2.erreur{
  border-radius:8px;

  background:#c0392b;
  color:#ffffff;
}

/* ======================================================
   BRAVO DE FIN
====================================================== */

.bloc-enigme4.gagnee .animation-4,

.bravi-final.visible{

.bravi-final img{

/* ======================================================

====================================================== */

.inventaire{

.inventaire-tab{

/* ======================================================
   BOUTON MUSIQUE D’AMBIANCE
====================================================== */

.music-toggle{
  position:absolute;

  top:220px;

  align-items:center;

.music-toggle img{

<script>
const videoEnigme4 =
  document.getElementById(
    "videoEnigme4"
  );

const lettresPanel =
  document.getElementById(
    "lettresPanel"
  );

const nextBtn =
  document.getElementById(
    "nextBtn"
  );

const jeu2 =
  document.getElementById(
    "jeu2"
  );

const reponseJeu2 =
  document.getElementById(
    "reponseJeu2"
  );

const braviFinal =
  document.getElementById(
    "braviFinal"
  );

const voix4 =
  document.getElementById(
    "voix4"
  );

const musiqueAmbiance =
  document.getElementById(
    "musiqueAmbiance"
  );

const musicToggle =
  document.getElementById(
    "musicToggle"
  );

const musicToggleImage =
  document.getElementById(
    "musicToggleImage"
  );

let lettreActive = null;
let offsetX = 0;
let offsetY = 0;
let jeuTermine = false;

/* ======================================================
   VOIX 4 — DÉMARRAGE IMMÉDIAT À L’OUVERTURE DE LA PAGE
   AVEC REPLI AU PREMIER GESTE SI LE NAVIGATEUR BLOQUE
====================================================== */

let voix4DejaLancee = false;

function lancerVoix4(){

  if(
    voix4DejaLancee ||
    !voix4
  ){
    return;
  }

  voix4DejaLancee = true;

  try{
    voix4.pause();
    voix4.currentTime = 0;
    voix4.volume = 1;
    voix4.muted = false;
  }
  catch(error){}

  const lecture =
    voix4.play();

  if(
    lecture &&
    typeof lecture.catch ===
    "function"
  ){

    lecture.catch(
      function(){
        voix4DejaLancee = false;
      }
    );

  }

}

function tenterDemarrageAudioEtVideo4(){

  if(videoEnigme4){

    try{
      videoEnigme4.currentTime = 0;
    }
    catch(error){}

    const lectureVideo =
      videoEnigme4.play();

    if(
      lectureVideo &&
      typeof lectureVideo.catch ===
      "function"
    ){
      lectureVideo.catch(
        function(){}
      );
    }

  }

  lancerVoix4();

}

function autoriserVoix4(){

  lancerVoix4();

  document.removeEventListener(
    "pointerdown",
    autoriserVoix4
  );

  document.removeEventListener(
    "keydown",
    autoriserVoix4
  );

  document.removeEventListener(
    "touchstart",
    autoriserVoix4
  );

}

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    tenterDemarrageAudioEtVideo4,
    {
      once:true
    }
  );

}
else{

  tenterDemarrageAudioEtVideo4();

}

window.addEventListener(
  "load",
  function(){
    lancerVoix4();
  },
  {
    once:true
  }
);

document.addEventListener(
  "pointerdown",
  autoriserVoix4
);

document.addEventListener(
  "touchstart",
  autoriserVoix4,
  {
    passive:true
  }
);

document.addEventListener(
  "keydown",
  autoriserVoix4
);

/* ======================================================
   MUSIQUE D’AMBIANCE
====================================================== */

const VOLUME_MUSIQUE = 0.32;
let musiqueDemarree = false;

function musiqueEstCoupee(){
  return localStorage.getItem("rebondMusicMuted") === "1";
}

function mettreAJourBoutonMusique(){

  if(
    !musicToggle ||
    !musicToggleImage
  ){
    return;
  }

  if(musiqueEstCoupee()){

    musicToggleImage.src =
      "musicno.png";

    musicToggle.setAttribute(
      "aria-label",
      "Activer la musique d’ambiance"
    );

    musicToggle.title =
      "Activer la musique d’ambiance";

  }
  else{

    musicToggleImage.src =
      "musicok.png";

    musicToggle.setAttribute(
      "aria-label",
      "Couper la musique d’ambiance"
    );

    musicToggle.title =
      "Couper la musique d’ambiance";

  }

}

function demarrerMusiqueAmbiance(){

  if(
    !musiqueAmbiance ||
    musiqueEstCoupee()
  ){
    return;
  }

  musiqueAmbiance.loop = true;
  musiqueAmbiance.volume = VOLUME_MUSIQUE;
  musiqueAmbiance.muted = false;

  const lecture = musiqueAmbiance.play();

  if(
    lecture &&
    typeof lecture.then === "function"
  ){
    lecture
      .then(function(){
        musiqueDemarree = true;
      })
      .catch(function(){
        musiqueDemarree = false;
      });
  }

}

function couperMusiqueAmbiance(){

  if(!musiqueAmbiance){
    return;
  }

  musiqueAmbiance.pause();
  musiqueDemarree = false;

}

function basculerMusique(){

  if(musiqueEstCoupee()){

    localStorage.setItem(
      "rebondMusicMuted",
      "0"
    );

    mettreAJourBoutonMusique();
    demarrerMusiqueAmbiance();

  }
  else{

    localStorage.setItem(
      "rebondMusicMuted",
      "1"
    );

    couperMusiqueAmbiance();
    mettreAJourBoutonMusique();

  }

}

function autoriserMusiqueAuPremierGeste(){

  if(
    !musiqueDemarree &&
    !musiqueEstCoupee()
  ){
    demarrerMusiqueAmbiance();
  }

}

if(musicToggle){

  musicToggle.addEventListener(
    "click",
    function(event){

      event.preventDefault();
      event.stopPropagation();

      basculerMusique();

    }
  );

}

mettreAJourBoutonMusique();

document.addEventListener(
  "pointerdown",
  autoriserMusiqueAuPremierGeste
);

document.addEventListener(
  "keydown",
  autoriserMusiqueAuPremierGeste
);

window.addEventListener(
  "load",
  function(){

    window.setTimeout(
      demarrerMusiqueAmbiance,
      150
    );

  }
);

/* ======================================================
   SONS DU PREMIER JEU
   Bonne association : win2.mp3
   Mauvaise association : wrong.mp3
====================================================== */

function jouerSonReponse4(src){

  try{

    const audio =
      new Audio(src);

    audio.preload =
      "auto";

    audio.volume =
      1;

    audio.currentTime =
      0;

    const lecture =
      audio.play();

    if(
      lecture &&
      typeof lecture.catch ===
      "function"
    ){

      lecture.catch(
        function(error){

          console.error(
            "Impossible de lire le son : " + src,
            error
          );

        }
      );

    }

  }
  catch(error){

    console.error(
      "Erreur audio : " + src,
      error
    );

  }

}

function jouerBonneReponse4(){

  jouerSonReponse4(
    "enigme2/win2.mp3"
  );

}

function jouerMauvaiseReponse4(){

  jouerSonReponse4(
    "enigme2/wrong.mp3"
  );

}

/* ======================================================
   ENREGISTREMENT DE LA PROGRESSION
====================================================== */

localStorage.setItem(
  "rebondCurrentPage",
  "enigme4.html"
);

/* ======================================================
   INITIALISATION
====================================================== */

afficherMotsTrouves();

/* ======================================================
   AFFICHAGE DU PREMIER JEU APRÈS LA VIDÉO
====================================================== */

videoEnigme4.addEventListener(
  "ended",
  function(){

    lettresPanel.classList.add(
      "visible"
    );

  }
);

/*
  Si la vidéo est déjà terminée ou n’a pas pu être lue,
  le jeu peut tout de même apparaître.
*/

videoEnigme4.addEventListener(
  "error",
  function(){

    lettresPanel.classList.add(
      "visible"
    );

  }
);

/* ======================================================
   DÉBUT DU GLISSER-DÉPOSER
====================================================== */

document
  .querySelectorAll(
    ".lettre"
  )
  .forEach(
    function(lettre){

      lettre.addEventListener(
        "pointerdown",
        commencerDrag
      );

    }
  );

function commencerDrag(event){

  if(
    event.currentTarget
      .classList
      .contains("ok")
  ){
    return;
  }

  event.preventDefault();

  lettreActive =
    event.currentTarget;

  const rect =
    lettreActive
      .getBoundingClientRect();

  offsetX =
    event.clientX -
    rect.left;

  offsetY =
    event.clientY -
    rect.top;

  document.body.appendChild(
    lettreActive
  );

  lettreActive.classList.add(
    "dragging"
  );

  lettreActive.style.position =
    "fixed";

  lettreActive.style.left =
    rect.left + "px";

  lettreActive.style.top =
    rect.top + "px";

  lettreActive.style.zIndex =
    "9999";

}

/* ======================================================
   DÉPLACEMENT
====================================================== */

document.addEventListener(
  "pointermove",
  function(event){

    if(!lettreActive){
      return;
    }

    lettreActive.style.left =
      (
        event.clientX -
        offsetX
      ) + "px";

    lettreActive.style.top =
      (
        event.clientY -
        offsetY
      ) + "px";

  }
);

/* ======================================================
   FIN DU GLISSER-DÉPOSER
====================================================== */

document.addEventListener(
  "pointerup",
  function(event){

    if(!lettreActive){
      return;
    }

    let zoneTrouvee = null;

    document
      .querySelectorAll(
        ".drop-zone"
      )
      .forEach(
        function(zone){

          const rect =
            zone
              .getBoundingClientRect();

          if(
            event.clientX >= rect.left &&
            event.clientX <= rect.right &&
            event.clientY >= rect.top &&
            event.clientY <= rect.bottom
          ){

            zoneTrouvee =
              zone;

          }

        }
      );

    if(
      zoneTrouvee &&
      lettreActive.dataset.letter ===
      zoneTrouvee.dataset.answer
    ){

      jouerBonneReponse4();

      zoneTrouvee.appendChild(
        lettreActive
      );

      lettreActive.classList.remove(
        "dragging"
      );

      lettreActive.classList.add(
        "ok"
      );

      lettreActive.style.position =
        "absolute";

      /*
        On décale légèrement le signal d’alerte vers la droite
        afin de laisser visible le numéro #1, #2, etc. de la note.
      */

      lettreActive.style.left =
        "56%";

      lettreActive.style.top =
        "50%";

      lettreActive.style.transform =
        "translate(-50%, -50%) rotate(3deg)";

      lettreActive.style.zIndex =
        "80";

      lettreActive.style.pointerEvents =
        "none";

      verifierFinJeu1();

    }
    else{

      /*
        Si l'enfant a bien déposé le signal sur une note,
        mais sur la mauvaise note : son d'erreur.
        Un simple lâcher en dehors des notes ne déclenche pas wrong.
      */

      if(zoneTrouvee){

        jouerMauvaiseReponse4();

      }

      retourDepart(
        lettreActive
      );

    }

    lettreActive =
      null;

  }
);

/* ======================================================
   RETOUR À LA POSITION DE DÉPART
====================================================== */

function retourDepart(lettre){

  lettresPanel.appendChild(
    lettre
  );

  lettre.classList.remove(
    "dragging"
  );

  lettre.style.position =
    "";

  lettre.style.left =
    "";

  lettre.style.top =
    "";

  lettre.style.transform =
    "";

  lettre.style.zIndex =
    "";

}

/* ======================================================
   FIN DU PREMIER JEU
====================================================== */

function verifierFinJeu1(){

  const lettresOk =
    document.querySelectorAll(
      ".lettre.ok"
    );

  if(
    lettresOk.length === 6
  ){

    lettresPanel.style.display =
      "none";

    jeu2.classList.add(
      "visible"
    );

    reponseJeu2.classList.add(
      "visible"
    );

    reponseJeu2.focus();

  }

}

/* ======================================================
   SECOND JEU
====================================================== */

reponseJeu2.addEventListener(
  "input",
  function(){

    if(jeuTermine){
      return;
    }

    reponseJeu2.value =
      reponseJeu2.value
        .toUpperCase();

    const valeur =
      nettoyerTexte(
        reponseJeu2.value
      );

    reponseJeu2.classList.remove(
      "erreur"
    );

    if(
      valeur === "ALERTE"
    ){

      terminerEnigme();

    }

  }
);

reponseJeu2.addEventListener(
  "blur",
  function(){

    if(jeuTermine){
      return;
    }

    const valeur =
      nettoyerTexte(
        reponseJeu2.value
      );

    if(
      valeur.length > 0 &&
      valeur !== "ALERTE"
    ){

      reponseJeu2.classList.add(
        "erreur"
      );

    }

  }
);

/* ======================================================
   FIN DE L’ÉNIGME
====================================================== */

function terminerEnigme(){

  if(jeuTermine){
    return;
  }

  jeuTermine =
    true;

  reponseJeu2.classList.remove(
    "erreur"
  );

  reponseJeu2.classList.add(
    "ok"
  );

  reponseJeu2.readOnly =
    true;

  ajouterMotTrouve(
    "Énigme 4",
    "L'ENFANCE"
  );

  document
    .querySelector(
      ".bloc-enigme4"
    )
    .classList.add(
      "gagnee"
    );

  braviFinal.classList.add(
    "visible"
  );

  window.setTimeout(
    function(){

      nextBtn.classList.add(
        "visible"
      );

    },
    1000
  );

}

/* ======================================================
   NETTOYAGE DU TEXTE
====================================================== */

function nettoyerTexte(texte){

  return String(
    texte || ""
  )
    .trim()
    .toUpperCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^A-Z]/g,
      ""
    );

}

/* ======================================================
   LECTURE SÉCURISÉE DE L’INVENTAIRE
====================================================== */

function lireMotsTrouves(){

  try{

    const donnees =
      JSON.parse(
        localStorage.getItem(
          "motsEscapeRebond"
        )
      );

    return Array.isArray(
      donnees
    )
      ? donnees
      : [];

  }
  catch(error){

    return [];

  }

}

/* ======================================================
   AJOUT DU MOT DANS L’INVENTAIRE
====================================================== */

function ajouterMotTrouve(
  enigme,
  mot
){

  const mots =
    lireMotsTrouves();

  const existeDeja =
    mots.some(
      function(item){

        return (
          item.enigme ===
          enigme
        );

      }
    );

  if(!existeDeja){

    mots.push({
      enigme:enigme,
      mot:mot
    });

    localStorage.setItem(
      "motsEscapeRebond",
      JSON.stringify(
        mots
      )
    );

  }

  afficherMotsTrouves();

}

/* ======================================================
   AFFICHAGE DE L’INVENTAIRE
====================================================== */

function afficherMotsTrouves(){

  const liste =
    document.getElementById(
      "listeMots"
    );

  if(!liste){
    return;
  }

  const mots =
    lireMotsTrouves();

  liste.innerHTML =
    "";

  if(
    mots.length === 0
  ){

    const li =
      document.createElement(
        "li"
      );

    li.textContent =
      "Aucun mot";

    liste.appendChild(
      li
    );

    return;

  }

  mots.forEach(
    function(item){

      const li =
        document.createElement(
          "li"
        );

      li.textContent =
        item.enigme +
        " : " +
        item.mot;

      liste.appendChild(
        li
      );

    }
  );

}

/* ======================================================
   CONFIRMATION DE LA PROGRESSION AU CHARGEMENT
====================================================== */

window.addEventListener(
  "load",
  function(){

    localStorage.setItem(
      "rebondCurrentPage",
      "enigme4.html"
    );

  }
);
</script>
