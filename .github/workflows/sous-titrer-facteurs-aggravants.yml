name: Generate English subtitles — Les facteurs aggravants
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sous-titrer-facteurs-aggravants.yml'
permissions:
  contents: write
jobs:
  subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Whisper and verify source
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install openai-whisper==20250625
          test -s "pagevideo/animations/Les facteurs aggravants.mp4"
          ffprobe -hide_banner -v error -show_entries format=duration -of default=noprint_wrappers=1 "pagevideo/animations/Les facteurs aggravants.mp4"
          ffprobe -v error -show_entries stream=index,codec_type,codec_name -of compact "pagevideo/animations/Les facteurs aggravants.mp4"
          if ! ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "pagevideo/animations/Les facteurs aggravants.mp4" | grep -q .; then
            echo "::error::The video has no audio stream. Spoken English subtitles cannot be generated from it."
            exit 1
          fi
      - name: Transcribe French and translate to timed English captions
        run: |
          whisper "pagevideo/animations/Les facteurs aggravants.mp4" \
            --model small \
            --language French \
            --task translate \
            --output_format vtt \
            --output_dir /tmp/rebond-subtitles \
            --verbose False \
            --fp16 False
          if ! grep -Eq "[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3} --> " "/tmp/rebond-subtitles/Les facteurs aggravants.vtt"; then
            echo "::error::Whisper produced no timed subtitles; refusing to commit an empty VTT."
            exit 1
          fi
          cp "/tmp/rebond-subtitles/Les facteurs aggravants.vtt" "pagevideo/animations/Les facteurs aggravants_en.vtt"
      - name: Commit the English subtitles without altering the French video
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "pagevideo/animations/Les facteurs aggravants_en.vtt"
          if git diff --cached --quiet; then
            echo "English subtitles unchanged."
            exit 0
          fi
          git commit -m "Add English subtitles for Les facteurs aggravants"
          git push
