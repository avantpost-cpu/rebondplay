name: Finaliser les dépendances hors e-learning
on:
  push:
    paths:
      - '.github/workflows/finaliser-hors-elearning.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finaliser-hors-elearning
  cancel-in-progress: false
jobs:
  finaliser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Corriger le logo local et documenter les ressources restantes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,datetime
          admin=Path('vraifaux/admin.html')
          old='https://avantpost-cpu.github.io/depot-quiz/cartes/logo.png'
          assert Path('vraifaux/logo.png').is_file()
          data=admin.read_text()
          assert data.count(old)==1, 'Référence inattendue, arrêt sans modification'
          admin.write_text(data.replace(old,'./logo.png'))
          current=json.loads(Path('mediatheque/ressources.json').read_text())
          pilot=json.loads(Path('mediatheque-pilote/ressources.json').read_text())
          mapped={x['title']:x['privateModule'] for x in current if x.get('privateModule')}
          remaining=[x for x in pilot if 'depot-quiz/' in x.get('url','')]
          assert len(remaining)==30
          assert all(x['title'] in mapped for x in remaining), 'Module non encore privé'
          report=['# État des ressources hors e-learning','',f'Date : {datetime.datetime.now(datetime.timezone.utc).isoformat()}','','## Terminé','- 22 visuels Documents/Satisfaction recopiés et liens modifiés.','- Jeux Vrai/Faux et La Main Juste : images locales.','- Administration Vrai/Faux : logo local.','- Médiathèque principale : 30 modules privés déjà référencés dans mediatheque/ressources.json.','','## À traiter sans toucher au e-learning','- mediatheque-pilote/ressources.json : 30 anciennes URLs encore présentes, mais 30 correspondances privées dans la médiathèque principale. Ne pas modifier la page pilote sans vérifier son lecteur et ses contrôles d’accès.','- enigme5/enigme5.html : vidéo MP4 encore chargée depuis depot-quiz, copie locale non identique.','- Toutes les références e-learning et pagevideo restent protégées.','','## Précaution','- Ne supprimer aucun fichier de depot-quiz avant vérification des usages transversaux.','- Une copie dans un dépôt public ne constitue pas un stockage privé.','']
          Path('audits').mkdir(exist_ok=True)
          Path('audits/etat-migration-hors-elearning.md').write_text('\n'.join(report))
          print('Logo Vrai/Faux corrigé; 30 modules privés identifiés; rapport créé.')
          PY
          git diff --exit-code -- elearning pagevideo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vraifaux/admin.html audits/etat-migration-hors-elearning.md
          if ! git diff --cached --quiet; then
            git commit -m 'Finaliser logo Vrai/Faux et état des dépendances hors e-learning [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
