name: Migrer les ressources publiques hors e-learning
on:
  push:
    paths:
      - '.github/workflows/migrer-ressources-hors-elearning.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: migration-ressources-hors-elearning
  cancel-in-progress: false
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copier et relier les ressources des documents et du questionnaire
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/avantpost-cpu/depot-quiz.git /tmp/depot-quiz
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, hashlib
          base=Path.cwd()
          src=Path('/tmp/depot-quiz')
          targets=['pagedocuments/index.html','questionnaire-satisfaction/index.html']
          pattern=re.compile(r'https://avantpost-cpu\.github\.io/depot-quiz/([\w./%-]+\.(?:png|jpg|jpeg|webp))',re.I)
          changed=[]
          for rel in targets:
              path=base/rel
              original=path.read_text(encoding='utf-8')
              refs=sorted(set(pattern.findall(original)))
              result=original
              for ref in refs:
                  source=src/ref
                  if not source.is_file():
                      raise RuntimeError(f'Source introuvable : {ref}')
                  destination=base/'assets'/'legacy-depot-quiz'/ref
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(source,destination)
                  if hashlib.sha256(source.read_bytes()).digest()!=hashlib.sha256(destination.read_bytes()).digest():
                      raise RuntimeError(f'Copie non identique : {ref}')
                  relative=__import__('os').path.relpath(destination,path.parent).replace('\\','/')
                  result=result.replace('https://avantpost-cpu.github.io/depot-quiz/'+ref,relative)
              if result!=original:
                  path.write_text(result,encoding='utf-8')
                  changed.append((rel,len(refs)))
          # Ne modifier aucune page e-learning ni animation.
          assert not __import__('subprocess').run(['git','diff','--name-only','--','elearning','pagevideo'],capture_output=True,text=True,check=True).stdout.strip()
          print('Pages mises à jour :',changed)
          print('Copies contrôlées :',sum(n for _,n in changed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pagedocuments/index.html questionnaire-satisfaction/index.html assets/legacy-depot-quiz
          if ! git diff --cached --quiet; then
            git commit -m 'Migrer en lot les illustrations Documents et Satisfaction [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git diff --quiet HEAD -- elearning pagevideo
