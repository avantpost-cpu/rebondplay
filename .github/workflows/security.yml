name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-scripts:
    name: Tests des scripts de controle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
  secrets:
    name: Secrets - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Gitleaks avec verification SHA-256
        run: python3 scripts/security/install_gitleaks.py --output "$RUNNER_TEMP/gitleaks"
      - name: Examiner tous les commits accessibles
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'
  dependency-audit:
    name: Dependances CDN - npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Inventorier les bibliotheques chargees par CDN
        run: python3 scripts/security/dependencies.py --output "$RUNNER_TEMP/cdn-audit"
      - name: Resoudre sans installer ni executer de scripts npm
        working-directory: ${{ runner.temp }}/cdn-audit
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Rechercher les vulnerabilites connues
        working-directory: ${{ runner.temp }}/cdn-audit
        shell: bash
        run: |
          set +e
          npm audit --json --audit-level=low > audit.json
          audit_status=$?
          set -e
          python3 "$GITHUB_WORKSPACE/scripts/security/audit_summary.py" audit.json
          exit "$audit_status"
  inventory-policy:
    name: Versions fixes et couverture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/security/dependencies.py --strict --output "$RUNNER_TEMP/cdn-policy"
  jsr-audit:
    name: Dependances Edge - Deno
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Deno 2.9.8
        shell: bash
        run: |
          curl -fsSL https://deno.land/install.sh -o "$RUNNER_TEMP/install-deno.sh"
          sh "$RUNNER_TEMP/install-deno.sh" v2.9.8
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Verifier les types et le verrouillage
        run: >-
          deno check --frozen
          --lock=supabase/functions/send-quiz-summary/deno.lock
          supabase/functions/send-quiz-summary/index.ts

      - name: Rechercher les vulnerabilites connues
        run: >-
          deno audit
          --lock=supabase/functions/send-quiz-summary/deno.lock
          --frozen-lockfile
