<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f4ef">
<title>Médiathèque — RebondPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}:root{--ink:#063e54;--blue:#065269;--orange:#ff764b;--pink:#c697c7;--aqua:#79d3d7;--paper:#f7f4ef;--yellow:#efb416;--shadow:0 8px 18px rgba(3,42,56,.18);--content:min(92vw,1800px)}
html{scroll-behavior:smooth}body{margin:0;min-width:300px;background-color:#f7f4ef;background-image:url("./motifsmediatheque.jpg"),url("./fondmediatheque.jpg");background-position:center top,center top;background-size:auto,cover;background-repeat:repeat,no-repeat;background-attachment:fixed,fixed;font-family:"Nunito",Arial,sans-serif;color:var(--ink)}
.topbar{min-height:clamp(92px,7vw,142px);display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:clamp(16px,2vw,34px);padding:10px 3.4% 8px;background:transparent;box-shadow:0 5px 14px rgba(0,0,0,.16);position:relative;z-index:2}.brand{display:block;width:min(100%,clamp(252px,35.4vw,648px));flex:none}.brand img{width:100%;height:auto;display:block}.header-mascot{width:clamp(68px,7vw,118px);height:clamp(65px,6.5vw,110px);object-fit:contain;align-self:center}.account{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,1.1vw,22px);min-width:0;color:#126176}.avatar{width:clamp(42px,3.25vw,70px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;background:#126176;color:#f7f4ef}.avatar svg{width:62%;height:62%;fill:currentColor}.account-copy{min-width:0}.account-name{font-size:clamp(13px,1.05vw,23px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-meta{margin-top:3px;font-size:clamp(10px,.78vw,17px);font-weight:700;white-space:nowrap}.logout{min-height:46px;padding:0 clamp(10px,1.3vw,25px);border:0;border-left:1px solid rgba(8,47,74,.28);background:transparent;color:inherit;font-weight:900;cursor:pointer;white-space:nowrap}.logout:hover{color:#a23445}.hand{font-family:"Patrick Hand",cursive;font-weight:400}
.search-wrap{width:var(--content);margin:clamp(18px,2vw,34px) auto 0;padding:clamp(20px,2.2vw,38px);display:flex;justify-content:center;border-radius:clamp(18px,1.25vw,30px);background:rgba(250,249,245,.94);box-shadow:var(--shadow)}
.search-box{width:min(900px,100%);position:relative}.search-box label{display:block;font-size:clamp(17px,1.25vw,23px);font-weight:900;color:var(--blue);margin:0 0 9px}
#search{width:100%;padding:15px 18px;border:2px solid var(--blue);border-radius:13px;background:white;color:var(--ink);font:inherit;font-size:clamp(16px,1.1vw,20px);outline:none}#search:focus{box-shadow:0 0 0 4px #06526925}
#searchHint{margin:8px 0 0;color:#52666b;font-size:clamp(12px,.82vw,15px)}
.alphabet{width:var(--content);margin:clamp(16px,1.5vw,26px) auto 0;display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:clamp(15px,1.5vw,25px);border-radius:clamp(16px,1.1vw,24px);background:rgba(199,151,200,.94);box-shadow:var(--shadow)}
.alphabet a{min-width:39px;text-align:center;color:var(--blue);text-decoration:none;font-weight:900;padding:7px 10px;border-radius:9px;border:2px solid rgba(6,82,105,.55);background:rgba(255,255,255,.83);font-size:15px;transition:transform .18s,background .18s,color .18s}.alphabet a:hover,.alphabet a.active{background:var(--blue);border-color:var(--blue);color:white;transform:translateY(-2px)}.alphabet a.disabled{opacity:.3;pointer-events:none}
.status{width:var(--content);margin:clamp(23px,2.2vw,40px) auto 0;padding:0 4px;color:var(--ink);font-size:clamp(14px,.9vw,17px);font-weight:900}
.grid{width:var(--content);margin:16px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,1.7vw,32px);padding:0 0 clamp(55px,6vw,100px)}@media(max-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:rgba(250,249,245,.96);border-radius:clamp(18px,1.25vw,30px);padding:clamp(18px,1.5vw,28px);box-shadow:var(--shadow);min-width:0;transition:translate .22s,box-shadow .22s}.card:hover{translate:0 -4px;box-shadow:0 12px 22px rgba(3,42,56,.24)}.card h2{margin:0;color:var(--blue);font-size:clamp(19px,1.35vw,25px);line-height:1.25;font-weight:900}.card p{font-size:clamp(13px,.92vw,16px);line-height:1.5;margin:10px 0}
.preview{margin:15px 0;border-radius:10px;overflow:hidden;border:1px solid #ddd;background:#000;height:260px}.preview iframe{width:100%;height:100%;border:0;background:white}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a,.actions button{border:0;text-decoration:none;padding:10px 16px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer;transition:translate .18s,filter .18s}.actions a:hover,.actions button:hover{translate:0 -2px;filter:brightness(.96)}.open{background:var(--blue);color:#fff;font-weight:900}.copy{background:#c4cc06;color:#111;font-weight:900}.helper{font-size:12px;color:#52666b;margin-top:7px}
.docs{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.tag{display:inline-block;background:#e8f1f1;color:var(--blue);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800}.doc-list{display:grid;gap:8px;margin:12px 0}.doc-list strong{color:var(--blue);font-size:14px}.doc-list a.document-download{display:block;padding:11px 14px;border-radius:9px;background:var(--yellow);color:#171717;font-size:14px;font-weight:900;text-decoration:none}.doc-list a.document-download:hover{background:#dca50e}.preview-file{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;background:#fff;color:var(--blue);text-align:center}.preview-file .file-icon{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#e8f1f1;font-size:30px;font-weight:900}.preview-file strong{font-size:18px}.preview-file small{color:#52666b;font-size:13px}
.empty{grid-column:1/-1;background:white;padding:28px;border-radius:12px;text-align:center;color:#555}.hidden{display:none!important}
.rp-footer{width:var(--content);margin:0 auto;padding:22px 0 30px;display:flex;justify-content:space-between;align-items:center;gap:16px;color:#fff;font-size:clamp(11px,.8vw,15px)}.rp-footer strong{font-weight:900}.rp-footer a{color:inherit;text-decoration:none;font-weight:800}.rp-footer a:hover{text-decoration:underline}
.back{position:fixed;z-index:30;left:clamp(14px,2vw,38px);bottom:clamp(14px,2vw,38px);display:flex;align-items:center;gap:8px;padding:10px 16px;border:0;border-radius:999px;background:#fff;color:var(--blue);text-decoration:none;font-size:14px;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.18);transition:transform .18s,box-shadow .18s}.back:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.23)}.back span{font-size:19px;line-height:1}@media(max-width:900px){.topbar{display:flex;align-items:flex-start;flex-wrap:wrap;gap:10px;padding:12px 18px}.brand{width:60%;max-width:100%}.header-mascot{width:18%;height:auto;max-height:110px;object-fit:contain;margin-left:auto}.account{width:100%;justify-content:flex-start}.account-copy{flex:1}.account-meta{white-space:normal}.logout{font-size:12px;padding-inline:12px}}
@media(max-width:760px){.search-wrap,.alphabet,.status,.grid{width:calc(100% - 28px)}.preview{height:220px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding-bottom:50px}.card{padding:16px}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
@media(max-width:600px){.rp-footer{flex-direction:column;text-align:center;padding-inline:10px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><img src="./tetieremediateque.png" alt="Médiathèque RebondPlay"></div><img class="header-mascot" src="./angemediatheque.png" alt="" aria-hidden="true"><div class="account" aria-label="Compte connecté"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span><div class="account-copy"><div class="account-name" id="accountName">Bonjour</div><div class="account-meta" id="accountMeta"></div></div><button class="logout" id="logoutButton" type="button">Se déconnecter</button></div></header>
<section class="search-wrap"><div class="search-box"><label for="search">Rechercher un outil, un document ou un thème</label><input id="search" type="search" placeholder="Ex. : emprise, prévention, affiches…" autocomplete="off"><p id="searchHint">La recherche porte sur les titres, descriptions, thèmes, mots-clés et documents associés.</p></div></section>
<nav class="alphabet" aria-label="Filtrer par première lettre"></nav>
<div class="status" id="status" aria-live="polite"></div><main class="grid" id="grid"></main>
<script>
(()=>{const keys=["rebondplay_access_ok","rebondplay_abonnement_id","rebondplay_nom_structure","rebondplay_code","rebondplay_date_fin","rebondplay_prenom_contact","rebondplay_nom_contact"],get=k=>sessionStorage.getItem(k)||"";if(get("rebondplay_access_ok")!=="1"){location.replace("../index.html");return}const name=[get("rebondplay_prenom_contact"),get("rebondplay_nom_contact")].filter(Boolean).join(" ")||get("rebondplay_nom_structure");document.getElementById("accountName").textContent=`Bonjour ${name}`.trim();let meta=get("rebondplay_nom_structure");const end=get("rebondplay_date_fin");if(end){const days=Math.max(0,Math.ceil((new Date(`${end}T23:59:59`)-Date.now())/86400000));meta=`Votre abonnement est encore valable ${days} jour${days>1?"s":""}`}document.getElementById("accountMeta").textContent=meta;document.getElementById("logoutButton").addEventListener("click",()=>{keys.forEach(k=>sessionStorage.removeItem(k));location.replace("../index.html")})})();
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');let resources=[];let selectedLetter='';
const grid=document.querySelector('#grid'), search=document.querySelector('#search'), nav=document.querySelector('.alphabet'), status=document.querySelector('#status');
function norm(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function buildAlphabet(){const available=new Set(resources.map(x=>(x.title||'').trim().charAt(0).toUpperCase()));nav.innerHTML=alphabet.map(l=>available.has(l)?`<a href="#${l}" data-letter="${l}">${l}</a>`:`<a class="disabled" aria-disabled="true">${l}</a>`).join('');nav.querySelectorAll('[data-letter]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();selectedLetter=selectedLetter===a.dataset.letter?'':a.dataset.letter;render()}))}
function fileSearchText(d){return [d.label,d.type,d.summary,...(d.keywords||[])].filter(Boolean).join(' ')}
function searchText(r){return norm([r.title,r.summary,r.type,...(r.themes||[]),...(r.keywords||[]),...(r.documents||[]).map(fileSearchText)].filter(Boolean).join(' '))}
function card(r){const docs=Array.isArray(r.documents)?r.documents:[];const tags=(r.themes||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');const docHtml=docs.length?`<div class="doc-list"><strong>${docs.length>1?'Documents à télécharger':'Document à télécharger'}</strong>${docs.map(d=>`<a class="document-download" href="${esc(d.url)}" download>⬇ ${esc(d.label||d.type||'Télécharger le document')}${d.type?` · ${esc(d.type)}`:''}</a>`).join('')}</div>`:'';const href=r.url||'';const preview=r.previewImage?`<div class="preview"><img src="${esc(r.previewImage)}" alt="Aperçu : ${esc(r.title)}" style="width:100%;height:100%;object-fit:contain;background:#fff"></div>`:href?`<div class="preview"><iframe loading="lazy" title="Aperçu : ${esc(r.title)}" src="${esc(href)}"></iframe></div>`:`<div class="preview"><div class="preview-file"><span class="file-icon" aria-hidden="true">↓</span><strong>${esc(r.type||'Ressource Rebond')}</strong><small>${docs.length} fichier${docs.length===1?'':'s'} à télécharger</small></div></div>`;const actions=href?`<div class="actions"><a class="open" href="${esc(href)}" target="_blank" rel="noopener">Ouvrir</a><button class="copy" type="button" data-copy="${esc(href)}">📋 Copier le lien</button></div><div class="helper">Copie le lien de cette ressource</div>`:'';return `<article class="card" data-search="${esc(searchText(r))}"><h2>${esc(r.title)}</h2>${r.summary?`<p>${esc(r.summary)}</p>`:''}${preview}${tags?`<div class="docs" aria-label="Thèmes">${tags}</div>`:''}${docHtml}${actions}</article>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=norm(search.value.trim());let filtered=resources.filter(r=>{const first=(r.title||'').trim().charAt(0).toUpperCase();return (!selectedLetter||q||first===selectedLetter)&&(!q||searchText(r).includes(q))});status.textContent=`${filtered.length} ressource${filtered.length===1?'':'s'}${q?' trouvée'+(filtered.length===1?'':'s')+(search.value.trim()?' pour « '+search.value.trim()+' »':''):''}`;grid.innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">Aucune ressource ne correspond à cette recherche.</div>';grid.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);const old=b.textContent;b.textContent='Lien copié ✓';setTimeout(()=>b.textContent=old,1600)}catch{prompt('Copie ce lien :',b.dataset.copy)}}));nav.querySelectorAll('[data-letter]').forEach(a=>a.classList.toggle('active',a.dataset.letter===selectedLetter))}
search.addEventListener('input',()=>render());
fetch('./ressources.json').then(r=>{if(!r.ok)throw new Error('Catalogue absent');return r.json()}).then(data=>{resources=data.sort((a,b)=>a.title.localeCompare(b.title,'fr'));buildAlphabet();render()}).catch(()=>{grid.innerHTML='<div class="empty">Le catalogue des ressources n’a pas pu être chargé.</div>'});
</script>

</body>
</html>
