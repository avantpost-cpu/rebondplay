<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Expos — RebondPlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#073e55;--purple:#e4ae0b;--orange:#f47c4b;--shadow:0 8px 12px rgba(0,0,0,.32)}
    *{box-sizing:border-box}html{min-width:300px}body{margin:0;min-height:100vh;color:var(--ink);background-color:#e4ae0b;background-image:url("motifsjaune.jpg"),url("fondfulljaune.png");background-position:center top,center top;background-size:auto,cover;background-repeat:repeat,no-repeat;background-attachment:fixed;font-family:"Nunito",Arial,sans-serif}img{display:block;max-width:100%}a{color:inherit}.topbar{min-height:clamp(92px,8.2vw,158px);display:grid;grid-template-columns:1fr auto;align-items:center;gap:30px;padding:16px 3.4% 10px;background:rgba(228,174,11,.78)}.brand{width:clamp(205px,15.6vw,310px);justify-self:start}.brand img{width:100%}.page-title{display:flex;align-items:center;justify-content:flex-start;font-size:clamp(30px,4vw,72px);font-weight:900;letter-spacing:.02em}.account{display:flex;align-items:center;justify-content:flex-end;gap:clamp(9px,1vw,20px);min-width:0;color:#082f4a}.avatar{width:clamp(43px,3.25vw,65px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;background:#082f4a;color:var(--purple)}.avatar svg{width:62%;height:62%;fill:currentColor}.account-copy{min-width:0}.account-name{font-size:clamp(13px,1vw,20px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-meta{margin-top:3px;font-size:clamp(9px,.75vw,15px);font-weight:700;white-space:nowrap}.logout{min-height:46px;padding:0 clamp(10px,1.3vw,25px);border:0;border-left:1px solid rgba(8,47,74,.28);background:transparent;color:inherit;font-weight:900;cursor:pointer;white-space:nowrap}.logout:hover{color:#fff}main{width:min(78vw,1200px);margin:0 auto;padding:clamp(38px,6vw,110px) 0 100px}.intro{max-width:820px;margin:0 auto clamp(35px,5vw,70px);text-align:center;font-family:"Patrick Hand",cursive;font-size:clamp(20px,1.8vw,31px);line-height:1.1}.cards{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:clamp(24px,4vw,82px)}.card{position:relative;overflow:hidden;border-radius:clamp(18px,1.5vw,30px);background:#f7f4ef;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-7px);box-shadow:0 22px 38px rgba(31,33,40,.35)}.card video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}.card-copy{padding:clamp(17px,2vw,30px);background:rgba(255,255,255,.78)}.card h2{margin:0 0 8px;font-size:clamp(20px,1.8vw,31px)}.card p{margin:0;font-family:"Patrick Hand",cursive;font-size:clamp(17px,1.35vw,23px);line-height:1.08}.back{position:fixed;z-index:10;left:clamp(14px,2vw,38px);bottom:clamp(14px,2vw,38px);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;text-decoration:none;font-size:14px;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.18)}
    @media(max-width:800px){.topbar{grid-template-columns:1fr auto;gap:14px;padding:16px 20px}.page-title{grid-column:1/-1;grid-row:2;order:3}.account{grid-column:2;grid-row:1}.brand{width:190px}.account-meta{white-space:normal}.logout{font-size:12px;padding-inline:10px}main{width:min(88vw,560px);padding-top:35px}.cards{grid-template-columns:1fr;gap:28px}}@media(max-width:500px){.topbar{display:flex;align-items:flex-start;flex-wrap:wrap}.brand{width:180px}.account{width:100%;justify-content:flex-start;order:3}.page-title{width:100%;order:2;font-size:34px}.account-name{font-size:14px}.account-meta{font-size:10px}}
    main{width:min(90vw,1540px)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,30px);margin:0 auto clamp(30px,4vw,60px)}.tab{min-height:clamp(82px,8vw,145px);padding:18px;border:0;border-radius:clamp(18px,1.5vw,30px);background:#f7f4ef;color:var(--ink);font:inherit;font-size:clamp(16px,1.5vw,27px);font-weight:900;line-height:1.05;box-shadow:var(--shadow);cursor:pointer}.tab.is-active{background:var(--orange);color:white}.panel{display:none}.panel.is-active{display:block}.empty-panel{padding:40px;border-radius:24px;background:rgba(255,255,255,.75);text-align:center;font-family:"Patrick Hand",cursive;font-size:24px}.empty-panel h2{font-family:"Nunito",Arial,sans-serif}
    .page-title img{width:clamp(250px,25vw,500px);height:auto}.expo-tabs{display:grid;grid-template-columns:repeat(3,1fr);align-items:start;gap:clamp(24px,3vw,58px)}.expo-tab{display:block;width:100%;padding:0;border:0;border-radius:clamp(18px,1.5vw,30px);overflow:hidden;background:transparent;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s,box-shadow .25s}.expo-tab:hover{transform:translateY(-7px);box-shadow:0 22px 38px rgba(31,33,40,.35)}.expo-tab img{display:block;width:100%;height:auto;margin:0;border-radius:inherit}
    .expo-tab{cursor:pointer}.epreuves-modal-panel{width:min(100%,1200px);max-height:92vh}.epreuves-art{position:relative;width:100%;line-height:0}.epreuves-art>img{display:block;width:100%;height:auto}.epreuves-video{position:absolute;left:44%;top:12%;width:52%;height:auto;aspect-ratio:16/9;transform:none;object-fit:contain;background:transparent;border:0}.expo-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:clamp(16px,4vw,60px);background:rgba(5,28,39,.72);backdrop-filter:blur(5px)}.expo-modal.is-open{display:flex}.expo-modal-panel{position:relative;width:min(100%,1100px);max-height:92vh;overflow:visible;border-radius:0;background:transparent;box-shadow:none}.expo-modal-close{position:absolute;z-index:2;top:18px;right:18px;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:28px;line-height:1;cursor:pointer}.expo-modal-body{display:block;padding:0}.expo-modal-body img{display:block;width:100%;max-height:92vh;object-fit:contain;border-radius:0}@media(max-width:700px){.expo-modal-close{top:10px;right:10px;width:36px;height:36px;font-size:24px}}
    @media(max-width:800px){.tabs{grid-template-columns:1fr}.expo-tabs{grid-template-columns:1fr;gap:24px}.page-title img{width:250px}}
  </style>
</head>
<body>
  <header class="topbar">
    
    <div class="page-title"><img src="titreexpo.png" alt="Expositions"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span><div class="account-copy"><div class="account-name" id="accountName">Bonjour</div><div class="account-meta" id="accountMeta"></div></div><button class="logout" id="logoutButton" type="button">Se déconnecter</button></div>
  </header>
  <main>
    <nav class="expo-tabs" aria-label="Choisir une exposition"><a class="expo-tab" href="#sport" aria-label="Expo Pour un sport sûr"><img src="bouton1.png" alt="Expo Pour un sport sûr"></a><a class="expo-tab" href="#pedagogique" aria-label="Expo pédagogique"><img src="bouton2.png" alt="Expo pédagogique"></a><a class="expo-tab" href="#preuves" aria-label="Expo (é)preuves"><img src="bouton3.png" alt="Expo (é)preuves"></a></nav>
  </main>
  <div class="expo-modal" id="sportModal" role="dialog" aria-modal="true" aria-labelledby="sportModalTitle">
    <div class="expo-modal-panel">
      <button class="expo-modal-close" id="sportModalClose" type="button" aria-label="Fermer">×</button>
      <div class="expo-modal-body">
        <img src="popupsportsur.jpg" alt="Exposition Pour un sport sûr">
        
      </div>
    </div>
  </div>
  <div class="expo-modal" id="pedagogiqueModal" role="dialog" aria-modal="true" aria-label="Exposition pédagogique">
    <div class="expo-modal-panel">
      <button class="expo-modal-close" id="pedagogiqueModalClose" type="button" aria-label="Fermer">×</button>
      <div class="expo-modal-body"><img src="popupexpopeda.jpg" alt="Exposition pédagogique Rebond"></div>
    </div>
  </div>
  <div class="expo-modal" id="epreuvesModal" role="dialog" aria-modal="true" aria-label="Exposition (é)preuves">
    <div class="expo-modal-panel epreuves-modal-panel">
      <button class="expo-modal-close" id="epreuvesModalClose" type="button" aria-label="Fermer">×</button>
      <div class="epreuves-art"><img src="popupexpoepreuves.jpg" alt="Exposition (é)preuves"><video class="epreuves-video" controls autoplay muted playsinline preload="auto"><source src="../pagevideo/Film_Expo-e-preuves_bdf2.mp4" type="video/mp4"></video></div>
    </div>
  </div>
  <a class="back" href="../pagefull/index.html">← Accueil</a>
  <script>
    (()=>{const keys=["rebondplay_access_ok","rebondplay_nom_structure","rebondplay_date_fin","rebondplay_prenom_contact","rebondplay_nom_contact"],get=k=>sessionStorage.getItem(k)||"";if(get("rebondplay_access_ok")!=="1"){location.replace("../index.html");return}const name=[get("rebondplay_prenom_contact"),get("rebondplay_nom_contact")].filter(Boolean).join(" ")||get("rebondplay_nom_structure");document.getElementById("accountName").textContent=`Bonjour ${name}`.trim();const end=get("rebondplay_date_fin");if(end){const days=Math.max(0,Math.ceil((new Date(`${end}T23:59:59`)-Date.now())/86400000));document.getElementById("accountMeta").textContent=`Votre abonnement est encore valable ${days} jour${days>1?"s":""}`}document.getElementById("logoutButton").onclick=()=>{keys.forEach(k=>sessionStorage.removeItem(k));location.replace("../index.html")};document.querySelectorAll(".expo-tab").forEach(tab=>tab.addEventListener("click",()=>{document.querySelectorAll(".expo-tab").forEach(item=>item.classList.toggle("is-active",item===tab));document.querySelectorAll(".panel").forEach(panel=>panel.classList.toggle("is-active",panel.id===`panel-${tab.dataset.panel}`))}))})();
    const sportTab=document.querySelector('.expo-tab[href="#sport"]'),sportModal=document.getElementById('sportModal'),sportClose=document.getElementById('sportModalClose');function closeSportModal(){sportModal.classList.remove('is-open');document.body.style.overflow=''}sportTab.addEventListener('click',event=>{event.preventDefault();sportModal.classList.add('is-open');document.body.style.overflow='hidden';sportClose.focus()});sportClose.addEventListener('click',closeSportModal);sportModal.addEventListener('click',event=>{if(event.target===sportModal)closeSportModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sportModal.classList.contains('is-open'))closeSportModal()});
    const pedagogiqueTab=document.querySelector('.expo-tab[href="#pedagogique"]'),pedagogiqueModal=document.getElementById('pedagogiqueModal'),pedagogiqueClose=document.getElementById('pedagogiqueModalClose');function closePedagogiqueModal(){pedagogiqueModal.classList.remove('is-open');document.body.style.overflow=''}pedagogiqueTab.addEventListener('click',event=>{event.preventDefault();pedagogiqueModal.classList.add('is-open');document.body.style.overflow='hidden';pedagogiqueClose.focus()});pedagogiqueClose.addEventListener('click',closePedagogiqueModal);pedagogiqueModal.addEventListener('click',event=>{if(event.target===pedagogiqueModal)closePedagogiqueModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&pedagogiqueModal.classList.contains('is-open'))closePedagogiqueModal()});
    const epreuvesTab=document.querySelector('.expo-tab[href="#preuves"]'),epreuvesModal=document.getElementById('epreuvesModal'),epreuvesClose=document.getElementById('epreuvesModalClose'),epreuvesVideo=document.querySelector('.epreuves-video');function closeEpreuvesModal(){epreuvesModal.classList.remove('is-open');epreuvesVideo.pause();document.body.style.overflow=''}epreuvesTab.addEventListener('click',event=>{event.preventDefault();epreuvesModal.classList.add('is-open');document.body.style.overflow='hidden';epreuvesVideo.currentTime=0;epreuvesVideo.play().catch(()=>{});epreuvesClose.focus()});epreuvesClose.addEventListener('click',closeEpreuvesModal);epreuvesModal.addEventListener('click',event=>{if(event.target===epreuvesModal)closeEpreuvesModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&epreuvesModal.classList.contains('is-open'))closeEpreuvesModal()});  </script>
</body>
</html>
