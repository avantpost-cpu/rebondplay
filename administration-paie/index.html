<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebond — Éléments variables de paie</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#e9e3d9;color:#075267;font-family:Nunito,Arial,sans-serif}header{background:#075267;color:white;text-align:center;padding:26px 15px}header img{max-width:210px;max-height:80px;object-fit:contain}header h1{font-size:clamp(25px,4vw,36px);margin:12px 0 2px}header p{margin:0}main{max-width:800px;margin:26px auto;padding:28px;background:#fffaf4;border-radius:22px;box-shadow:0 8px 25px #1545531a}h2{margin-top:0}label{display:block;font-weight:800;margin:14px 0 6px}input,textarea{width:100%;border:1px solid #b5c9c7;border-radius:10px;padding:12px;font:inherit;background:white;color:#173b46}input[type=number]{max-width:130px}.item{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:9px 12px;border-bottom:1px solid #ddd}.item:nth-child(even){background:#f0f5f3}.item label{margin:0}button{border:0;background:#ec7045;color:white;border-radius:12px;padding:13px 22px;font:900 16px Nunito;cursor:pointer;margin-top:18px}button:disabled{opacity:.55;cursor:not-allowed}.note{padding:13px;background:#fbe9db;border-left:5px solid #ed754b;border-radius:8px;margin:18px 0}.hidden{display:none}#message{font-weight:800;min-height:22px;margin-top:16px}@media(max-width:650px){main{margin:12px;padding:18px}.item{gap:8px}.item input{width:100px}}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/rebond-admin-common.css"><style id="paie-design-2026">
:root{--ink:#065269;--orange:#e65013;--paper:#f7f2e9;--muted:#58717a}
html body{font-family:Poppins,Arial,sans-serif;background:#e8e3dc url("https://tdsrqmpfdvntybdlvejy.supabase.co/functions/v1/rebond-admin-background") repeat left top/830px auto fixed;color:var(--ink);min-height:100vh}
header{display:grid;grid-template-columns:minmax(100px,1fr) minmax(0,2fr) minmax(100px,1fr);align-items:center;gap:18px;text-align:left;min-height:132px;padding:22px clamp(18px,4vw,58px);background-color:#065269;background-image:linear-gradient(110deg,rgba(0,0,0,.13),rgba(0,0,0,.02)),url('/ressources/fond.jpg');background-blend-mode:normal,soft-light;box-shadow:0 9px 27px #073c4b36}
header img{max-width:185px;max-height:80px;filter:brightness(0) invert(1);margin:0}
header .paie-head-text{text-align:center;grid-column:2}header h1{font-size:clamp(23px,2.6vw,36px);line-height:1.2;font-weight:800;margin:0 0 8px;color:#fff}header p{font-size:14px;font-weight:500;color:#fff;opacity:.93}
header .paie-head-link{grid-column:3;justify-self:end;text-decoration:none;color:#fff;border:1px solid #ffffff85;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700}
main{max-width:950px;margin:34px auto 60px;background:var(--paper);padding:clamp(22px,4vw,44px);border-radius:24px;box-shadow:0 18px 46px #143f4b24}
h2{font-size:clamp(21px,2.4vw,27px);font-weight:800;color:var(--ink);margin:0 0 14px}p{line-height:1.6}
label{font-weight:700;font-size:14px;color:var(--ink)}
input,textarea{font-family:Poppins,Arial,sans-serif;border:1px solid #b9cbc8;border-radius:12px;padding:13px;background:#fffdf9;color:var(--ink);outline-offset:3px}
input:focus,textarea:focus{border-color:#e65013;outline:2px solid #e6501330}
button{font-family:Poppins,Arial,sans-serif;font-size:14px;font-weight:700;border-radius:12px;background:#e65013;color:white;padding:13px 19px;box-shadow:0 4px 12px #b64a1820;transition:transform .15s,filter .15s}button:hover:not(:disabled){filter:brightness(.94);transform:translateY(-1px)}
#logout{background:var(--ink);margin-left:10px}
.note{background:#fff1e6;border-left:5px solid var(--orange);color:#82400f;padding:16px 19px;border-radius:12px;font-size:14px;font-weight:500}
.item{background:#fffdf9!important;border:1px solid #e6e6dd!important;border-radius:13px;margin:8px 0;padding:13px 16px!important;gap:14px}
.item label{font-size:14px}.item input{width:110px;text-align:center;font-weight:700}
#employee{display:inline-block;background:#e7eeed;border-radius:10px;padding:10px 15px;font-weight:600;font-size:14px}
#message,#msg,#prepResult{color:var(--ink);font-size:14px;font-weight:700}
#login,#panel,#app{min-width:0}.line{background:#fffdf9;border:1px solid #e7e5dd;border-radius:12px;margin:8px 0;padding:13px 17px}.line strong{font-size:13px}.status{color:#28725d}
#testSend{background:var(--ink)}
@media(max-width:700px){header{grid-template-columns:1fr auto;padding:18px;gap:10px}header img{max-width:125px;max-height:60px}header .paie-head-text{grid-column:1/-1;grid-row:2}header .paie-head-link{grid-column:2;grid-row:1;padding:9px;font-size:11px}main{margin:15px 10px 40px;padding:21px 17px}.item{flex-wrap:wrap}#logout{margin-left:0}}
</style></head><body><header><img src="/logorebondsignature.png" alt="Association Rebond"><div class="paie-head-text"><h1>Éléments variables de paie</h1><p>Déclaration mensuelle de l’équipe Rebond</p></div><a class="paie-head-link" href="/administration-acces/">Administration</a></header><main><div class="note">Date limite de transmission : <strong>le 24 de chaque mois</strong>.</div><section id="login"><h2>Connexion sécurisée</h2><form id="emailForm"><label for="email">Adresse e-mail professionnelle</label><input id="email" type="email" required autocomplete="email"><button>Recevoir mon code</button></form><form id="otpForm" class="hidden"><label for="otp">Code reçu par e-mail</label><input id="otp" inputmode="numeric" pattern="[0-9]{6,8}" required><button>Me connecter</button></form></section><section id="app" class="hidden"><h2>Ma déclaration</h2><p id="employee"></p><label for="month">Mois concerné</label><input id="month" type="month" required><form id="declaration"><div id="fields"></div><label for="observations">Observations et précisions (sans diagnostic médical)</label><textarea id="observations" rows="3" maxlength="2000"></textarea><button id="save" type="submit">Enregistrer mon brouillon</button></form><p>La transmission définitive sera activée après validation du circuit d'envoi sécurisé.</p><button id="testSend" class="hidden" type="button">Tester l’envoi sur ma messagerie</button><button id="logout" type="button">Me déconnecter</button></section><p id="message" role="status" aria-live="polite"></p></main><script>
const sb=window.supabase.createClient('https://tdsrqmpfdvntybdlvejy.supabase.co','sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO',{auth:{storageKey:'rebond-paie-auth-v1',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const names=[['jours_travailles','Jours travaillés'],['conges_payes','Congés payés pris'],['rtt','RTT pris'],['arret_maladie','Arrêt maladie'],['enfant_malade','Enfant malade'],['conges_exceptionnels','Congés exceptionnels'],['autres_absences_justifiees','Autres absences justifiées'],['autres','Autres']];let person=null;const $=id=>document.getElementById(id);const msg=t=>$('message').textContent=t;
$('fields').innerHTML=names.map(([key,label])=>'<div class="item"><label for="'+key+'">'+label+'</label><input id="'+key+'" type="number" min="0" max="31" step="0.5" value="0" required></div>').join('');
$('month').value=new Date().toISOString().slice(0,7);
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const {data,error}=await sb.from('paie_salaries').select('id,nom,email').eq('auth_user_id',user.id).eq('actif',true).maybeSingle();if(error||!data){msg('Compte connecté, mais accès paie non attribué. Contactez l’administration Rebond.');return}person=data;$('testSend').classList.toggle('hidden',data.email!=='c.sethi@assorebond.com');$('employee').textContent=data.nom+' — '+data.email;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}
async function load(){if(!person)return;const month=$('month').value+'-01';const {data,error}=await sb.from('paie_declarations').select('*').eq('salarie_id',person.id).eq('mois',month).maybeSingle();if(error){msg('Impossible de lire la déclaration.');return}for(const [k] of names)$(k).value=data?.[k]??0;$('observations').value=data?.observations??'';$('save').disabled=!!data&&data.statut!=='brouillon';msg(data?.statut==='soumis'?'Déclaration déjà transmise.':data?.statut==='valide'?'Déclaration validée.':'Brouillon prêt à être complété.')}
$('month').addEventListener('change',load);
$('emailForm').addEventListener('submit',async e=>{e.preventDefault();msg('Envoi du code…');const {error}=await sb.auth.signInWithOtp({email:$('email').value.trim(),options:{shouldCreateUser:false}});if(error){msg('Envoi impossible : '+error.message);return}$('otpForm').classList.remove('hidden');msg('Consultez votre messagerie.')});
$('otpForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.auth.verifyOtp({email:$('email').value.trim(),token:$('otp').value.trim(),type:'email'});if(error){msg('Code invalide ou expiré.');return}msg('');await boot()});
$('declaration').addEventListener('submit',async e=>{e.preventDefault();if(!person)return;const record={salarie_id:person.id,mois:$('month').value+'-01',observations:$('observations').value};for(const [k] of names)record[k]=Number($(k).value);const {data:existing,error:readError}=await sb.from('paie_declarations').select('id,statut').eq('salarie_id',person.id).eq('mois',record.mois).maybeSingle();if(readError){msg('Lecture impossible.');return}if(existing&&existing.statut!=='brouillon'){msg('Cette déclaration est verrouillée.');return}const q=existing?sb.from('paie_declarations').update(record).eq('id',existing.id):sb.from('paie_declarations').insert(record);const {error}=await q;if(error){msg('Enregistrement impossible : '+error.message);return}msg('Brouillon enregistré en toute sécurité.')});
$('testSend').onclick=async()=>{if(!person||person.email!=='c.sethi@assorebond.com')return;if(!confirm('Envoyer un e-mail de TEST à c.sethi@assorebond.com avec les éléments du brouillon enregistré ?'))return;const b=$('testSend');b.disabled=true;msg('Test en cours…');try{const {data,error}=await sb.functions.invoke('paie-tester-envoi',{body:{mode:'test',mois:$('month').value+'-01'}});msg(error?'Échec du test : '+(data?.error||error.message):data?.ok?'E-mail de test accepté par le service d’envoi. Vérifie ta boîte de réception.':data?.error||'Envoi non confirmé.')}finally{b.disabled=false}};
$('logout').onclick=async()=>{await sb.auth.signOut();person=null;location.reload()};boot();
</script></body></html>
