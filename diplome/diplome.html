<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diplôme Rebond</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  padding:26px 14px 40px;
  background:#1b5f6e;
  font-family:Arial, Helvetica, sans-serif;
}

/* ======================================================
   PAGE
====================================================== */

.page-diplome{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ======================================================
   DIPLÔME
   Réduction de 25 % à l’écran
====================================================== */

.diplome{
  position:relative;
  width:75vw;
  max-width:960px;
  min-width:720px;
  margin:0 auto;
}

.fond-diplome{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  pointer-events:none;
}

/* ======================================================
   TEXTES PERSONNALISÉS
====================================================== */

.texte-variable,
.date{
  position:absolute;
  transform:translate(-50%,-50%);
  margin:0;
  padding:0;
  color:#044e61;
  font-family:"Sacramento", cursive;
  font-weight:400;
  line-height:1;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  pointer-events:none;
}

/*
  Les coordonnées ci-dessous utilisent le CENTRE
  de chaque ligne du diplôme.
*/

.nom-equipe{
  left:74.5%;
  top:44.0%;
  width:30%;
  font-size:clamp(38px,4vw,62px);
}

.classe{
  left:74.5%;
  top:52.5%;
  width:30%;
  font-size:clamp(27px,3vw,44px);
}

.ecole{
  left:74.5%;
  top:61.0%;
  width:30%;
  font-size:clamp(25px,2.8vw,41px);
}

.date{
  left:53.0%;
  top:82.6%;
  width:22%;
  font-size:clamp(17px,1.8vw,27px);
}

/* ======================================================
   BOUTONS SOUS LE DIPLÔME
====================================================== */

.actions{
  width:75vw;
  max-width:960px;
  min-width:720px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
  margin:22px auto 0;
}

.actions button,
.actions a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:13px 28px;
  border:0;
  border-radius:999px;
  outline:0;
  box-shadow:none;
  font-family:Arial, Helvetica, sans-serif;
  font-size:16px;
  font-weight:800;
  line-height:1;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
}

#boutonImprimer{
  background:#edb01a;
  color:#044e61;
}

#boutonAccueil{
  background:#ffffff;
  color:#044e61;
}

.actions button:hover,
.actions button:focus,
.actions a:hover,
.actions a:focus{
  filter:brightness(.97);
}

.message{
  width:75vw;
  max-width:960px;
  min-width:720px;
  min-height:18px;
  margin:10px auto 0;
  color:#ffffff;
  font-size:13px;
  font-weight:bold;
  text-align:center;
}

/* ======================================================
   ÉCRANS PLUS PETITS
====================================================== */

@media screen and (max-width:760px){

  body{
    min-width:760px;
    padding:18px 0 30px;
    overflow-x:auto;
  }

  .diplome,
  .actions,
  .message{
    width:720px;
    min-width:720px;
    max-width:720px;
  }

}

/* ======================================================
   IMPRESSION
====================================================== */

@page{
  size:A4 landscape;
  margin:0;
}

@media print{

  html,
  body{
    margin:0;
    padding:0;
    background:#ffffff;
  }

  body{
    min-height:auto;
  }

  .page-diplome{
    display:block;
  }

  .diplome{
    width:100%;
    max-width:none;
    min-width:0;
    margin:0;
  }

  .actions,
  .message{
    display:none !important;
  }

  .nom-equipe{
    font-size:62px;
  }

  .classe{
    font-size:44px;
  }

  .ecole{
    font-size:41px;
  }

  .date{
    font-size:27px;
  }

}
</style>
</head>

<body>

<main class="page-diplome">

  <section
    id="diplome"
    class="diplome"
    aria-label="Diplôme personnalisé Rebond">

    <img
      class="fond-diplome"
      src="diplome.jpg"
      alt="Fond du diplôme Rebond">

    <div
      id="nomEquipe"
      class="texte-variable nom-equipe">
      Nom de l’équipe
    </div>

    <div
      id="classe"
      class="texte-variable classe">
      Classe
    </div>

    <div
      id="ecole"
      class="texte-variable ecole">
      École ou structure
    </div>

    <div
      id="date"
      class="date">
    </div>

  </section>

  <div class="actions">

    <button
      id="boutonImprimer"
      type="button">
      Télécharger / imprimer le diplôme
    </button>

    <a
      id="boutonAccueil"
      href="../index.html">
      Retour au menu principal
    </a>

  </div>

  <div
    id="message"
    class="message"
    aria-live="polite">
  </div>

</main>

<script>
(function(){

  const nomEquipe =
    document.getElementById("nomEquipe");

  const classe =
    document.getElementById("classe");

  const ecole =
    document.getElementById("ecole");

  const date =
    document.getElementById("date");

  const boutonImprimer =
    document.getElementById("boutonImprimer");

  const message =
    document.getElementById("message");

  function lireEquipeCourante(){

    const donnees =
      localStorage.getItem(
        "rebondCurrentTeam"
      );

    if(!donnees){
      return null;
    }

    try{
      return JSON.parse(donnees);
    }
    catch(error){

      console.error(
        "Impossible de lire les informations de l’équipe.",
        error
      );

      return null;
    }

  }

  function mettreEnCassePhrase(valeur){

    const texte =
      String(valeur || "")
        .trim()
        .toLocaleLowerCase("fr-FR");

    if(!texte){
      return "";
    }

    return (
      texte.charAt(0)
        .toLocaleUpperCase("fr-FR") +
      texte.slice(1)
    );

  }

  function afficherDate(dateBrute){

    if(!dateBrute){
      return "";
    }

    const objetDate =
      new Date(
        dateBrute + "T12:00:00"
      );

    if(
      Number.isNaN(
        objetDate.getTime()
      )
    ){
      return dateBrute;
    }

    return objetDate.toLocaleDateString(
      "fr-FR",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  }

  function remplirDiplome(){

    const equipe =
      lireEquipeCourante();

    if(!equipe){

      message.textContent =
        "Les informations de l’équipe n’ont pas été trouvées sur cet appareil.";

      return;
    }

    const nomBrut =
      equipe.nomEquipe ||
      equipe.teamName ||
      equipe.equipe ||
      "Équipe Rebond";

    nomEquipe.textContent =
      mettreEnCassePhrase(
        nomBrut
      );

    classe.textContent =
      equipe.classe ||
      equipe.className ||
      "";

    ecole.textContent =
      equipe.ecole ||
      equipe.schoolName ||
      "";

    date.textContent =
      afficherDate(
        equipe.date ||
        equipe.sessionDate ||
        ""
      );

    document.title =
      "Diplôme Rebond — " +
      mettreEnCassePhrase(
        nomBrut
      );

  }

  boutonImprimer.addEventListener(
    "click",
    function(){
      window.print();
    }
  );

  remplirDiplome();

})();
</script>

</body>
</html>
