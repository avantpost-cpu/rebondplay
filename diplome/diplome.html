<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diplôme Rebond</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  padding:30px 16px 42px;
  background:#1b5f6e;
  font-family:Arial, Helvetica, sans-serif;
  color:#044e61;
}

/*
  À l'écran, le diplôme occupe 75 % de la largeur disponible.
  Le conteneur et tous les textes diminuent ensemble.
*/
.diplome{
  position:relative;
  width:75%;
  max-width:900px;
  margin:0 auto;
  line-height:1;
}

.fond-diplome{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  pointer-events:none;
}

.texte-variable,
.date{
  position:absolute;
  left:50%;
  width:78%;
  transform:translateX(-50%);
  color:#044e61;
  text-align:center;
  font-weight:800;
  line-height:1.1;
  overflow-wrap:anywhere;
}

/*
  Ces positions sont exprimées en pourcentage du diplôme.
  Elles restent donc alignées lorsque le diplôme est réduit.
*/
.nom-equipe{
  top:43.6%;
  font-size:clamp(18px,3.2vw,44px);
}

.classe{
  top:54.4%;
  font-size:clamp(13px,2vw,28px);
}

.ecole{
  top:60.2%;
  font-size:clamp(13px,2vw,28px);
}

.date{
  top:79.8%;
  font-size:clamp(11px,1.55vw,21px);
  font-weight:700;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  width:75%;
  max-width:900px;
  margin:22px auto 0;
}

.actions button,
.actions a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:12px 25px;
  border:0;
  border-radius:999px;
  outline:none;
  box-shadow:none;
  font-size:15px;
  font-weight:800;
  text-decoration:none;
  cursor:pointer;
}

#boutonImprimer{
  background:#edb01a;
  color:#044e61;
}

#boutonAccueil{
  background:#ffffff;
  color:#044e61;
}

.actions button:hover,
.actions button:focus,
.actions a:hover,
.actions a:focus{
  filter:brightness(.97);
}

.message{
  width:75%;
  max-width:900px;
  min-height:20px;
  margin:12px auto 0;
  color:#ffffff;
  font-size:13px;
  font-weight:bold;
  text-align:center;
}

@media screen and (max-width:760px){
  body{
    padding:18px 8px 30px;
  }

  .diplome,
  .actions,
  .message{
    width:94%;
  }

  .actions{
    flex-direction:column;
  }

  .actions button,
  .actions a{
    width:100%;
  }
}

/*
  À l'impression, le diplôme retrouve sa taille maximale.
  Les boutons et le fond de page disparaissent.
*/
@page{
  size:auto;
  margin:0;
}

@media print{
  html,
  body{
    margin:0;
    padding:0;
    background:#ffffff;
  }

  body{
    min-height:auto;
  }

  .diplome{
    width:100%;
    max-width:none;
    margin:0;
  }

  .actions,
  .message{
    display:none !important;
  }

  .fond-diplome{
    width:100%;
  }

  .nom-equipe{
    font-size:36px;
  }

  .classe,
  .ecole{
    font-size:23px;
  }

  .date{
    font-size:18px;
  }
}
</style>
</head>

<body>

<main>

  <section
    id="diplome"
    class="diplome"
    aria-label="Diplôme personnalisé Rebond">

    <img
      class="fond-diplome"
      src="diplome.jpg"
      alt="Fond du diplôme Rebond">

    <div
      id="nomEquipe"
      class="texte-variable nom-equipe">
      NOM DE L’ÉQUIPE
    </div>

    <div
      id="classe"
      class="texte-variable classe">
      CLASSE
    </div>

    <div
      id="ecole"
      class="texte-variable ecole">
      ÉCOLE OU STRUCTURE
    </div>

    <div
      id="date"
      class="date">
    </div>

  </section>

  <div class="actions">

    <button
      id="boutonImprimer"
      type="button">
      Télécharger / imprimer le diplôme
    </button>

    <a
      id="boutonAccueil"
      href="../index.html">
      Retour au menu principal
    </a>

  </div>

  <div
    id="message"
    class="message"
    aria-live="polite">
  </div>

</main>

<script>
(function(){

  const nomEquipe =
    document.getElementById("nomEquipe");

  const classe =
    document.getElementById("classe");

  const ecole =
    document.getElementById("ecole");

  const date =
    document.getElementById("date");

  const boutonImprimer =
    document.getElementById("boutonImprimer");

  const message =
    document.getElementById("message");

  function lireEquipeCourante(){

    const donnees =
      localStorage.getItem(
        "rebondCurrentTeam"
      );

    if(!donnees){
      return null;
    }

    try{
      return JSON.parse(donnees);
    }
    catch(error){
      console.error(
        "Impossible de lire les informations de l’équipe.",
        error
      );

      return null;
    }

  }

  function afficherDate(dateBrute){

    if(!dateBrute){
      return "";
    }

    const objetDate =
      new Date(
        dateBrute + "T12:00:00"
      );

    if(
      Number.isNaN(
        objetDate.getTime()
      )
    ){
      return dateBrute;
    }

    return objetDate.toLocaleDateString(
      "fr-FR",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  }

  function remplirDiplome(){

    const equipe =
      lireEquipeCourante();

    if(!equipe){

      message.textContent =
        "Les informations de l’équipe n’ont pas été trouvées sur cet appareil.";

      return;
    }

    nomEquipe.textContent =
      equipe.nomEquipe ||
      "ÉQUIPE REBOND";

    classe.textContent =
      equipe.classe ||
      "";

    ecole.textContent =
      equipe.ecole ||
      "";

    date.textContent =
      afficherDate(
        equipe.date
      );

    document.title =
      "Diplôme Rebond — " +
      (
        equipe.nomEquipe ||
        "Équipe"
      );

  }

  boutonImprimer.addEventListener(
    "click",
    function(){

      /*
        Le navigateur permet ensuite d’imprimer
        ou d’enregistrer le diplôme au format PDF.
      */
      window.print();

    }
  );

  remplirDiplome();

})();
</script>

</body>
</html>
