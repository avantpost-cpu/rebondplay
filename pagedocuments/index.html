ta-key="G" src="https://avantpost-cpu.github.io/depot-quiz/autobio/G.jpg" alt="Livre autobiographique"><img class="book doc-book" tabindex="0" data-group="autobio" data-key="H" src="https://avantpost-cpu.github.io/depot-quiz/autobio/H.jpg" alt="Livre autobiographique"></div><p class="shelf-category">AUTOBIOGRAPHIES / TÉMOIGNAGES</p><div class="shelf-row"><img class="shelf-trait" src="trait.png" alt="" aria-hidden="true"><img class="book doc-book" tabindex="0" data-group="essai" data-key="I" src="https://avantpost-cpu.github.io/depot-quiz/essai/I.jpg" alt="Essai documentaire"><img class="book doc-book" tabindex="0" data-group="essai" data-key="J" src="https://avantpost-cpu.github.io/depot-quiz/essai/J.jpg" alt="Essai documentaire"><img class="book doc-book" tabindex="0" data-group="essai" data-key="K" src="https://avantpost-cpu.github.io/depot-quiz/essai/K.jpg" alt="Essai documentaire"></div><p class="shelf-category">ESSAIS</p></div><aside class="info" id="docInfo" aria-live="polite"><p class="info-placeholder">Cliquez sur une couverture pour découvrir le livre.</p></aside></div></section><section class="document-panel" aria-label="Films"><div class="youth-layout"><div class="youth-shelves"><div class="shelf-row film-shelf"><img class="shelf-trait" src="trait.png" alt="" aria-hidden="true"><img class="book film-poster" tabindex="0" role="button" data-film="A" src="https://avantpost-cpu.github.io/depot-quiz/films/1.jpg" alt="Affiche du film 1"><img class="book film-poster" tabindex="0" role="button" data-film="B" src="https://avantpost-cpu.github.io/depot-quiz/films/2.jpg" alt="Affiche du film 2"><img class="book film-poster" tabindex="0" role="button" data-film="C" src="https://avantpost-cpu.github.io/depot-quiz/films/3.jpg" alt="Affiche du film 3"><img class="book film-poster" tabindex="0" role="button" data-film="D" src="https://avantpost-cpu.github.io/depot-quiz/films/4.jpg" alt="Affiche du film 4"><img class="book film-poster" tabindex="0" role="button" data-film="E" src="https://avantpost-cpu.github.io/depot-quiz/films/5.jpg" alt="Affiche du film 5"><img class="book film-poster" tabindex="0" role="button" data-film="F" src="https://avantpost-cpu.github.io/depot-quiz/films/6.jpg" alt="Affiche du film 6"></div><p class="shelf-category">FICTIONS</p><div class="shelf-row film-shelf"><img class="shelf-trait" src="trait.png" alt="" aria-hidden="true"><img class="book film-poster" tabindex="0" role="button" data-film="G" src="https://avantpost-cpu.github.io/depot-quiz/films/7.jpg" alt="Affiche du film 7"><img class="book film-poster" tabindex="0" role="button" data-film="H" src="https://avantpost-cpu.github.io/depot-quiz/films/8.jpg" alt="Affiche du film 8"><img class="book film-poster" tabindex="0" role="button" data-film="I" src="https://avantpost-cpu.github.io/depot-quiz/films/9.jpg" alt="Affiche du film 9"></div><p class="shelf-category">DOCUMENTAIRES</p></div><aside class="info" id="filmInfo" aria-live="polite"><p class="info-placeholder">Cliquez sur une affiche pour découvrir le film.</p></aside></div></section></div></main><button class="document-nav prev" id="docPrev" type="button" aria-label="Rubrique précédente">‹</button><button class="document-nav next" id="docNext" type="button" aria-label="Rubrique suivante">›</button><nav class="document-indicator" id="docIndicators" aria-label="Rubriques"><button aria-label="Livres jeunesse" class="active"></button><button aria-label="Livres documentaires"></button><button aria-label="Films"></button></nav><a class="back" id="back" href="../pagefull/index.html">← Retour</a>
<script>
const track=document.getElementById('documentTrack');const dots=[...document.querySelectorAll('#docIndicators button')];const prev=document.getElementById('docPrev'),next=document.getElementById('docNext');let sectionIndex=0;function goSection(i){sectionIndex=Math.max(0,Math.min(2,i));track.style.transform='translateX(-'+(sectionIndex*100)+'%)';prev.disabled=sectionIndex===0;next.disabled=sectionIndex===2;dots.forEach((d,n)=>{d.classList.toggle('active',n===sectionIndex);d.setAttribute('aria-current',n===sectionIndex?'true':'false')});document.querySelectorAll('video').forEach(v=>v.pause())}prev.onclick=()=>goSection(sectionIndex-1);next.onclick=()=>goSection(sectionIndex+1);dots.forEach((d,i)=>d.onclick=()=>goSection(i));let touchX=0;track.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});track.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>65)goSection(sectionIndex+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,video,button'))return;if(e.key==='ArrowRight')goSection(sectionIndex+1);if(e.key==='ArrowLeft')goSection(sectionIndex-1)});goSection(0);const documentaryData={"E":{title:"Si un jour quelqu'un te fait du mal<p>(Éditions Stock), de <strong>Angélique Cauchy</strong>, <strong>2024</strong></p>",text:"<p>Si un jour quelqu’un te fait du mal est un témoignage autobiographique retraçant le parcours d’une enfant victime de violences sexuelles et le long chemin vers la parole et la reconstruction.</p>"},"F":{title:"Un si long silence<p>de <strong>Sarah Abitbol</strong> et <strong>Emmanuelle Anizon</strong> (<strong>Plon</strong>, <strong>2020</strong>)</p>",text:"<p>Un si long silence est un témoignage autobiographique évoquant les violences sexuelles dans le sport, les mécanismes d’emprise et la difficulté à briser le silence.</p>"},"G":{title:"Le colosse aux pieds d’argile<p>de <strong>Sébastien Boueilh</strong> et <strong>Thierry Vildary</strong> (<strong>Michel Lafon</strong>, <strong>2020</strong>)</p>",text:"<p>Le colosse aux pieds d’argile est un témoignage autobiographique sur les violences sexuelles subies durant l’adolescence et le chemin vers la reconstruction et l’engagement.</p>"},"H":{title:"Service volé<p>de <strong>Isabelle Demongeot</strong> et <strong>Laurence Décréau</strong> (<strong>Éditions Les Sportives</strong>, <strong>2025</strong>)</p>",text:"<p>Service volé est un témoignage autobiographique dénonçant les violences sexuelles et les abus de pouvoir dans le sport de haut niveau.</p>"},"I":{title:"L’entraîneur et l’enfant<p>(Pierre Emmanuel Luneau-Daurignac, Éditions Seuil, 2021)</p>",text:"<p>Le livre analyse les mécanismes des violences sexuelles dans le milieu sportif à partir d’enquêtes, de témoignages de victimes et de données judiciaires. L’auteur montre comment la relation d’autorité entre l’entraîneur et l’enfant, le silence institutionnel et le culte de la performance favorisent les abus et leur dissimulation.</p><p>Cet ouvrage de référence met en lumière les responsabilités individuelles et collectives, et appelle à une transformation profonde du système sportif pour mieux protéger les mineurs.</p>"},"J":{title:"Le revers de nos médailles<p>(Patrick Roux, Karine Repérant, Dunod, 2023)</p>",text:"<p>Le livre analyse les dérives et les violences systémiques dans le sport de haut niveau, en donnant la parole aux victimes et aux professionnels. Les auteurs mettent en lumière les mécanismes d’emprise, la pression de la performance et le silence des institutions.</p><p>L’ouvrage interroge les responsabilités collectives et appelle à repenser en profondeur le modèle sportif.</p>"},"K":{title:"Violences sexuelles et sport : l’essentiel pour agir<p>(Olivier Coste, Philippe Liotard, Atlande, 2025)</p>",text:"<p>Le livre propose une synthèse claire et opérationnelle des connaissances sur les violences sexuelles dans le sport. Il fournit des repères juridiques et pratiques pour prévenir, repérer et agir.</p>"}};const docInfo=document.getElementById('docInfo');document.querySelectorAll('.doc-book').forEach(b=>{const open=()=>{const d=documentaryData[b.dataset.key];if(!d)return;docInfo.innerHTML='<h2>'+d.title+'</h2>'+d.text;document.querySelectorAll('.doc-book').forEach(x=>x.classList.toggle('selected',x===b))};b.addEventListener('click',open);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});
const filmData = {
  A:{ title:"Julie se tait <p>Leonardo Van Dijl, 2024</p>", text:`<p><strong>Julie se tait</strong> est un film dramatique qui suit Julie, jeune joueuse de tennis prometteuse intégrée dans une académie sportive de haut niveau.</p><p>Lorsque son entraîneur est suspendu à la suite d’événements graves et qu’une enquête est ouverte, les jeunes athlètes sont encouragés à prendre la parole. Pourtant, Julie choisit de garder le silence et de se concentrer sur sa pratique sportive.</p><p>À travers une mise en scène sobre et immersive, le film explore les mécanismes du silence, de l’emprise et de la pression de la performance dans le sport.</p>`},
  B:{ title:"Slalom <p>Charlène Favier, 2020</p>", text:`<p><strong>Slalom</strong> suit Lyz, une adolescente de 15 ans repérée pour intégrer une section ski-études au sein d’un centre d’entraînement de haut niveau.</p><p>Sous l’autorité de son entraîneur, la jeune sportive s’engage dans une relation d’emprise progressive, mêlant pression de la performance, isolement et manipulation psychologique.</p><p>Le film interroge la frontière entre exigence sportive et abus, et la difficulté pour une jeune athlète de se protéger.</p>`},
  C:{ title:"Lilia <p>Charlène Favier</p>", text:`<p><strong>Lilia</strong> est un outil pédagogique composé d’un court-métrage réalisé par <strong>Charlène Favier</strong> et d’un livret de formation conçu par la <strong>Mission interministérielle pour la protection des femmes contre les violences et la lutte contre la traite des êtres humains (Miprof)</strong>.</p><p>Le film met en scène Lilia, une jeune sportive confrontée à une situation de violences sexuelles dans le cadre de sa pratique sportive, et s’attache à montrer les mécanismes d’emprise, de sidération et de silence qui peuvent empêcher une victime de parler.</p><p>Destiné aux encadrants et encadrantes, professionnels et bénévoles du sport et de l’activité physique, ce kit vise à faciliter la compréhension des violences, à repérer les signaux d’alerte et à encourager des réactions adaptées pour protéger les victimes.</p>`},
  D:{ title:"Whiplash <p>Damien Chazelle, 2014</p>", text:`<p><strong>Whiplash</strong> suit Andrew Neiman, jeune batteur de jazz ambitieux, admis dans un prestigieux conservatoire.</p><p>Sous la direction d’un professeur aux méthodes humiliantes et violentes, il subit une pression psychologique extrême présentée comme un moteur de performance.</p><p>Le film questionne le prix de l’excellence lorsque la violence devient une norme.</p>`},
  E:{ title:"Le Colosse aux pieds d’argile <p>Stéphanie Murat, 2022 (téléfilm)</p>", text:`<p><strong>Le Colosse aux pieds d’argile</strong> est un téléfilm dramatique français réalisé par <strong>Stéphanie Murat</strong>.</p><p>Librement adapté du livre de <strong>Sébastien Boueilh</strong> et <strong>Thierry Vildary</strong> (Michel Lafon, 2020), il retrace le parcours d’un ancien sportif confronté aux violences sexuelles subies durant son adolescence.</p><p>Le récit met en lumière les mécanismes d’emprise, le silence institutionnel et l’importance de la parole et de la prévention dans le milieu sportif.</p>`},
  F:{ title:"Service volé <p>Jérôme Foulon, 2021 (téléfilm)</p>", text:`<p><strong>Service volé</strong> est un téléfilm dramatique inspiré de l’histoire d’<strong>Isabelle Demongeot</strong>, ancienne joueuse de tennis.</p><p>Il retrace le combat d’une femme qui décide de briser le silence sur les violences sexuelles subies dans sa jeunesse.</p><p>Le film souligne les obstacles rencontrés par les victimes lorsqu’elles parlent et la nécessité d’un soutien collectif pour prévenir les violences dans le sport.</p>`},
  G:{ title:"Violences sexuelles dans le sport, l’enquête, le silence des champions <p>Pierre-Emmanuel Luneau-Daurignac, 2020</p>", text:`<p><strong>Violences sexuelles dans le sport, l’enquête, le silence des champions</strong> est une enquête journalistique qui met en lumière l’ampleur des violences sexuelles dans le milieu sportif.</p><p>À partir de témoignages de victimes, d’archives et d’investigations de terrain, l’auteur révèle les mécanismes de silence, de protection des agresseurs et de déni institutionnel qui ont longtemps prévalu.</p><p>L’ouvrage interroge les responsabilités des fédérations, des encadrants et des institutions, et souligne l’urgence de transformer en profondeur le système sportif pour mieux protéger les enfants et les athlètes.</p>`},
  H:{ title:"Futurs champions, le prix de la gloire <p>Pierre-Emmanuel Luneau-Daurignac, 2025</p>", text:`<p><strong>Futurs champions, le prix de la gloire</strong> analyse les dérives du sport de haut niveau et la pression exercée sur de très jeunes athlètes dès leur entrée dans les filières d’excellence.</p><p>À travers des enquêtes et des témoignages, l’auteur montre comment la quête de performance peut favoriser des situations de violences, d’abus d’autorité et de mise en danger physique et psychologique.</p><p>L’ouvrage invite à repenser le modèle de formation des jeunes sportifs afin de concilier performance, respect de l’intégrité et protection des mineurs.</p>`},
  I:{ title:"Un si long silence <p>Emmanuelle Anizon et Rémy Burkel, 2022</p>", text:`<p><strong>Un si long silence</strong> retrace le parcours de victimes de violences sexuelles dans le sport et les années de silence imposées par la peur, l’emprise et l’isolement.</p><p>À travers un travail d’enquête et de recueil de témoignages, les auteurs mettent en lumière les mécanismes qui empêchent la parole, ainsi que les obstacles rencontrés par celles et ceux qui tentent de dénoncer les faits.</p><p>L’ouvrage souligne l’importance de l’écoute, de la reconnaissance des victimes et de la responsabilité collective pour lutter contre les violences sexuelles dans le sport.</p>`}
};
