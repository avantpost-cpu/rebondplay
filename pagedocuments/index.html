<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents — RebondPlay</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#064b62;background:#f1f4f1 url("motifsplusdocument.jpg") center top/cover fixed;font-family:Arial,sans-serif}.topbar{height:117px;background:#26788a url("tetieredocuments.png") center/cover no-repeat;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:17px 3.4%;position:relative}.brand{max-width:150px;display:block}.brand img{width:100%}.title-logo{position:absolute;left:50%;top:23px;transform:translateX(-50%);width:min(34vw,345px);max-height:82px;object-fit:contain}.account{text-align:right;font-size:12px;color:#082f40;display:flex;align-items:center;gap:15px}.account button{border:0;background:none;cursor:pointer;color:inherit;font-size:11px}.account small{display:block;margin-top:6px}.scene{width:min(92%,1120px);margin:72px auto 80px}.shelf-row{position:relative;display:flex;align-items:flex-end;min-height:148px;padding:0 20px 8px;gap:18px}.shelf-row:after{content:"";position:absolute;bottom:0;left:0;width:min(100%,520px);height:12px;background:url("trait.png") left center/100% 100% no-repeat;pointer-events:none}.book{height:140px;width:auto;max-width:125px;object-fit:contain;cursor:pointer;transition:transform .2s}.book:hover,.book:focus-visible{transform:translateY(-8px);outline:none}.shelf-label{align-self:center;margin-left:5px;max-width:310px;width:35%;object-fit:contain}.info{max-width:700px;margin:30px 20px;background:rgba(255,255,255,.95);padding:25px;border-radius:9px;display:none;box-shadow:0 5px 17px #16435024}.info.open{display:block}.info h2{margin:0 0 12px}.info p{line-height:1.55}.info button{float:right;border:0;background:none;font-size:24px;cursor:pointer}.back{position:fixed;bottom:15px;right:20px;padding:10px 16px;background:#075167;color:#fff;border-radius:5px;text-decoration:none;font-size:12px}@media(max-width:650px){.topbar{height:95px;padding:12px}.brand{max-width:95px}.title-logo{width:40%;top:28px}.account{font-size:10px;gap:3px}.account small{display:none}.scene{margin-top:45px}.shelf-row{gap:10px;padding-left:8px;min-height:125px}.book{height:105px;max-width:23%}.shelf-label{width:30%}}

/* Navigation horizontale entre les trois univers */
.scene{width:100%;max-width:none;margin:0;padding:0;overflow:hidden}.document-track{display:flex;width:300%;transition:transform .65s cubic-bezier(.22,.61,.36,1);touch-action:pan-y}.document-panel{flex:0 0 33.333333%;width:33.333333%;min-height:calc(100vh - 117px);padding:70px max(6%,calc((100% - 1120px)/2)) 90px}.document-panel h2{font-size:clamp(27px,3vw,42px);font-weight:700;margin:0 0 30px;color:#075167}.document-panel p{max-width:670px;line-height:1.6}.document-nav{position:fixed;top:52%;z-index:12;border:0;border-radius:50%;width:52px;height:52px;display:grid;place-items:center;font-size:35px;background:#075167;color:white;cursor:pointer;box-shadow:0 4px 13px #00334444}.document-nav.prev{left:14px}.document-nav.next{right:14px}.document-nav:disabled{opacity:.2;cursor:default}.document-indicator{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:12}.document-indicator button{width:11px;height:11px;border:0;border-radius:50%;background:#80aab1;cursor:pointer}.document-indicator button.active{background:#075167;transform:scale(1.25)}.resource-links{display:flex;gap:25px;flex-wrap:wrap}.resource-links a{display:block;max-width:320px;min-width:220px;background:#ffffffdf;padding:24px;border-radius:12px;text-decoration:none;color:#075167;font-weight:bold;box-shadow:0 4px 16px #00445518}.resource-links a:hover{transform:translateY(-4px)}.film-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}.film-grid article{background:#ffffffd9;padding:18px;border-radius:12px}.film-grid video{width:100%;aspect-ratio:16/9;background:#111}.film-grid h3{font-size:17px}.film-grid p{font-size:14px}@media(max-width:650px){.document-panel{padding:42px 46px 90px;min-height:calc(100vh - 95px)}.document-nav{width:35px;height:35px;font-size:24px}.document-nav.prev{left:5px}.document-nav.next{right:5px}}
</style></head><body>
<header class="topbar"><a class="brand" id="home" href="../pagefull/index.html"><img id="brandImage" src="../pagefull/Logo_RebondPlay_full2.png" alt="RebondPlay"></a><img class="title-logo" src="logodocuments.png" alt="Documents"><div class="account"><div><span id="accountName">Bonjour</span><small id="accountMeta"></small></div><button id="logout" type="button">⇥ Se déconnecter</button></div></header>
<main class="scene"><div class="document-track" id="documentTrack"><section class="document-panel" aria-label="Livres jeunesse"><div class="shelf-row"><img class="book" tabindex="0" data-key="A" src="https://avantpost-cpu.github.io/depot-quiz/livresj/A.png" alt="Et si on s'parlait"><img class="book" tabindex="0" data-key="B" src="https://avantpost-cpu.github.io/depot-quiz/livresj/B.png" alt="Une bulle dans l'océan"><img class="book" tabindex="0" data-key="C" src="https://avantpost-cpu.github.io/depot-quiz/livresj/C.png" alt="Interdit de me faire mal"><img class="book" tabindex="0" data-key="D" src="https://avantpost-cpu.github.io/depot-quiz/livresj/D.png" alt="C'est mon corps"></div><div class="shelf-row"><img class="book" tabindex="0" data-key="E" src="https://avantpost-cpu.github.io/depot-quiz/livresj/E.png" alt="Livre jeunesse complémentaire"><img class="book" tabindex="0" data-key="F" src="https://avantpost-cpu.github.io/depot-quiz/livresj/F.png" alt="Livre jeunesse complémentaire"><img class="shelf-label" src="titrelivrejeunesse.png" alt="Livres jeunesse"></div><div class="info" id="info" aria-live="polite"></div></section><section class="document-panel" aria-label="Livres documentaires"><h2>Livres documentaires</h2><div class="resource-links"><a href="https://avantpost-cpu.github.io/depot-quiz/autobio/autobio.html" target="_blank" rel="noopener">Autobiographies et témoignages ↗</a><a href="https://avantpost-cpu.github.io/depot-quiz/livre/livre.html" target="_blank" rel="noopener">Livres documentaires ↗</a></div></section><section class="document-panel" aria-label="Films"><h2>Films</h2><div class="film-grid"><article><h3>Film (é)preuves</h3><video controls controlsList="nodownload" preload="none" playsinline src="../pagevideo/Film_Expo-e-preuves_bdf2.mp4"></video><p>Film documentaire Rebond.</p></article><article><h3>Animations de sensibilisation</h3><p>Retrouvez les animations et vidéos pédagogiques dans la médiathèque.</p><a href="../mediatheque/index.html">Voir les vidéos ↗</a></article></div></section></div></main><button class="document-nav prev" id="docPrev" type="button" aria-label="Rubrique précédente">‹</button><button class="document-nav next" id="docNext" type="button" aria-label="Rubrique suivante">›</button><nav class="document-indicator" id="docIndicators" aria-label="Rubriques"><button aria-label="Livres jeunesse" class="active"></button><button aria-label="Livres documentaires"></button><button aria-label="Films"></button></nav><a class="back" id="back" href="../pagefull/index.html">← Retour</a>
<script>
const track=document.getElementById('documentTrack');const dots=[...document.querySelectorAll('#docIndicators button')];const prev=document.getElementById('docPrev'),next=document.getElementById('docNext');let sectionIndex=0;function goSection(i){sectionIndex=Math.max(0,Math.min(2,i));track.style.transform='translateX(-'+(sectionIndex*100/3)+'%)';prev.disabled=sectionIndex===0;next.disabled=sectionIndex===2;dots.forEach((d,n)=>{d.classList.toggle('active',n===sectionIndex);d.setAttribute('aria-current',n===sectionIndex?'true':'false')});document.querySelectorAll('video').forEach(v=>v.pause())}prev.onclick=()=>goSection(sectionIndex-1);next.onclick=()=>goSection(sectionIndex+1);dots.forEach((d,i)=>d.onclick=()=>goSection(i));let touchX=0;track.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});track.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>65)goSection(sectionIndex+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,video,button'))return;if(e.key==='ArrowRight')goSection(sectionIndex+1);if(e.key==='ArrowLeft')goSection(sectionIndex-1)});goSection(0);const info=document.getElementById('info');const data={
A:['Et si on s’parlait des violences faites aux enfants dans le sport','Éditions Les petits Citoyens','Un livret pédagogique pour aider les enfants à comprendre que le sport doit rester un espace de respect et de sécurité.'],
B:['Une bulle dans l’océan','Coralie Dière et Marie Debré Chapuis — Éditions Fabert','Un récit sur les violences sexuelles subies par les jeunes, notamment en situation de handicap.'],
C:['Interdit de me faire mal','Mai Lan Chapiron — Éditions de la Martinière','Un album pour apprendre aux tout-petits que personne n’a le droit de leur faire mal.'],
D:['C’est mon corps','Mai Lan Chapiron — Éditions de la Martinière','Un album pour comprendre que son corps lui appartient et apprendre le consentement.']};
function show(key){const d=data[key];if(!d)return;info.innerHTML='<button type="button" aria-label="Fermer">×</button><h2>'+d[0]+'</h2><p><strong>'+d[1]+'</strong></p><p>'+d[2]+'</p>';info.querySelector('button').onclick=()=>info.classList.remove('open');info.classList.add('open');info.scrollIntoView({behavior:'smooth',block:'nearest'})}
document.querySelectorAll('.book').forEach(b=>{b.onclick=()=>show(b.dataset.key);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(b.dataset.key)}}});
const params=new URLSearchParams(location.search);const tier=(params.get('tier')||'full').toLowerCase();const home=tier==='essentielplus'?'../RPessentielleplus/index.html':tier==='essentiel'?'../Essentiel/index.html':'../pagefull/index.html';document.getElementById('home').href=home;document.getElementById('back').href=home;if(tier==='essentielplus'){document.getElementById('brandImage').src='../RPessentielleplus/Logo_RebondPlay_essentielplus.png'}else if(tier==='essentiel'){document.getElementById('brandImage').src='../Essentiel/Logo_RebondPlay_essentielplus.png'}
const keys=['rebondplay_access_ok','rebondplay_abonnement_id','rebondplay_nom_structure','rebondplay_code','rebondplay_date_fin','rebondplay_prenom_contact','rebondplay_nom_contact'];const full=sessionStorage.getItem('rebondplay_access_ok')==='1';const plus=sessionStorage.getItem('rp_essentiel_plus_ok')==='1';const basic=sessionStorage.getItem('rp_essentiel_ok')==='1';if(!(full||plus||basic)){location.replace('../index.html')}else{const name=[sessionStorage.getItem('rebondplay_prenom_contact'),sessionStorage.getItem('rebondplay_nom_contact')].filter(Boolean).join(' ')||sessionStorage.getItem('rebondplay_nom_structure')||'';document.getElementById('accountName').textContent='Bonjour '+name;const end=sessionStorage.getItem('rebondplay_date_fin');if(end){const days=Math.max(0,Math.ceil((new Date(end+'T23:59:59')-Date.now())/86400000));document.getElementById('accountMeta').textContent='Votre abonnement est encore valable '+days+' jours'}document.getElementById('logout').onclick=()=>{keys.forEach(k=>sessionStorage.removeItem(k));sessionStorage.removeItem('rp_essentiel_plus_ok');sessionStorage.removeItem('rp_essentiel_ok');location.replace('../index.html')}}
</script></body></html>
