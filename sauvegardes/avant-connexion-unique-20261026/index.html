
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b5f6e">
<title>RebondPlay — Accès aux outils</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #1b5f6e url("motifs.jpg") repeat;
    background-size: 870px 624px;
    color: white;
}

.access-screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

.access-box {
    position: relative;
    width: min(1100px, calc(100vw - 20px));
    aspect-ratio: 2048 / 1763;
    flex: 0 0 auto;
    margin: 0;
}

.access-background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
}

.access-box input {
    position: absolute;
    left: 23.3%;
    top: 45.1%;
    width: 53.4%;
    height: 7.5%;
    margin: 0;
    padding: 0 3%;
    border: 0;
    border-radius: 0;
    outline: 0;
    background: transparent;
    color: #155f72;
    font: 700 clamp(14px, 2vw, 25px) Arial, sans-serif;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .08em;
}

.access-box input:focus {
    box-shadow: inset 0 0 0 2px rgba(21,95,114,.16);
    background: rgba(255,255,255,.08);
}

.access-button {
    position: absolute;
    left: 31.8%;
    top: 55%;
    width: 38.5%;
    height: 8.6%;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: transparent;
    font-size: 0;
    cursor: pointer;
}

.access-button:hover {
    background: rgba(255,255,255,.07);
}

.access-button:disabled {
    opacity: .55;
    cursor: wait;
}

.access-error {
    position: absolute;
    left: 27%;
    top: 65.5%;
    width: 46%;
    display: none;
    padding: 8px 12px;
    border-radius: 9px;
    background: rgba(192,57,43,.9);
    color: white;
    font-size: clamp(9px,1.1vw,13px);
    line-height: 1.3;
    text-align: center;
}

.access-error.show {
    display: block;
}

.visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
}

.individual-access{max-width:520px;margin:0 auto 16px;padding:0 14px;text-align:center;color:#fff;font:600 15px Arial,sans-serif}
.individual-access summary{display:inline-block;cursor:pointer;background:#f7f4ef;color:#065269;border-radius:28px;padding:13px 22px;font-weight:800;list-style:none}
.individual-access summary::-webkit-details-marker{display:none}
.individual-access .individual-panel{margin:15px auto 0;padding:20px;background:#f7f4ef;color:#063e54;border-radius:16px;text-align:left;box-shadow:0 7px 14px #0003}
.individual-panel label{display:block;font-weight:700;margin:10px 0 5px}
.individual-panel input{display:block;width:100%;font:inherit;padding:11px;border:1px solid #065269;border-radius:7px;background:white;color:#063e54}
.individual-panel button{background:#065269;color:white;border:0;border-radius:8px;padding:12px 18px;font:800 15px Arial;cursor:pointer;margin-top:14px}
.individual-panel button:disabled{opacity:.5}
.individual-panel p{font-size:13px;line-height:1.5}
#individualResult{white-space:pre-wrap}
.rebond-signature-footer {
    text-align: center;
    padding: 20px 12px;
    font: 600 12px Arial, sans-serif;
    color: #064b62;
}

.rebond-signature-footer strong {
    font-weight: 900;
}

@media(max-width:650px) {
    .access-screen {
        align-items: flex-start;
        padding: 6px;
    }

    .access-box {
        width: calc(100vw - 12px);
    }
}
</style>
</head>

<body>

<main class="access-screen">
    <form class="access-box" id="accessForm">

        <img
            class="access-background"
            src="popup1.png"
            alt="Bienvenue sur RebondPlay. Entrez le code d'accès associé à votre abonnement."
            draggable="false"
        >

        <label class="visually-hidden" for="accessCode">
            Code d'accès
        </label>

        <input
            id="accessCode"
            type="text"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            required
        >

        <button
            class="access-button"
            id="accessButton"
            type="submit"
            aria-label="Valider le code d'accès"
        >
            Accéder aux outils
        </button>

        <div
            class="access-error"
            id="accessError"
            role="alert"
            aria-live="polite"
        ></div>

    </form>
</main>
<section class="individual-access" aria-label="Connexion individuelle">
<details id="individualDetails">
<summary>Se connecter avec un compte individuel</summary>
<div class="individual-panel">
<p>Connexion par e-mail et mot de passe. Pendant la transition, cet accès permet de vérifier ton abonnement sans remplacer les codes actuels.</p>
<form id="individualForm">
<label for="individualEmail">Adresse e-mail</label><input id="individualEmail" type="email" autocomplete="username" required>
<label for="individualPassword">Mot de passe</label><input id="individualPassword" type="password" autocomplete="current-password" required>
<button type="submit" id="individualSubmit">Vérifier mon abonnement</button>
</form>
<p id="individualResult" role="status" aria-live="polite"></p>
<p id="individualNext" hidden><a href="/connexion-pilote/">Ouvrir l'espace de test sécurisé</a></p>
<button type="button" id="individualLogout" hidden>Se déconnecter</button>
</div>
</details>
</section>
<footer class="rebond-signature-footer">
    <strong>Rebond</strong> · Association de prévention contre les violences dans le sport
</footer>

<script>
(() => {
    "use strict";

    const $ = id => document.getElementById(id);

    const KEYS = [
        "rebondplay_access_ok",
        "rebondplay_abonnement_id",
        "rebondplay_nom_structure",
        "rebondplay_code",
        "rebondplay_date_fin",
        "rebondplay_prenom_contact",
        "rebondplay_nom_contact",
        "rp_essentiel_plus_ok",
        "rp_essentiel_ok",
        "rebondplay_tier"
    ];

    const ROUTES = {
        full: "/pagefull/index.html",
        essentielplus: "/RPessentielleplus/index.html",
        essentiel: "/Essentiel/index.html"
    };

    const CODES = {
        CYRILLE: "full",
        ROBERT: "essentielplus",
        ALMA: "essentiel"
    };

    function clearSession() {
        KEYS.forEach(key => sessionStorage.removeItem(key));
    }

    function destination(tier) {
        const route = ROUTES[tier];

        if (!route) return;

        const retour = new URLSearchParams(
            location.search
        ).get("retour");

        if (retour === "documents") {
            location.replace(
                "/pagedocuments/index.html?tier=" +
                encodeURIComponent(tier)
            );
            return;
        }

        location.replace(route);
    }

    function saveSession(tier, code, result = null) {
        clearSession();

        sessionStorage.setItem(
            "rebondplay_access_ok",
            "1"
        );

        sessionStorage.setItem(
            "rebondplay_code",
            code
        );

        sessionStorage.setItem(
            "rebondplay_tier",
            tier
        );

        if (tier === "essentielplus") {
            sessionStorage.setItem(
                "rp_essentiel_plus_ok",
                "1"
            );
        }

        if (tier === "essentiel") {
            sessionStorage.setItem(
                "rp_essentiel_ok",
                "1"
            );
        }

        if (result) {
            const fields = {
                abonnement_id: "rebondplay_abonnement_id",
                nom_structure: "rebondplay_nom_structure",
                date_fin: "rebondplay_date_fin",
                prenom_contact: "rebondplay_prenom_contact",
                nom_contact: "rebondplay_nom_contact"
            };

            for (const [field, key] of Object.entries(fields)) {
                sessionStorage.setItem(
                    key,
                    result[field] || ""
                );
            }
        }
    }

    function showError(message) {
        $("accessError").textContent = message;
        $("accessError").classList.add("show");
    }

    /* Reconnexion automatique */

    const oldCode = (
        sessionStorage.getItem("rebondplay_code") || ""
    ).toUpperCase();

    const oldTier =
        CODES[oldCode] ||
        sessionStorage.getItem("rebondplay_tier");

    if (
        sessionStorage.getItem("rebondplay_access_ok") === "1" &&
        ROUTES[oldTier]
    ) {
        destination(oldTier);
    }

    /* Validation du formulaire */

    $("accessForm").addEventListener(
        "submit",
        async event => {
            event.preventDefault();

            const code = $("accessCode")
                .value
                .trim()
                .toUpperCase();

            const button = $("accessButton");

            $("accessError").textContent = "";
            $("accessError").classList.remove("show");

            if (!code) {
                showError(
                    "Merci de renseigner ton code d’accès."
                );
                return;
            }

            /* Codes des trois offres */

            if (CODES[code]) {
                const tier = CODES[code];

                saveSession(tier, code);
                destination(tier);
                return;
            }

            /* Autres codes vérifiés dans Supabase */

            button.disabled = true;

            try {
                if (!window.supabase) {
                    throw new Error(
                        "Service de connexion indisponible"
                    );
                }

                const client = window.supabase.createClient(
                    "https://tdsrqmpfdvntybdlvejy.supabase.co",
                    "sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO"
                );

                const { data, error } = await client.rpc(
                    "rp_verifier_code",
                    { p_code: code }
                );

                if (error) throw error;

                const result = data?.[0];

                if (!result || result.valide !== true) {
                    throw new Error("Code invalide");
                }

                /*
                 * Compatibilité avec les abonnements
                 * Supabase existants.
                 * Leur offre doit à terme être déterminée
                 * et vérifiée côté serveur.
                 */

                const tier = "full";

                saveSession(tier, code, result);
                destination(tier);

            } catch (error) {
                console.error(
                    "Erreur validation code :",
                    error
                );

                showError(
                    "Code invalide, inactif ou arrivé à expiration."
                );

            } finally {
                button.disabled = false;
            }
        }
    );
})();
</script>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const client=window.supabase.createClient("https://tdsrqmpfdvntybdlvejy.supabase.co","sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO",{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const form=$("individualForm"),result=$("individualResult"),button=$("individualSubmit"),logout=$("individualLogout"),next=$("individualNext");
form.addEventListener("submit",async event=>{
event.preventDefault();button.disabled=true;result.textContent="Connexion en cours…";next.hidden=true;
try{
const {error}=await client.auth.signInWithPassword({email:$("individualEmail").value.trim(),password:$("individualPassword").value});
$("individualPassword").value="";
if(error)throw error;
const {data,error:lookupError}=await client.rpc("rp_mon_abonnement");
if(lookupError)throw lookupError;
const subscription=data?.[0];
form.hidden=true;logout.hidden=false;
if(!subscription){result.textContent="Compte connecté, mais aucun abonnement actif n'est associé à ce compte.";return}
result.textContent="Compte vérifié.\nOrganisme : "+subscription.nom_structure+"\nOffre : "+subscription.offre+"\nValable jusqu'au : "+subscription.date_fin+"\nL'accès aux pages actuelles par compte individuel sera activé après sécurisation de ces pages.";
next.hidden=false;
}catch(error){result.textContent="Connexion ou vérification impossible : "+(error?.message||"Erreur inconnue")}
finally{button.disabled=false}
});
logout.addEventListener("click",async()=>{await client.auth.signOut();form.hidden=false;logout.hidden=true;next.hidden=true;result.textContent="Déconnecté."});
})();
</script>
</body>
</html>
