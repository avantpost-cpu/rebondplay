<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Game Rebond - Révélation finale</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#1b5f6e;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  overflow-x:auto;
}

.page-revelation{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:40px;
}

.bloc-revelation{
  position:relative;
  width:999px;
  height:716px;
  overflow:hidden;
  background:#1b5f6e;

  user-select:none;
  -webkit-user-select:none;

  touch-action:none;
}

/* ======================================================
   FOND 999 × 716
====================================================== */

.fond-revelation{
  position:absolute;
  inset:0;

  width:999px;
  height:720px;

  display:block;
  object-fit:fill;

  z-index:1;

  pointer-events:none;
  user-select:none;
}


/* ======================================================
   MOTS MOBILES
====================================================== */

.mot-image{
  position:absolute;

  z-index:30;

  display:block;

  height:auto;

  cursor:grab;

  touch-action:none;

  transform-origin:center center;

  filter:
    drop-shadow(
      0 4px 5px
      rgba(0,0,0,.18)
    );

  transition:
    transform .12s ease,
    filter .12s ease,
    left .18s ease,
    top .18s ease;
}

.mot-image:hover{
  transform:scale(1.03);
}

.mot-image.dragging{
  z-index:250;

  cursor:grabbing;

  transform:scale(1.055);

  filter:
    drop-shadow(
      0 8px 10px
      rgba(0,0,0,.28)
    );

  transition:
    transform .12s ease,
    filter .12s ease;
}


/*
  Les cinq images-mots conservent exactement la même
  hauteur visuelle pendant tout le jeu, sur le papier jaune
  comme lorsqu'elles sont posées sur les bandes bleues.

  Leur largeur reste automatique afin de conserver
  les proportions propres à chaque PNG.
*/

#motEnsemble,
#motProtegeons,
#motLenfance,
#motDans,
#motLesport{
  width:auto;
  height:54px;
}


/* ======================================================
   5 POSITIONS INVISIBLES SUR LE PAPIER JAUNE
   Les mots y sont mélangés automatiquement au chargement.
====================================================== */

.depart{
  position:absolute;

  width:1px;
  height:1px;

  pointer-events:none;

  z-index:2;
}

#depart1{
  left:150px;
  top:238px;
}

#depart2{
  left:165px;
  top:308px;
}

#depart3{
  left:145px;
  top:378px;
}

#depart4{
  left:195px;
  top:450px;
}

#depart5{
  left:155px;
  top:520px;
}


/* ======================================================
   EMPLACEMENTS DE LA PHRASE
   2 mots sur la première bande
   3 mots sur la seconde
====================================================== */

.zone-depot{
  position:absolute;

  z-index:15;

  height:62px;

  background:transparent;

  border:0;

  pointer-events:none;
}


/*
  LIGNE 1 :
  ENSEMBLE | PROTÉGEONS

  Bande bleue visible environ :
  x = 455 → 912
  y = 304 → 374
*/

#zone1{
  left:468px;
  top:309px;
  width:175px;
}

#zone2{
  left:653px;
  top:309px;
  width:242px;
}


/*
  LIGNE 2 :
  L'ENFANCE | DANS | LE SPORT

  Bande bleue visible environ :
  x = 441 → 948
  y = 382 → 470
*/

#zone3{
  left:455px;
  top:393px;
  width:180px;
}

#zone4{
  left:645px;
  top:393px;
  width:110px;
}

#zone5{
  left:765px;
  top:393px;
  width:166px;
}


/*
  Zone de tolérance légèrement supérieure aux bandes,
  uniquement utilisée pour faciliter le dépôt.
*/

.zone-cible{
  position:absolute;

  z-index:14;

  pointer-events:none;

  background:transparent;
}

#cibleLigne1{
  left:450px;
  top:297px;

  width:470px;
  height:84px;
}

#cibleLigne2{
  left:435px;
  top:379px;

  width:520px;
  height:96px;
}


/* ======================================================
   MOT POSÉ
====================================================== */

.mot-image.place{
  z-index:40;

  cursor:grab;

  filter:none;

  transform:none;
}


/* ======================================================
   PETIT EFFET DE VICTOIRE
====================================================== */

.mot-image.correct{
  animation:
    victoireMot .36s ease both;
}

@keyframes victoireMot{

  0%{
    transform:scale(1);
  }

  45%{
    transform:scale(1.055);
  }

  100%{
    transform:scale(1);
  }

}


/* ======================================================
   VIDÉO FINALE
====================================================== */

.finanime-final{
  position:absolute;
  inset:0;

  z-index:500;

  display:none;

  width:999px;
  height:720px;

  object-fit:fill;

  background:#000;

  /* Vidéo finale légèrement plus dense */
  filter:
    saturate(1.18)
    contrast(1.08)
    brightness(0.97);
}

.finanime-final.visible{
  display:block;
}


/* ======================================================
   BOUTON DE SECOURS AUTOPLAY
====================================================== */

.bouton-video{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  z-index:520;

  display:none;

  border:0;
  border-radius:999px;

  padding:15px 28px;

  background:#e65b10;
  color:#ffffff;

  font-size:18px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 22px
    rgba(0,0,0,.35);
}

.bouton-video.visible{
  display:block;
}


/* ======================================================
   BOUTONS DE FIN
====================================================== */

.actions-fin{
  width:999px;
  display:none;
  justify-content:center;
  gap:12px;
  margin-top:12px;
}

.actions-fin.visible{
  display:flex;
}

.actions-fin a{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:34px;
  padding:7px 15px;

  border:2px solid #ffffff;
  border-radius:999px;

  background:transparent;
  color:#ffffff;

  font-size:12px;
  line-height:1;
  font-weight:700;
  text-decoration:none;

  cursor:pointer;

  transition:
    background .15s ease,
    color .15s ease;
}

.actions-fin a:hover{
  background:#ffffff;
  color:#1b5f6e;
}


/* ======================================================
   COPYRIGHT
====================================================== */

.copyright-rebond{
  width:999px;

  margin:
    11px auto 30px;

  color:
    rgba(255,255,255,.88);

  font-size:11px;
  line-height:1.2;
  font-weight:500;
  letter-spacing:.3px;

  text-align:center;

  pointer-events:none;
  user-select:none;
}


@media screen and (max-width:1140px){

  .page-revelation{
    align-items:flex-start;
    padding-left:25px;
  }

}


@media screen and (max-width:600px){

  .copyright-rebond{
    margin-top:8px;
    font-size:9px;
  }

}
</style>
</head>

<body>

<div class="page-revelation">

    <!-- FOND -->

    <span

    </span>

    <span
      class="depart"
      id="depart2">
    </span>

    <span
      class="depart"
      id="depart3">
    </span>

    <span
      class="depart"
      id="depart4">
    </span>

    <span
      class="depart"
      id="depart5">

    <!-- MOTS MOBILES -->

    <img
      class="mot-image"
      id="motEnsemble"
      src="ensemble.png"

    <img
      class="mot-image"
      id="motDans"
      src="dans.png"
      data-mot="dans"
      alt="Dans"
      draggable="false">

    <img
      class="mot-image"
      id="motLesport"
      src="lesport.png"
      data-mot="lesport"
      alt="Le sport"
      draggable="false">


    <!--
      ORDRE FINAL :

      LIGNE 1

    -->

      id="zone1"
      data-attendu="ensemble">

    <div
      class="zone-depot"
      id="zone2"

    </div>

    <div
      class="zone-depot"
      id="zone3"
      data-attendu="lenfance">
    </div>

    <div
      class="zone-depot"
      id="zone4"
      data-attendu="dans">
    </div>

      class="zone-depot"
      id="zone5"

    <!-- VIDÉO FINALE -->

    <video

  <div

    </a>

  <div
    class="copyright-rebond"

<script>
const bloc =
  document.getElementById(
    "blocRevelation"
  );

const mots =
  [
    ...document.querySelectorAll(
      ".mot-image"
    )
  ];

const zones =
  [
    ...document.querySelectorAll(
      ".zone-depot"
    )
  ];

const departs =
  [
    ...document.querySelectorAll(
      ".depart"
    )
  ];

const voixConsigne =
  document.getElementById(
    "voixConsigne"
  );

const videoRevelation =
  document.querySelector(
    ".fond-revelation"
  );

const sonVictoire =
  document.getElementById(
    "sonVictoire"
  );

const finanimeFinal =
  document.getElementById(
    "finanimeFinal"
  );

const boutonVideo =
  document.getElementById(
    "boutonVideo"
  );

const actionsFin =
  document.getElementById(
    "actionsFin"
  );


/* ======================================================
   PROGRESSION
====================================================== */

localStorage.setItem(
  "rebondCurrentPage",
  "fin/revelation.html"
);


/* ======================================================
   ORDRE ATTENDU
====================================================== */

const ordreFinal = [
  "ensemble",
  "protegeons",
  "lenfance",
  "dans",
  "lesport"
];


/* ======================================================
   MÉLANGE DES MOTS SUR LE PAPIER JAUNE
====================================================== */

function melanger(tableau){

  const copie =
    tableau.slice();

  for(
    let i =
      copie.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      copie[i],
      copie[j]
    ] = [
      copie[j],
      copie[i]
    ];

  }

  return copie;
}


function ordreEstCorrect(tableau){

  return tableau.every(
    function(mot, index){

      return (
        mot.dataset.mot ===
        ordreFinal[index]
      );

    }
  );

}


function placerMotsMelanges(){

  let melange =
    melanger(
      mots
    );

  /*
    Le mélange ne doit JAMAIS présenter
    directement la phrase dans le bon ordre.
  */

  while(
    ordreEstCorrect(
      melange
    )
  ){

    melange =
      melanger(
        mots
      );

  }


  melange.forEach(
    function(mot, index){

      const depart =
        departs[index];

      mot.style.left =
        depart.offsetLeft + "px";

      mot.style.top =
        depart.offsetTop + "px";

      mot.dataset.depart =
        String(index);

      mot.classList.remove(
        "place",
        "correct",
        "dragging"
      );

      delete mot.dataset.zone;

    }
  );

}


/* ======================================================
   GLISSER / DÉPOSER
====================================================== */

let motActif =
  null;

let decalageX =
  0;

let decalageY =
  0;

let pointeurActif =
  null;

let jeuTermine =
  false;


mots.forEach(
  function(mot){

    mot.addEventListener(
      "pointerdown",
      commencerDeplacement
    );

  }
);


function commencerDeplacement(
  event
){

  if(jeuTermine){
    return;
  }

  const mot =
    event.currentTarget;


  /*
    Si le mot était déjà dans une case,
    sa case redevient libre.
  */

  libererZoneDuMot(
    mot
  );


  motActif =
    mot;

  pointeurActif =
    event.pointerId;


  const rectMot =
    mot.getBoundingClientRect();

  const rectBloc =
    bloc.getBoundingClientRect();


  decalageX =
    event.clientX -
    rectMot.left;

  decalageY =
    event.clientY -
    rectMot.top;


  mot.style.left =
    (
      rectMot.left -
      rectBloc.left
    ) + "px";

  mot.style.top =
    (
      rectMot.top -
      rectBloc.top
    ) + "px";


  mot.classList.remove(
    "place",
    "correct"
  );

  mot.classList.add(
    "dragging"
  );


  try{

    mot.setPointerCapture(
      event.pointerId
    );

  }
  catch(erreur){}


  event.preventDefault();
}


bloc.addEventListener(
  "pointermove",
  function(event){

    if(
      !motActif ||
      event.pointerId !==
      pointeurActif
    ){

      return;

    }


    const rectBloc =
      bloc.getBoundingClientRect();


    let x =
      event.clientX -
      rectBloc.left -
      decalageX;

    let y =
      event.clientY -
      rectBloc.top -
      decalageY;


    x =
      Math.max(
        -motActif.offsetWidth *
          .15,
        Math.min(
          x,
          bloc.clientWidth -
          motActif.offsetWidth *
          .85
        )
      );


    y =
      Math.max(
        -motActif.offsetHeight *
          .15,
        Math.min(
          y,
          bloc.clientHeight -
          motActif.offsetHeight *
          .85
        )
      );


    motActif.style.left =
      x + "px";

    motActif.style.top =
      y + "px";


    event.preventDefault();

  }
);


bloc.addEventListener(
  "pointerup",
  terminerDeplacement
);


bloc.addEventListener(
  "pointercancel",
  terminerDeplacement
);


function terminerDeplacement(
  event
){

  if(
    !motActif ||
    event.pointerId !==
    pointeurActif
  ){

    return;

  }


  const mot =
    motActif;


  mot.classList.remove(
    "dragging"
  );


  const zone =
    trouverZoneSousMot(
      mot
    );


  if(
    zone &&
    !zone.dataset.occupePar
  ){

    placerMotDansZone(
      mot,
      zone
    );

  }
  else{

    remettreMotAuDepart(
      mot
    );

  }


  try{

    mot.releasePointerCapture(
      event.pointerId
    );

  }
  catch(erreur){}


  motActif =
    null;

  pointeurActif =
    null;


  verifierPhrase();

}


/* ======================================================
   TROUVER LA CASE LA PLUS PROCHE
====================================================== */

function trouverZoneSousMot(
  mot
){

  const rectMot =
    mot.getBoundingClientRect();


  const centreX =
    rectMot.left +
    rectMot.width / 2;

  const centreY =
    rectMot.top +
    rectMot.height / 2;


  /*
    Tolérance généreuse autour de chaque case :
    il suffit que le centre du mot arrive
    près de son emplacement.
  */

  let meilleureZone =
    null;

  let meilleureDistance =
    Infinity;


  zones.forEach(
    function(zone){

      if(
        zone.dataset.occupePar
      ){

        return;

      }


      const rect =
        zone.getBoundingClientRect();


      const centreZoneX =
        rect.left +
        rect.width / 2;

      const centreZoneY =
        rect.top +
        rect.height / 2;


      const dx =
        centreX -
        centreZoneX;

      const dy =
        centreY -
        centreZoneY;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if(
        distance <
        meilleureDistance
      ){

        meilleureDistance =
          distance;

        meilleureZone =
          zone;

      }

    }
  );


  /*
    135 px donne une zone de dépôt confortable
    sans faire aspirer un mot depuis l'autre côté
    de l'écran.
  */

  if(
    meilleureDistance <=
    135
  ){

    return meilleureZone;

  }


  return null;

}


/* ======================================================
   PLACEMENT PRÉCIS DANS LES BANDES BLEUES — TAILLE CONSTANTE
====================================================== */

function placerMotDansZone(
  mot,
  zone
){

  const rectZone =
    zone.getBoundingClientRect();

  const rectBloc =
    bloc.getBoundingClientRect();


  /*
    IMPORTANT :
    le mot garde exactement la même taille
    qu'il avait sur le papier jaune.

    On ne modifie donc ni sa largeur,
    ni sa hauteur au moment du dépôt.
  */


  const largeurMot =
    mot.offsetWidth;

  const hauteurMot =
    mot.offsetHeight;


  const left =
    rectZone.left -
    rectBloc.left +
    (
      rectZone.width -
      largeurMot
    ) / 2;


  const top =
    rectZone.top -
    rectBloc.top +
    (
      rectZone.height -
      hauteurMot
    ) / 2;


  mot.style.left =
    left + "px";

  mot.style.top =
    top + "px";


  mot.classList.add(
    "place"
  );


  mot.dataset.zone =
    zone.id;


  zone.dataset.occupePar =
    mot.dataset.mot;

}


/* ======================================================
   LIBÉRER UNE CASE
====================================================== */

function libererZoneDuMot(
  mot
){

  const idZone =
    mot.dataset.zone;


  if(!idZone){
    return;
  }


  const zone =
    document.getElementById(
      idZone
    );


  if(zone){

    delete zone.dataset.occupePar;

  }


  delete mot.dataset.zone;

}


/* ======================================================
   RETOUR SUR LE PAPIER JAUNE
====================================================== */

function remettreMotAuDepart(
  mot
){

  libererZoneDuMot(
    mot
  );


  const index =
    Number(
      mot.dataset.depart
    );


  const depart =
    departs[index];


  if(!depart){
    return;
  }
mot.style.left =
    depart.offsetLeft +
    "px";

  mot.style.top =
    depart.offsetTop +
    "px";


  mot.classList.remove(
    "place",
    "correct"
  );

}


/* ======================================================
   VALIDATION AUTOMATIQUE
====================================================== */

function verifierPhrase(){

  if(jeuTermine){
    return;
  }


  const toutesOccupees =
    zones.every(
      function(zone){

        return Boolean(
          zone.dataset.occupePar
        );

      }
    );


  if(!toutesOccupees){
    return;
  }


  const ordreCorrect =
    zones.every(
      function(zone){

        return (
          zone.dataset.occupePar ===
          zone.dataset.attendu
        );

      }
    );


  if(!ordreCorrect){
    return;
  }


  jeuTermine =
    true;


  mots.forEach(
    function(mot){

      mot.classList.add(
        "correct"
      );

      mot.style.pointerEvents =
        "none";

    }
  );


  jouerVictoirePuisVideo();

}


/* ======================================================
   SON DE VICTOIRE
====================================================== */

function jouerVictoirePuisVideo(){

  if(sonVictoire){

    try{

      sonVictoire.pause();

      sonVictoire.currentTime =
        0;

      sonVictoire.volume =
        1;

      sonVictoire.muted =
        false;

    }
    catch(erreur){}


    const lecture =
      sonVictoire.play();


    if(
      lecture &&
      typeof lecture.catch ===
        "function"
    ){

      lecture.catch(
        function(erreur){

          console.warn(
            "Le son de victoire n'a pas pu être joué :",
            erreur
          );

        }
      );

    }

  }


  /*
    On garde la phrase reconstituée visible
    1,8 seconde avant la vidéo.
  */

  window.setTimeout(
    lancerVideoFinale,
    1800
  );

}


/* ======================================================
   VIDÉO FINALE
====================================================== */

function lancerVideoFinale(){

  finanimeFinal.classList.add(
    "visible"
  );


  finanimeFinal.currentTime =
    0;

  finanimeFinal.muted =
    false;

  finanimeFinal.volume =
    1;


  const lecture =
    finanimeFinal.play();


  if(
    lecture &&
    typeof lecture.catch ===
      "function"
  ){

    lecture.catch(
      function(){

        boutonVideo.classList.add(
          "visible"
        );

      }
    );

  }

}


boutonVideo.addEventListener(
  "click",
  function(){

    boutonVideo.classList.remove(
      "visible"
    );


    finanimeFinal.muted =
      false;

    finanimeFinal.volume =
      1;


    finanimeFinal.play();

  }
);


finanimeFinal.addEventListener(
  "ended",
  function(){

    finanimeFinal.pause();

    finanimeFinal.controls =
      false;

    finanimeFinal.style.pointerEvents =
      "none";


    /*
      Les deux petits boutons apparaissent
      seulement lorsque la vidéo finale est terminée.
    */

    actionsFin.classList.add(
      "visible"
    );

  }
);


/* ======================================================
   DÉMARRAGE
====================================================== */

window.addEventListener(
  "load",
  function(){

    placerMotsMelanges();


    /*
      La voix des consignes démarre en même temps
      que revelation.mp4.
    */

    if(
      videoRevelation &&
      voixConsigne
    ){

      voixConsigne.currentTime =
        0;

      voixConsigne.volume =
        1;

      voixConsigne.muted =
        false;


      const lancerVoix =
        function(){

          voixConsigne.currentTime =
            0;

          const lectureVoix =
            voixConsigne.play();


          if(
            lectureVoix &&
            typeof lectureVoix.catch ===
              "function"
          ){

            lectureVoix.catch(
              function(erreur){

                console.warn(
                  "Le navigateur a bloqué la lecture automatique de voix.mp3 :",
                  erreur
                );

              }
            );

          }

        };


      /*
        Si la vidéo est déjà partie grâce à autoplay,
        on lance immédiatement la voix.
        Sinon on attend son événement "play".
      */

      if(
        !videoRevelation.paused
      ){

        lancerVoix();

      }
      else{

        videoRevelation.addEventListener(
          "play",
          lancerVoix,
          {
            once:true
          }
        );

      }

    }

  }
);

</script>
