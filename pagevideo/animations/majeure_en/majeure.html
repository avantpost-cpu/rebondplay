<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adult victim — Rebond</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  overflow-x: auto;
  font-family: Arial, sans-serif;
}

/* ⭐ CONTENEUR DE CONTRÔLE — clé pour Digiforma */
#outer-container {
  width: 100%;
  max-width: 550px;
  margin: auto;
  overflow: hidden;
  position: relative;
}

/* ⭐ SCÈNE HOMOTHÉTIQUE — base 500 px */
.homothety-stage {
  width: 500px;
  transform-origin: top left;
}

/* ------- CSS -------- */

.scene-adulte {
  width: 500px;
  margin: 0;
}

.zone-fond {
  position: relative;
  width: 100%;
  height: 709px;
  background-image: url("./fondadulte.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center top;
}

/* ⭐ Style de base des icônes */
.icone {
  position: absolute;
  width: 25%;
  left: 18%;
  aspect-ratio: 4 / 1;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: left center;
  opacity: .40;
  cursor: pointer;

  /* ⭐ Zoom orienté vers la droite (par défaut) */
  transform-origin: left center;

  transition: transform .15s ease-out, filter .2s ease-out, opacity .15s ease-out;
}

/* ⭐ Survol commun */
.icone:hover {
  opacity: 1;
  filter: brightness(1.15);
  z-index: 50;
}

/* ⭐⭐ ZOOM INDIVIDUEL POUR CHAQUE PHRASE ⭐⭐ */
.i1:hover {
  transform: scale(2.8) rotate(-3deg);
}

.i2:hover {
  transform: scale(2.8) rotate(-3deg);
}

.i3:hover {
  transform: scale(3.5) rotate(-3deg);
}

.i4:hover {
  transform: scale(2.4) rotate(-3deg);
}

.i5:hover {
  transform: scale(3.6) rotate(-3deg);
}

/* ⭐ Images des phrases */
.i1 { top: 38%; background-image: url("./1.png"); }
.i2 { top: 45%; background-image: url("./2.png"); }
.i3 { top: 53%; background-image: url("./3.png"); }
.i4 { top: 64%; background-image: url("./4.png"); }
.i5 { top: 72%; background-image: url("./5.png"); }

</style>
</head>

<body>

<!-- ⭐ WRAPPER DE CONTRÔLE -->
<div id="outer-container">

    <!-- ⭐ SCÈNE À ÉCHELLE FIXE -->
    <div id="stage-wrapper" class="homothety-stage">

        <div class="scene-adulte">
            <div class="zone-fond">

                <!-- ⭐ Icônes avec zoom individuel -->
                <div class="icone i1"></div>
                <div class="icone i2"></div>
                <div class="icone i3"></div>
                <div class="icone i4"></div>
                <div class="icone i5"></div>

            </div>
        </div>

    </div>
</div> <!-- fin outer-container -->

<!-- ⭐ SCRIPT HOMOTHÉTIQUE ANTI-BLOCAGE -->
<script>
function scaleStage() {
  const stage = document.getElementById("stage-wrapper");
  const container = document.getElementById("outer-container");

  const baseWidth = 500;
  const availableWidth = container.getBoundingClientRect().width;

  let scale = availableWidth / baseWidth;
  if (scale > 1) scale = 1;

  stage.style.transform = `scale(${scale})`;
}

scaleStage();
window.addEventListener("resize", scaleStage);

setTimeout(scaleStage, 200);
setTimeout(scaleStage, 600);
setInterval(scaleStage, 800);

</script>

</body>
</html>
