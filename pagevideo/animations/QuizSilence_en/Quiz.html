<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guess the reasons behind the silence</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background-image: url('./fond.jpg'); /* image de fond répétée */
      background-repeat: repeat;
      background-size: auto;
    }

    h2 { text-align: center; }

    #instructions { margin-bottom: 20px; font-size: 16px; line-height: 1.5; }

    .question {
      margin-bottom: 25px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
    }

    button {
      display: block;
      margin: 5px 0;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      border: none;
    }

    button:hover { background: #f0f0f0; }

    #startBtn {
      display: block;
      margin: 20px auto;
      padding: 0;
      width: min(60%,324px);
      border: none;
      background: transparent;
      cursor: pointer;
    }

    #startBtn:hover { background: transparent; }

    .correct { color: green; font-weight: bold; }
    .wrong { color: red; font-weight: bold; }

    #score { font-size: 18px; font-weight: bold; text-align: center; margin-top: 20px; }
    #timerBarContainer { width: 100%; height: 20px; background: #eee; border-radius: 10px; margin: 15px 0; overflow: hidden; }
    #timerBar { height: 100%; width: 100%; background: linear-gradient(to right, #4f918d, #eab400); transition: width 1s linear; }
    #progress { text-align: center; margin-bottom: 10px; font-weight: bold; }

    #quiz, #timerBarContainer, #progress, #score { display: none; }

    .result-img { max-width: 50%; height: auto; display: block; margin: 20px auto 0 auto; }
    .quiz-title-image { display:block; max-width:100%; height:auto; margin:0 auto 18px; }
    .image-button { display:block; margin:20px auto; padding:0; width:min(100%,540px); border:0; background:transparent!important; cursor:pointer; }
    .image-button:hover { background:transparent!important; }
    .image-button img { display:block; width:100%; height:auto; }
    #nextBtn { display:none; width:min(60%,324px); }

  </style>
</head>
<body>
  <img src="./raisons.png" alt="Guess the reasons behind the silence" class="quiz-title-image">

  <p id="instructions">
    This quiz invites you to explore why some victims remain silent in sport. 
    You have 15 seconds for each question. The green/orange bar shows the time remaining. Good luck!
  </p>

  <button id="startBtn" class="image-button" aria-label="Start the quiz"><img src="./button.png" alt="Start the quiz"></button>

  <div id="progress"></div>
  <div id="timerBarContainer">
    <div id="timerBar"></div>
  </div>
  <div id="quiz"></div>
  <button id="nextBtn" class="image-button" aria-label="Next question"><img src="./suivante.png" alt="Next question"></button>
  <div id="score"></div>
  <div id="resultImage"></div>

  <script>
    var questions = [
      { text: "Pressure on sporting careers: why stay silent?", answers: ["The abuser threatens the victim’s sporting career","Too many training sessions","A preference for privacy"], correct: 0 },
      { text: "Team loyalty: how can it lead to silence?", answers: ["Fear of damaging the club’s reputation","Wanting to become team captain","Believing no one is listening"], correct: 0 },
      { text: "Physical threats: which is an example?", answers: ["Threatening to withhold help in case of injury","Extra training sessions","Rewards"], correct: 0 },
      { text: "Family pressure: how can it lead to silence?", answers: ["Fear of disappointing family or not being believed","Family encourages the victim to speak up","Family is indifferent"], correct: 0 },
      { text: "Culture of toughness: how can it lead to silence?", answers: ["Abuse is seen as a rite of passage","Injuries are always treated","The coach ignores pain"], correct: 0 },
      { text: "Pressure to appear tough: how can it lead to silence?", answers: ["Shame about showing vulnerability","Wanting to prove their strength","Thinking nobody will notice"], correct: 0 },
      { text: "Distrust of institutions: why?", answers: ["Reports of abuse are handled poorly","Preferring to confide in friends","Seeking sporting advice"], correct: 0 }
    ];

    var currentQuestion = 0;
    var score = 0;
    var timeLeft = 15;
    var timer;

    var quizContainer = document.getElementById("quiz");
    var scoreContainer = document.getElementById("score");
    var timerBar = document.getElementById("timerBar");
    var progressContainer = document.getElementById("progress");
    var startBtn = document.getElementById("startBtn");
    var resultImage = document.getElementById("resultImage");
    var nextBtn = document.getElementById("nextBtn");

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function showQuestion() {
      if (currentQuestion >= questions.length) {
        quizContainer.innerHTML = "";
        timerBar.style.width = "0%";
        progressContainer.textContent = "";
        scoreContainer.textContent = "Final score: " + score + " / " + questions.length;

        resultImage.innerHTML = "";
        if (score >= 5) {
          resultImage.innerHTML = '<img src="./bravo.png" alt="Well done!" class="result-img">';
        } else {
          resultImage.innerHTML = '<img src="./progres.png" alt="Keep improving!" class="result-img">';
        }
        return;
      }

      var q = questions[currentQuestion];
      var answers = q.answers.map((ans, index) => ({text: ans, isCorrect: index === q.correct}));
      shuffleArray(answers);

      progressContainer.textContent = "Question " + (currentQuestion + 1) + " / " + questions.length;

      var html = '<div class="question"><p>' + q.text + '</p>';
      for (var i = 0; i < answers.length; i++) {
        html += '<button onclick="checkAnswer(' + i + ', ' + answers[i].isCorrect + ')">' + answers[i].text + '</button>';
      }
      html += '<p id="feedback"></p></div>';
      quizContainer.innerHTML = html;

      timeLeft = 15;
      timerBar.style.width = "100%";
      clearInterval(timer);
      timer = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
      timeLeft--;
      timerBar.style.width = (timeLeft / 15 * 100) + "%";
      if (timeLeft <= 0) {
        clearInterval(timer);
        document.getElementById("feedback").textContent = "⏰ Time’s up!";
        document.getElementById("feedback").className = "wrong";
        nextBtn.style.display = "block";
      }
    }

    function checkAnswer(choiceIndex, isCorrect) {
      clearInterval(timer);
      var feedback = document.getElementById("feedback");
      if (isCorrect) {
        feedback.textContent = "✅ Correct answer!";
        feedback.className = "correct";
        score++;
      } else {
        feedback.textContent = "❌ Incorrect answer.";
        feedback.className = "wrong";
      }
      nextBtn.style.display = "block";
    }

    nextBtn.addEventListener("click", function() {
      nextBtn.style.display = "none";
      currentQuestion++;
      showQuestion();
    });

    startBtn.addEventListener("click", function() {
      startBtn.style.display = "none";
      quizContainer.style.display = "block";
      timerBar.parentElement.style.display = "block";
      progressContainer.style.display = "block";
      scoreContainer.style.display = "block";
      showQuestion();
    });
  </script>
</body>
</html>
