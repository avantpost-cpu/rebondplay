  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#063e54;--blue:#064e61;--orange:#ff764b;--pink:#c697c7;--aqua:#79d3d7;--paper:#f7f4ef;--yellow:#efb416;--shadow:0 8px 12px rgba(0,0,0,.32);--content:min(90vw,2680px)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:300px;color:var(--ink);background:#bd8fbe url("../ressources/fond.jpg") center top/cover fixed;font-family:"Nunito",Arial,sans-serif}img{display:block;max-width:100%}a{color:inherit}button{font:inherit}.hand{font-family:"Patrick Hand",cursive;font-weight:400}
    .topbar{min-height:clamp(88px,6.15vw,183px);display:flex;align-items:center;justify-content:space-between;gap:34px;padding:14px 4.7%;background-image:url("../fond.jpg");background-position:center;background-size:cover;background-repeat:repeat;box-shadow:0 5px 14px rgba(0,0,0,.16);position:relative;z-index:2}.topbar::before{content:none}.topbar>*{position:relative;z-index:1}
    .brand{width:clamp(225px,15vw,445px);flex:none}.brand img{width:100%;height:auto;filter:none}.account{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,1.2vw,30px);min-width:0;color:#126176}.avatar{width:clamp(42px,3.25vw,76px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;background:#126176;color:#f7f4ef}.avatar svg{width:62%;height:62%;fill:currentColor}.account-copy{min-width:0}.account-name{font-size:clamp(14px,1.15vw,27px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account-meta{margin-top:3px;font-size:clamp(10px,.83vw,20px);font-weight:700;white-space:nowrap}.logout{min-height:50px;padding:0 clamp(12px,1.7vw,38px);border:0;border-left:1px solid rgba(8,47,74,.28);background:transparent;color:inherit;font-weight:900;cursor:pointer;white-space:nowrap}.logout:hover{color:#a23445}
    .slider{position:relative;width:100%;aspect-ratio:2982/625;min-height:220px;overflow:hidden;background:var(--blue);touch-action:pan-y}.slider-track{display:flex;width:100%;height:100%;transition:transform .7s cubic-bezier(.22,.72,.25,1);will-change:transform}.slide{position:relative;flex:0 0 100%;height:100%;overflow:hidden}.slide-image{width:100%;height:100%;object-fit:cover}.title-slide{background-image:url("slide_titre.jpg");background-repeat:no-repeat;background-size:auto 318.24%;background-position:center 13.93%}.slide-link{position:absolute;inset:0;z-index:2}.slide-link:focus-visible{outline:6px solid white;outline-offset:-10px}.slider-arrow{position:absolute;z-index:4;top:50%;translate:0 -50%;width:clamp(40px,3vw,66px);aspect-ratio:1;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);color:var(--blue);font-size:clamp(24px,2vw,43px);font-weight:900;box-shadow:0 5px 15px rgba(0,0,0,.23);cursor:pointer}.slider-arrow:hover{background:white;scale:1.06}.slider-arrow.prev{left:clamp(10px,1.3vw,35px)}.slider-arrow.next{right:clamp(10px,1.3vw,35px)}.slider-dots{position:absolute;z-index:5;left:50%;bottom:clamp(9px,1vw,23px);translate:-50%;display:flex;gap:10px}.slider-dot{width:13px;height:13px;padding:0;border:2px solid white;border-radius:50%;background:transparent;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}.slider-dot.active{background:white}
    .main-nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:0 8%;background:rgba(199,151,200,.94);backdrop-filter:blur(10px);box-shadow:0 5px 12px rgba(5,51,66,.12)}.main-nav a{min-height:clamp(68px,5.9vw,126px);display:flex;align-items:center;justify-content:center;gap:clamp(7px,.9vw,18px);border-bottom:4px solid transparent;text-decoration:none;font-size:clamp(13px,1.15vw,26px);font-weight:900;white-space:nowrap}.main-nav svg{width:clamp(22px,1.8vw,40px);height:clamp(22px,1.8vw,40px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.main-nav a:hover,.main-nav a.active{color:white;border-bottom-color:white}
    .content{width:var(--content);margin:auto;padding:clamp(26px,2.8vw,58px) 0 clamp(55px,6vw,120px)}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,2.2vw,54px)}.feature{position:relative;min-height:0;overflow:hidden;border-radius:clamp(18px,1.25vw,30px);color:white;box-shadow:0 8px 12px rgba(0,0,0,.32);isolation:isolate;transition:translate .25s,box-shadow .25s}.feature:hover{translate:0 -6px;box-shadow:0 10px 16px rgba(0,0,0,.36)}.feature-block{width:100%;height:auto}.feature-adults,.feature-young{background:transparent}.feature-title{position:relative;z-index:3;width:auto;height:clamp(25px,2.15vw,48px);margin:clamp(19px,1.8vw,38px) 0 0 clamp(20px,2vw,42px);object-fit:contain}.feature-illustration{position:absolute;z-index:1;right:0;bottom:0;width:auto;height:auto;object-fit:contain}.feature-adults{background:#065269}.feature-adults .feature-illustration{right:0;bottom:0;width:58%;max-width:none;max-height:none}.feature-young{background:#f47c4b}.feature-young .feature-illustration{right:0;bottom:0;width:55%;max-width:none;max-height:none}.tool-list{display:none}.feature-expo{background:#75d3d6}.feature-expo::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 75%,rgba(255,255,255,.22),transparent 34%)}
    .section-title{width:clamp(180px,20vw,522px);margin:clamp(28px,2.4vw,52px) 0 clamp(15px,1.4vw,30px)}.section-title img{width:100%;height:auto}.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,2.2vw,54px)}.resource{position:relative;min-height:clamp(135px,10.2vw,245px);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(14px,1.45vw,34px);padding:clamp(18px,1.7vw,38px);border-radius:clamp(18px,1.25vw,30px);background:rgba(250,249,245,.93);text-decoration:none;box-shadow:0 8px 18px rgba(3,42,56,.13);transition:translate .25s}.resource:hover{translate:0 -4px}.resource-icon{width:clamp(65px,6vw,135px);aspect-ratio:1;border-radius:clamp(13px,1vw,23px);display:grid;place-items:center;color:white}.resource-icon svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.resource h3{margin:0;font-size:clamp(17px,1.35vw,31px)}.resource p{margin:5px 0 0;font-size:clamp(11px,.92vw,21px);line-height:1.3}.resource-arrow{width:clamp(35px,2.7vw,62px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:white;font-size:clamp(20px,1.6vw,36px);font-weight:900}.video .resource-icon,.video .resource-arrow{background:#d9634c}.info .resource-icon,.info .resource-arrow{background:#08788a}.book .resource-icon,.book .resource-arrow{background:var(--yellow)}.resource.video{padding:0;min-height:0;background:transparent;box-shadow:none;overflow:hidden}.resource.video:hover{box-shadow:none}.resource-image{width:100%;height:auto;min-height:0;object-fit:contain;border-radius:inherit}
    .video-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:clamp(16px,3vw,52px);background:rgba(5,28,39,.72);backdrop-filter:blur(5px)}.video-modal.is-open{display:flex}.video-modal-panel{position:relative;width:min(100%,1180px);aspect-ratio:1.4;max-height:92vh;overflow:hidden;border-radius:26px;background:#f47c4b;box-shadow:0 18px 55px rgba(0,0,0,.42)}.video-modal-head{position:absolute;top:0;left:0;width:44%;height:auto;max-width:520px}.video-modal-hotspot{position:absolute;top:clamp(12px,2vw,28px);right:clamp(12px,2vw,28px);width:clamp(28px,4vw,58px);height:clamp(28px,4vw,58px);padding:0;border:0;background:transparent;cursor:pointer}.video-modal-hotspot img{width:100%;height:100%;object-fit:contain}.video-modal-content{display:none}.video-frame{position:absolute;top:18%;left:32%;width:63%;height:66%;padding:0;background:white}.video-frame iframe{display:block;width:100%;height:100%;border:0}.video-modal-content h2{margin:0 0 12px;font-size:clamp(22px,2.2vw,38px)}.video-modal-content p{margin:0;font-size:clamp(14px,1.2vw,20px)}
    @media(max-width:900px){.topbar{padding-inline:24px}.brand{width:210px}.account-meta{white-space:normal}.logout{font-size:12px;padding-inline:10px}.slider{aspect-ratio:16/4.7}.slide-image{object-fit:cover}.main-nav{padding:0;overflow-x:auto;grid-template-columns:repeat(5,minmax(128px,1fr))}.main-nav a{min-height:68px}.feature-grid,.resources{grid-template-columns:1fr}.feature{min-height:330px}.feature-adults .feature-illustration{width:58%}.feature-young .feature-illustration{width:55%}.resource{min-height:140px}}
    @media(max-width:580px){.topbar{align-items:flex-start;gap:16px;flex-wrap:wrap;padding:16px 18px}.brand{width:185px}.account{width:100%;justify-content:flex-start}.account-copy{flex:1}.logout{min-height:42px}.slider{min-height:240px;aspect-ratio:auto}.slide-image{object-position:center;object-fit:cover}.slider-arrow{width:38px;font-size:23px}.feature{min-height:300px}.feature-title{height:30px}.feature-adults .feature-illustration{right:-7%;width:56%}.feature-young .feature-illustration{right:-7%;width:56%}.resource{grid-template-columns:auto 1fr}.resource-arrow{display:none}.resource p{font-size:12px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.slider-track,.feature,.resource{transition:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#accueil" aria-label="RebondPlay Full — accueil"><img src="Logo_RebondPlay_full2.png" alt="RebondPlay Full"></a>
    <div class="account" aria-label="Compte connecté"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span><div class="account-copy"><div class="account-name" id="accountName">Bonjour</div><div class="account-meta" id="accountMeta"></div></div><button class="logout" id="logoutButton" type="button">Se déconnecter</button></div>
  </header>
  <section class="slider" id="slider" aria-label="Outils à la une">
    <div class="slider-track" id="sliderTrack">
      <article class="slide title-slide" role="img" aria-label="Bienvenue dans votre espace RebondPlay"></article>
      <article class="slide"><img class="slide-image" src="slide_MJ.jpg" alt="La Main Juste"><a class="slide-link" href="../lamainjuste/lamainjuste.html" aria-label="Ouvrir La Main Juste"></a></article>
      <article class="slide"><img class="slide-image" src="slide_BC.jpg" alt="La Bonne Conduite"><a class="slide-link" href="../bonneconduite/bonneconduite.html" aria-label="Ouvrir La Bonne Conduite"></a></article>
      <article class="slide"><img class="slide-image" src="slide_VF.jpg" alt="Vrai/Faux adulte"><a class="slide-link" href="../vraifaux/vraifaux.html" aria-label="Ouvrir Vrai/Faux adulte"></a></article>
    </div>
    <button class="slider-arrow prev" id="prevSlide" type="button" aria-label="Slide précédente">‹</button><button class="slider-arrow next" id="nextSlide" type="button" aria-label="Slide suivante">›</button><div class="slider-dots" id="sliderDots"></div>
  </section>
  <main class="content" id="accueil">
    <section class="feature-grid" aria-label="Espaces RebondPlay">
      <a class="feature feature-adults" id="adultes" href="../pageadultes/index.html"><img class="feature-block" src="blocadultes.png" alt="Pour les adultes"></a>
      <a class="feature feature-young" id="jeunes" href="../pagejeunes/index.html"><img class="feature-block" src="blocajeunes.png" alt="Pour les jeunes"></a>
      <a class="feature feature-expo" id="ressources-link" href="../ressources/index.html"><img class="feature-block" src="blocressources.png" alt="Ressources"></a>
    </section>
    <div class="section-title" id="ressources"><img src="titre1.png" alt="Ressources pédagogiques"></div>
    <section class="resources" aria-label="Ressources pédagogiques">
      <a class="resource video" href="#" aria-label="Ouvrir les vidéos"><img class="resource-image" src="bouton_video.png" alt="Vidéos — des contenus vidéo pour comprendre, expliquer et sensibiliser."></a>
      <a class="resource info" href="#"><span class="resource-icon"><svg viewBox="0 0 24 24"><path d="M12 3v9h9A9 9 0 1 1 12 3z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span><span><h3>Infographies</h3><p>Des synthèses visuelles claires et percutantes.</p></span><span class="resource-arrow">→</span></a>
      <a class="resource book" href="#"><span class="resource-icon"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4zM20 4h-4a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h4z"/></svg></span><span><h3>Livrets</h3><p>Des livrets pratiques à télécharger et à partager.</p></span><span class="resource-arrow">→</span></a>
    </section>
  </main>
  <div class="video-modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle">
    <div class="video-modal-panel">
      <img class="video-modal-head" src="../pagevideo/titrevideo.png" alt="">
      <button class="video-modal-hotspot" id="videoModalClose" type="button" aria-label="Fermer la fenêtre"><img src="../pagevideo/croixblanche.png" alt=""></button>
      <div class="video-frame"><iframe src="https://www.youtube.com/embed/skmCT1j101o?start=23&rel=0" title="Vidéo RebondPlay" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
    </div>
  </div>
  <script>
    (()=>{const storageKeys=["rebondplay_access_ok","rebondplay_abonnement_id","rebondplay_nom_structure","rebondplay_code","rebondplay_date_fin","rebondplay_prenom_contact","rebondplay_nom_contact"],get=key=>sessionStorage.getItem(key)||"";if(get("rebondplay_access_ok")!=="1"){location.replace("../index.html");return}const name=[get("rebondplay_prenom_contact"),get("rebondplay_nom_contact")].filter(Boolean).join(" ")||get("rebondplay_nom_structure");document.getElementById("accountName").textContent=`Bonjour ${name}`.trim();const endValue=get("rebondplay_date_fin");let meta=get("rebondplay_nom_structure");if(endValue){const end=new Date(`${endValue}T23:59:59`),days=Math.max(0,Math.ceil((end-Date.now())/86400000));meta=`Votre abonnement est encore valable ${days} jour${days>1?"s":""}`}document.getElementById("accountMeta").textContent=meta;document.getElementById("logoutButton").addEventListener("click",()=>{storageKeys.forEach(key=>sessionStorage.removeItem(key));location.replace("../index.html")});const slider=document.getElementById("slider"),track=document.getElementById("sliderTrack"),slides=[...track.children],dotsBox=document.getElementById("sliderDots"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;let current=0,timer=0,touchStart=0;const dots=slides.map((_,index)=>{const dot=document.createElement("button");dot.type="button";dot.className="slider-dot";dot.setAttribute("aria-label",`Afficher la slide ${index+1}`);dot.addEventListener("click",()=>{show(index);restart()});dotsBox.append(dot);return dot});function show(index){current=(index+slides.length)%slides.length;track.style.transform=`translateX(-${current*100}%)`;dots.forEach((dot,i)=>dot.classList.toggle("active",i===current))}function stop(){clearInterval(timer);timer=0}function start(){if(!reduced&&!timer)timer=setInterval(()=>show(current+1),3000)}function restart(){stop();start()}document.getElementById("prevSlide").addEventListener("click",()=>{show(current-1);restart()});document.getElementById("nextSlide").addEventListener("click",()=>{show(current+1);restart()});slider.addEventListener("mouseenter",stop);slider.addEventListener("mouseleave",start);slider.addEventListener("focusin",stop);slider.addEventListener("focusout",start);slider.addEventListener("touchstart",event=>{touchStart=event.changedTouches[0].clientX;stop()},{passive:true});slider.addEventListener("touchend",event=>{const distance=event.changedTouches[0].clientX-touchStart;if(Math.abs(distance)>45)show(current+(distance<0?1:-1));start()},{passive:true});document.addEventListener("visibilitychange",()=>document.hidden?stop():start());show(0);start()})()
      const videoLink=document.querySelector(".resource.video"),videoModal=document.getElementById("videoModal"),videoClose=document.getElementById("videoModalClose");function closeVideoModal(){videoModal.classList.remove("is-open");document.body.style.overflow=""}videoLink.addEventListener("click",event=>{event.preventDefault();videoModal.classList.add("is-open");document.body.style.overflow="hidden";videoClose.focus()});videoClose.addEventListener("click",closeVideoModal);videoModal.addEventListener("click",event=>{if(event.target===videoModal)closeVideoModal()});document.addEventListener("keydown",event=>{if(event.key==="Escape"&&videoModal.classList.contains("is-open"))closeVideoModal()});
  </script>
